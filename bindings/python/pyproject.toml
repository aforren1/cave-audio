[build-system]
# nanobind is PINNED EXACTLY, the same rule the root CMakeLists uses for dr_libs, cJSON and imgui:
# it generates the extension's whole binding layer, so a floating version would change the built
# artifact without a commit. Bump it deliberately. scikit-build-core is a build driver and takes a
# floor instead.
#
# nanobind 3.0.1 declares `Requires-Python: >=3.10` itself, so this pin IS the floor below:
# `requires-python` cannot be lower than what the build backend can install.
requires = ["scikit-build-core>=0.10", "nanobind==3.0.1"]
build-backend = "scikit_build_core.build"

[project]
name = "bw_audio"
dynamic = ["version"]
description = "Python binding for the bw_audio spatial audio engine (26-speaker CAVE array, binaural headphone render)"
readme = "README.md"
# 3.10 is the floor twice over: the pinned nanobind needs it, and it is the oldest Python a
# release wheel is built for. A source build on 3.9 is not supported.
requires-python = ">=3.10"
license = "GPL-3.0-only"
authors = [{ name = "Brainworks" }]
keywords = ["spatial audio", "ambisonics", "binaural", "psychophysics", "psychopy", "CAVE"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: C",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Sound/Audio",
]
dependencies = ["numpy>=1.23"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/aforren1/cave-audio"
Documentation = "https://github.com/aforren1/cave-audio/blob/main/docs/api.md"

# ---------------------------------------------------------------------------------------------
# The CMake source dir is the REPO ROOT, not this directory. The root CMakeLists resolves the ASIO
# SDK and the staged phonon against ${CMAKE_SOURCE_DIR}, so anything that makes this directory the
# top-level project silently produces a no-SDK, no-ASIO engine. bindings/python/CMakeLists.txt says
# the same thing at more length.
#
# The cost of that choice is that an SDIST cannot be built from here: the sources it would need sit
# above the project directory. Build wheels (`uv build --wheel`), or build from a repo checkout.
# ---------------------------------------------------------------------------------------------
[tool.scikit-build]
cmake.source-dir = "../.."
cmake.version = ">=3.20"
build-dir = "build/{wheel_tag}"
# src layout on purpose: with the package at the project root, a `pytest` run from this
# directory would import the SOURCE tree, which holds no extension, and fail on `_bwa`.
wheel.packages = ["src/bw_audio"]
# Only the extension, so a wheel build does not also compile the test suite and the tools.
build.targets = ["_bwa"]
# And only the wheel's OWN install rules. The root CMakeLists also installs the engine SDK
# (component bwa_sdk: the header, the import library, the CMake package files), which is a
# different product for a different consumer. scikit-build-core installs every component unless
# told which, so naming this one is what keeps a second copy of the engine out of the wheel.
install.components = ["bwa_python"]
# Version-specific by default; the override below promotes it to abi3 on a Python that can.
wheel.py-api = ""

[tool.scikit-build.cmake.define]
BWA_BUILD_PYTHON = "ON"
BWA_BUILD_TESTS = "OFF"

# One wheel per platform instead of one per Python. nanobind's STABLE_ABI targets the 3.12 limited
# API, so the tag can only be claimed by a build that actually used it - hence the version guard
# rather than a flat `py-api = "cp312"`, which would mislabel a 3.11 build.
[[tool.scikit-build.overrides]]
if.python-version = ">=3.12"
wheel.py-api = "cp312"

# The package version is BWA_VERSION in include/bw_audio.h, read at build time. A wheel can
# therefore never claim a version the library is not. It is also the release version: the release
# script writes the tag into the header and CI refuses a tag that disagrees, so a wheel out of
# release vX.Y.Z is bw_audio-X.Y.Z (docs/build.md, "Releasing").
[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "../../include/bw_audio.h"
regex = '''(?sm)^#define\s+BWA_VERSION_MAJOR\s+(?P<major>\d+).*?^#define\s+BWA_VERSION_MINOR\s+(?P<minor>\d+).*?^#define\s+BWA_VERSION_PATCH\s+(?P<patch>\d+)'''
result = "{major}.{minor}.{patch}"

[tool.pytest.ini_options]
testpaths = ["tests"]

# ---------------------------------------------------------------------------------------------
# cibuildwheel: the wheels a RELEASE ships, on all three desktops.
#
# WHY IT EXISTS BESIDE THE PLAIN BUILD. `uv build --wheel` on a runner tags the wheel for THAT
# machine: the runner image's glibc on Linux, the runner's own architecture on macOS, and on every
# platform the one interpreter the step happened to pin. None of that is what a release should hand
# a stranger. cibuildwheel builds each Python in turn, the Linux wheels inside a manylinux
# container and the macOS wheels for both Apple architectures at once, so the set installs
# anywhere. The three per-runner `uv build` steps stay exactly as they are: they are the FAST GATE,
# one per job, proving the binding still builds and tests on each desktop before this slower job
# runs at all.
#
# Run it the way CI does, from the REPOSITORY ROOT:
#     uvx cibuildwheel --platform linux bindings/python
# The package directory is bindings/python, but the project root has to be the repository, for
# the same reason cmake.source-dir points at "../..": the build needs the whole tree. cibuildwheel
# copies the working directory into the container, so the working directory is the repository.
# ---------------------------------------------------------------------------------------------
[tool.cibuildwheel]
# THREE wheels per platform, and only three. nanobind's STABLE_ABI targets the 3.12 limited API,
# so the cp312 build is tagged cp312-abi3 and runs on 3.12 and EVERY later Python: adding cp313 or
# cp314 here would build the same file again under a second name. 3.10 and 3.11 predate that
# limited API, so the overrides above leave them version-specific and each needs its own wheel.
# 3.10 is the floor - the pinned nanobind cannot install below it.
#
# The selector also settles two exclusions without a skip rule: `cp*` never matches PyPy, and the
# per-platform `archs` below never offer a 32-bit target.
build = ["cp310-*", "cp311-*", "cp312-*"]
# musl has no phonon here (the before-all builds one glibc phonon, in the manylinux image) and no
# audience: PsychoPy on Alpine is not a thing anyone is asking for.
skip = "*musllinux*"
test-requires = ["pytest", "numpy"]
# The INSTALLED wheel, in cibuildwheel's own fresh venv, with no source tree on the path - the
# same rule the three per-runner jobs follow. Nothing here touches a device: every engine in the
# suite is the null or the manual sink, which is what lets it run inside a container.
test-command = [
  "pytest -q --color=no {project}/bindings/python/tests",
  "python {project}/bindings/python/examples/offline_render.py --tests",
  "python {project}/bindings/python/examples/live_onset.py --tests",
]

[tool.cibuildwheel.linux]
# manylinux_2_28 (AlmaLinux 8, glibc 2.28), not the older manylinux2014: the engine links a C++
# static phonon, so the image's C++ toolchain is the floor that matters, and 2_28 carries a
# gcc-toolset new enough to compile it where manylinux2014's does not. It is also the image whose
# repositories still carry the two device backends' headers - CentOS 7's are on vault. glibc 2.28
# is RHEL 8, Debian 10 and Ubuntu 18.10 or newer, which covers every machine this engine would
# run an experiment on.
manylinux-x86_64-image = "manylinux_2_28"
before-all = "bash {project}/tools/phonon/cibw-before-all-linux.sh"
# The engine DLOPENS libasound and libjack, so neither is in its NEEDED list and auditwheel has
# nothing to graft. --exclude stays as a GUARD: copying either one in was always wrong (libjack has
# to be the one the running JACK server uses, and libasound is on every Linux desktop already), and
# the flag keeps that true if a future backend ever links one. Everything else the engine needs
# (libstdc++, libgcc, libm, libpthread) is in the manylinux policy, so a correct repair grafts
# nothing at all and never rewrites the extension's $ORIGIN runpath.
repair-wheel-command = "auditwheel repair --exclude libasound.so.2 --exclude libjack.so.0 -w {dest_dir} {wheel}"

[tool.cibuildwheel.windows]
# x64 only. The engine is an x64 build everywhere else in this repository (CI configures
# `-A x64`), and cibuildwheel's `auto` would otherwise offer x86 as well.
#
# No before-all: Windows never had one, and the engine arrives prebuilt from the engine SDK the
# windows job installed. Nothing here builds phonon.
archs = ["AMD64"]
# NO REPAIR. cibuildwheel runs `delvewheel repair` on Windows by default, and this wheel must not
# be repaired for two independent reasons.
#
# It FAILS outright: delvewheel walks the extension's imports, reaches bw_audio.dll and raises
# `FileNotFoundError: Unable to find library: bw_audio.dll` - the engine is already inside the
# package, beside the .pyd, which is not a directory delvewheel searches.
#
# And a repair that did succeed would be worse than none. delvewheel MANGLES the name of every
# library it vendors (bw_audio.dll becomes bw_audio-<hash>.dll in a bw_audio.libs/ directory) and
# patches the load path into the extension. That breaks the one rule this package's Windows half
# rests on: the engine sits beside the extension and __init__.py reaches it with
# os.add_dll_directory. It would also break the CI assertion that the engine inside the wheel is
# the engine SDK's byte for byte.
#
# There is nothing to graft anyway. phonon is linked statically into the engine, the ASIO SDK too,
# and the MSVC runtime is a system dependency delvewheel excludes by default - which is the same
# answer auditwheel and delocate give on the other two platforms.
repair-wheel-command = ""

[tool.cibuildwheel.macos]
# Every wheel covers both Apple architectures. The engine library inside it is universal already
# whenever CI builds it, so this only says the extension must be too. cibuildwheel gets the
# universal2 python.org installer for each interpreter it builds, 3.10 and 3.11 included.
archs = ["universal2"]
before-all = "bash {project}/tools/phonon/cibw-before-all-macos.sh"
# MACOSX_DEPLOYMENT_TARGET matches the only deployment target anything in this tree names:
# phonon's core/CMakeLists.txt asks for 10.13 and the engine asks for nothing, so 10.13 is the
# number the archives inside the wheel were built for. It is cibuildwheel's own universal2
# default too, which keeps the wheel's tag predictable. Clang raises the arm64 slice to 11.0 by
# itself, because no Mac ran arm64 before it.
#
# ARCHFLAGS rather than -DCMAKE_OSX_ARCHITECTURES: scikit-build-core translates ARCHFLAGS into
# that CMake variable itself, and its own SKBUILD_CMAKE_DEFINE escape hatch separates defines
# with a semicolon - the same character the value needs.
environment = { MACOSX_DEPLOYMENT_TARGET = "10.13", ARCHFLAGS = "-arch x86_64 -arch arm64" }
