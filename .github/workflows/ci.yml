# CI: build + test the core engine ("the C part"), and package bw_audio.dll for
# limited distribution as a workflow artifact (repo access required to download).
#
# Scope (deliberate, see third_party/README.md):
#   - ASIO backend: BUILT. The SDK is fetched from Steinberg's official URL (the
#     repo's documented one-liner) and cached; it is dual-licensed GPLv3/proprietary
#     and this project uses the GPLv3 option, consistent with the repo LICENSE — so
#     the artifact is redistributable under GPLv3 (source = this repo at the commit).
#   - Steam Audio: BUILT STATICALLY (the patched phonon core, recipe =
#     third_party/README.md, driven by .github/actions/build-phonon), cached on the
#     submodule sha + patch hash — the first run pays the phonon build, later runs
#     restore it. The with-SDK tests (reflect/bake/path/steam_decode) run, binaural is
#     the real HRTF decode, and phonon lives INSIDE bw_audio.dll: there is no second
#     file to ship or to keep beside it. On a tag its corresponding source ships too.
#   - Tools (playground/layout_tool/calib_view + calibrate/zylia_probe): BUILT and
#     shipped in the artifact. Their imgui-test-engine UI suites need a display +
#     OpenGL, which runners don't have — ctest excludes those three suites here
#     (they run locally / at the rig).
#   - Godot binding: BUILT and TESTED. Unlike the imgui tools, Godot's --headless
#     needs no display or GL, so the demo scenes and the Godot playground's self-test
#     are ordinary CI. Its own build trees (GODOTCPP_TARGET is build-wide, and a
#     shippable addon needs both editor and template_release), cached on the pinned
#     godot-cpp commit. Ships as a fourth release asset.
#   - Android: CROSS-BUILT in its own job (arm64-v8a and x86_64, android-26), with a static
#     phonon per ABI so an APK gets the HRTF decode, occlusion, pathing and the reflection bed
#     inside libbw_audio.so, and shipped as its own artifact. It also builds the Godot GDExtension for arm64-v8a and
#     hands both libraries to the Windows job, which is the only place that packs the
#     bindings. No emulator: see the android job's own note.
#   - Linux and macOS: the two portability jobs SHIP too. Each builds its own Godot GDExtension
#     (both flavours) and hands the extension plus the engine library to the Windows job, the same
#     way android does, so one addon and one Unity package carry every platform. Each also uploads
#     a standalone engine artifact of its own. macOS builds UNIVERSAL (x86_64 + arm64) and is
#     unsigned; see those jobs' notes.
#   - MATLAB and Octave binding: the MEX is built INSIDE each desktop job, after that job's
#     engine build, so it links that platform's engine (ASIO/WASAPI, JACK/ALSA, the universal
#     dylib) rather than a second one. The Windows job assembles the three into ONE toolbox folder
#     with a bin/<arch>/ per platform and ships it as a release asset. Octave's MEX is built on
#     Linux only; Octave users elsewhere build it with mkoctfile. UNVERIFIED LOCALLY: no runner
#     MATLAB is reachable from here, so those steps come from mathworks/ci-configuration-examples.
#   - Python wheels: every desktop job builds one with `uv build --wheel` as its own fast gate,
#     and a separate `wheels` job builds the two a RELEASE ships - Linux inside a manylinux
#     container, macOS as one universal2 file - with cibuildwheel. Windows has no such job: its
#     wheel already names one ABI and one architecture.
#   - Configs: x64 only. RelWithDebInfo is the full build (tested + tools);
#     Debug builds the engine + bwa_minimal for downstream debugging (smoke-run).
#
# No audio hardware on runners: the test descs force the null sink (bwa_desc.sink
# = BWA_SINK_NULL) and everything else auto-falls-back to it, by design.
name: ci

on:
  push:
    branches: [main]
    tags: ['v*']        # a tag additionally RELEASES the Unity package (see the release steps)
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write       # the release step attaches the .tgz; everything else is read-only

env:
  # The Godot editor CI tests against, and the godot-cpp commit the extension builds against.
  # These two must agree: godot-cpp's bundled extension_api.json declares which engine version
  # its generated bindings target. Bump them together, and keep GODOT_CPP_COMMIT in step with
  # BWA_GODOT_CPP_COMMIT in bindings/godot/CMakeLists.txt (this one only keys the cache).
  GODOT_VERSION: 4.7.1-stable
  GODOT_CPP_COMMIT: ba0edfed90512ec64aba51d4295a3e7e30112f86

jobs:
  windows:
    runs-on: windows-latest
    # Every other platform's libraries are packed INTO both bindings, and only a Windows machine can
    # pack them (the two flavours of the Godot extension and the engine DLL are MSVC builds). So this
    # job waits for the three cross-builds rather than reproducing them: an NDK build inside this job
    # would add the godot-cpp android compile to the longest job in the matrix, for a library ubuntu
    # already has, and a Linux or macOS build is not reproducible here at any price. The cost is the
    # other jobs' wall time, which is minutes against this job's phonon build - and they run in
    # parallel with each other.
    # The wheels job joins that list for the release: it builds the manylinux and universal2
    # wheels, and the release step below attaches them beside this job's Windows one.
    needs: [android, linux, macos, wheels]
    timeout-minutes: 75   # the uncached phonon build is the long pole; cached runs are far under
    steps:
      - uses: actions/checkout@v6
        # no submodules by default: steam-audio-source is fetched only on a phonon cache miss

      - name: Cache ASIO SDK
        id: asiosdk
        uses: actions/cache@v5
        with:
          path: third_party/asiosdk
          key: asiosdk-v1   # bump manually to pick up a new Steinberg release

      - name: Fetch ASIO SDK (Steinberg, GPLv3 option)
        if: steps.asiosdk.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          curl.exe -fsSL -o asiosdk.zip https://www.steinberg.net/asiosdk
          Expand-Archive asiosdk.zip -DestinationPath asiosdk_tmp
          # the zip's top-level dir name varies by release — locate common/asio.h and take its parent
          $hit = Get-ChildItem asiosdk_tmp -Recurse -Filter asio.h |
                 Where-Object { $_.Directory.Name -eq 'common' } | Select-Object -First 1
          if (-not $hit) { throw "asio.h not found in the Steinberg zip — layout changed?" }
          Move-Item $hit.Directory.Parent.FullName third_party/asiosdk
          Remove-Item asiosdk.zip, asiosdk_tmp -Recurse -Force

      - name: Phonon cache key (submodule sha, no checkout needed)
        id: phonon-key
        shell: bash
        run: echo "sha=$(git rev-parse HEAD:third_party/steam-audio-source)" >> "$GITHUB_OUTPUT"

      - name: Cache phonon (built Steam Audio core)
        id: phonon
        uses: actions/cache@v5
        with:
          path: third_party/steam-audio-artifacts
          key: phonon-v1-${{ steps.phonon-key.outputs.sha }}-${{ hashFiles('third_party/patches/**') }}

      # The recipe is a composite action so the Linux, macOS and Android phonon builds can call it
      # instead of copying it (docs/backends.md). Its inputs are documented in the action itself.
      - name: Build phonon (cache miss only; recipe = third_party/README.md)
        if: steps.phonon.outputs.cache-hit != 'true'
        uses: ./.github/actions/build-phonon
        with:
          platform: windows
          arch: x64
          toolchain: vs2022
          stage-dir: windows-x64

      - name: Configure
        shell: bash
        run: |
          # No -G pin: CMake defaults to the newest Visual Studio on the runner. Pinning
          # "Visual Studio 17 2022" broke when the windows-latest image dropped VS 2022.
          #
          # No BWA_BUILD_MATLAB here: the windows-latest image carries neither MATLAB nor Octave,
          # so the option would find no toolchain and build nothing. The linux job is where that
          # binding is built and tested (docs/build.md, the CI section).
          cmake -S . -B build -A x64 \
                -DBWA_BUILD_PLAYGROUND=ON \
                -DBWA_BUILD_CALIBVIEW=ON \
                -DBWA_BUILD_CALIBRATE=ON | tee configure.log
          # the artifact must contain the production device path AND the HRTF decode —
          # fail loudly if either didn't wire up
          grep -q "ASIO backend ENABLED" configure.log
          grep -q "Steam Audio ENABLED" configure.log

      - name: Build (RelWithDebInfo — everything)
        run: cmake --build build --config RelWithDebInfo

      - name: Build (Debug — engine + smoke only)
        run: cmake --build build --config Debug --target bw_audio bwa_minimal

      - name: Test
        # -E: the GUI UI suites need a display + OpenGL; everything else runs
        run: ctest --test-dir build -C RelWithDebInfo --output-on-failure -E '^(playground|layout_tool|calib_view)$'

      - name: Smoke (Debug)
        # the Debug dll ships too — prove it loads and runs a lifecycle
        # (no device on the runner: the AUTO sink policy falls back to the silent null sink)
        run: build/Debug/bwa_minimal.exe

      # ---- the MATLAB MEX ------------------------------------------------------------------------
      # UNVERIFIED LOCALLY on a runner: written from the patterns in
      # https://github.com/mathworks/ci-configuration-examples. setup-matlab needs no license token
      # on a GitHub-hosted runner for a public repository, and MSVC - already here for the engine -
      # is a compiler MATLAB supports for MEX on Windows.
      #
      # Inside this job, after the engine build, so the MEX links the DLL this job already produced
      # with ASIO, WASAPI and a static phonon intact, rather than a second engine built elsewhere.
      #
      # No Octave here: the Windows runner has none, and installing one through choco to build a
      # second MEX is a follow-up. An Octave user on Windows builds with mkoctfile
      # (bindings/matlab/README.md), and the linux job publishes the one Octave MEX that CI makes.
      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v2
        with:
          # Pinned, so a new MathWorks release cannot change overnight what this job tested.
          release: R2024b

      - name: Configure and build the MATLAB MEX
        shell: bash
        run: |
          # setup-matlab puts the launcher on PATH but not matlabroot, and FindMatlab wants the
          # root. Ask MATLAB itself rather than guessing the install layout.
          root="$(matlab -batch 'disp(matlabroot)' | tail -1 | tr -d '\r')"
          echo "matlabroot: $root"
          test -d "$root"
          # The SAME build tree. Reconfiguring only adds the MATLAB target; nothing rebuilds.
          cmake -S . -B build -DBWA_BUILD_MATLAB=ON -DMatlab_ROOT_DIR="$root" | tee matlab-configure.log
          # LOUD on the one failure these steps exist to catch: FindMatlab not locating the
          # action's install. The option skips SILENTLY when it finds no toolchain, so without
          # this the job would build nothing, run nothing, and pass.
          grep -q "MATLAB MEX enabled" matlab-configure.log
          cmake --build build --config RelWithDebInfo --target bwa_mex_matlab
          test -s bindings/matlab/bin/matlab/win-x64/bwa_mex.mexw64
          test -s bindings/matlab/bin/matlab/win-x64/bw_audio.dll

      - name: Test the MATLAB binding
        uses: matlab-actions/run-command@v2
        with:
          # run-command fails the step on an uncaught error, so raising IS the failure signal.
          # run_tests returns 77 when no MEX was staged, which is a failure here: the step above
          # was supposed to stage one.
          command: |
            cd("bindings/matlab/tests");
            rc = run_tests();
            cd(fullfile("..", "examples"));
            rc = rc + offline_render("--tests");
            rc = rc + live_onset("--tests");
            rc = rc + AudioTunnel3DDemo_bwa("--tests");
            if rc ~= 0
                error("bwa:ci", "the MATLAB binding reported %d failing check groups", rc);
            end

      # ---- Godot binding ---------------------------------------------------------------------
      # Its own build trees, because GODOTCPP_TARGET is a build-WIDE choice in godot-cpp: one
      # tree yields one library flavour, and a shippable addon needs two (editor for the editor,
      # template_release for exported games). tools/godot/pack.ps1 builds both.
      #
      # Unlike the three imgui tools, these tests DO run here: Godot's --headless mode needs no
      # display or GL, so the demo scenes and the playground self-test are ordinary CI.
      - name: Cache Godot editor
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: godot-bin
          key: godot-${{ env.GODOT_VERSION }}

      - name: Fetch Godot editor
        if: steps.godot-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          # The standard build, not mono: a GDExtension needs no .NET runtime, and the mono
          # download is much larger for nothing.
          V=${GODOT_VERSION}
          curl -fsSL -o godot.zip \
            "https://github.com/godotengine/godot/releases/download/${V}/Godot_v${V}_win64.exe.zip"
          mkdir -p godot-bin && unzip -q godot.zip -d godot-bin
          test -f "godot-bin/Godot_v${V}_win64.exe"

      - name: Cache godot-cpp build
        uses: actions/cache@v4
        with:
          # Both trees: godot-cpp generates and compiles ~2100 binding files per flavour, which
          # dwarfs our own nine. Keyed on the PINNED COMMIT, so bumping it invalidates cleanly;
          # our sources rebuild incrementally on top.
          path: |
            build-godot-editor
            build-godot-template_release
          key: godot-cpp-${{ env.GODOT_CPP_COMMIT }}-${{ runner.os }}

      - name: Test (Godot binding)
        shell: bash
        run: |
          # BWA_BUILD_TESTS explicitly ON: this tree is CACHED between runs, so a stale cache
          # entry with it off would leave ctest selecting nothing.
          cmake -S . -B build-godot-editor -A x64 \
                -DBWA_BUILD_GODOT=ON -DGODOTCPP_TARGET=editor -DBWA_BUILD_TESTS=ON \
                -DBWA_GODOT_EXE="$PWD/godot-bin/Godot_v${GODOT_VERSION}_win64.exe"
          cmake --build build-godot-editor --config RelWithDebInfo --target bwa_gdextension test_godot_room
          # --no-tests=error: an empty selection is a FAILURE, not a pass. Without it a broken
          # filter, a missing BWA_GODOT_EXE or a stale cache all look exactly like success.
          ctest --test-dir build-godot-editor -C RelWithDebInfo --output-on-failure \
                --no-tests=error -R '^godot_'

      # Both packs carry an Android library, and neither script can cross-build one here. The android
      # job staged them under a FIXED artifact name (versioned names are for the artifacts a human
      # downloads), so this step needs no version plumbing.
      - name: Download the Android libraries (built by the android job)
        uses: actions/download-artifact@v6
        with:
          name: android-pack-input
          path: pack-android

      - name: Download the Linux libraries (built by the linux job)
        uses: actions/download-artifact@v6
        with:
          name: linux-pack-input
          path: pack-linux

      - name: Download the macOS libraries (built by the macos job)
        uses: actions/download-artifact@v6
        with:
          name: macos-pack-input
          path: pack-macos

      # The two RELEASE wheels: manylinux and universal2, built by the wheels job. They are not
      # the pack-linux/pack-macos wheels - those are the per-runner fast gate, tagged for the
      # runner's own glibc and architecture, and they stay artifacts.
      - name: Download the release wheels (built by the wheels job)
        uses: actions/download-artifact@v6
        with:
          pattern: release-wheel-*
          merge-multiple: true
          path: wheelhouse

      - name: Pack Godot addon
        id: packgd
        shell: pwsh
        run: |
          # -SkipBuild is wrong here: the editor tree is built but template_release is not, and
          # pack.ps1 refuses to ship a manifest whose libraries are missing. The three -*From
          # switches keep it from trying to cross-build the other platforms on a runner that has
          # no toolchain for any of them.
          $a = @{ OutDir = 'dist/godot'; AndroidFrom = (Resolve-Path 'pack-android/godot').Path
                  LinuxFrom = (Resolve-Path 'pack-linux/godot').Path
                  MacFrom   = (Resolve-Path 'pack-macos/godot').Path }
          if ($env:GITHUB_REF -like 'refs/tags/v*') { $a.Version = $env:GITHUB_REF_NAME.TrimStart('v') }
          ./tools/godot/pack.ps1 @a

      - name: Stage dist
        shell: pwsh
        run: |
          # -Force = mkdir -p (safe on DIRECTORIES; it truncates only files). Needed since the
          # Godot pack step runs first and already creates dist/godot, so dist/ exists here.
          New-Item -ItemType Directory -Force dist, dist/RelWithDebInfo, dist/Debug | Out-Null
          Copy-Item include/bw_audio.h,
                    LICENSE,
                    THIRD_PARTY-NOTICES.md dist/
          # GPLv3 corresponding source for the ASIO SDK statically compiled into bw_audio.dll.
          # The SDK is redistributable under its GPLv3 option, so ship its source BESIDE the
          # binaries (its own archive, deliberately NOT folded into the engine bundle) — a DLL
          # recipient then has the complete corresponding source, not just a fetch URL (GPLv3
          # section 6). Rides in this workflow artifact and, on a tag, as a third release asset.
          Compress-Archive -Path third_party/asiosdk -DestinationPath dist/asio-sdk-src.zip -Force
          # the JSONs live NEXT TO the tools: playground/layout_tool resolve
          # ./cave_layout.json + ./constraints.json relative to their working dir
          Copy-Item examples/cave_layout.json,
                    examples/constraints.json dist/RelWithDebInfo/
          Copy-Item build/RelWithDebInfo/bw_audio.dll,
                    build/RelWithDebInfo/bw_audio.lib,
                    build/RelWithDebInfo/bw_audio.pdb,
                    build/RelWithDebInfo/bwa_minimal.exe,
                    build/RelWithDebInfo/bwa_playground.exe,
                    build/RelWithDebInfo/bwa_layout_tool.exe,
                    build/RelWithDebInfo/bwa_calib_view.exe,
                    build/RelWithDebInfo/bwa_calibrate.exe,
                    build/RelWithDebInfo/bwa_zylia_probe.exe dist/RelWithDebInfo/
          Copy-Item build/Debug/bw_audio.dll,
                    build/Debug/bw_audio.lib,
                    build/Debug/bw_audio.pdb,
                    build/Debug/bwa_minimal.exe dist/Debug/
          @"
          bw_audio win64 — limited distribution build
          commit   ${{ github.sha }} (${{ github.ref_name }})
          built    $((Get-Date).ToUniversalTime().ToString('s'))Z  (GitHub Actions run ${{ github.run_id }})
          try      RelWithDebInfo\bwa_playground.exe — needs no audio device (renders
                   silently, the 3D view + meters stay live); bwa_playground --help for keys
          needs    the Microsoft VC++ x64 runtime (vcruntime140*.dll). Any machine with
                   Visual Studio has it; otherwise https://aka.ms/vs/17/release/vc_redist.x64.exe
          backends ASIO=yes  SteamAudio=yes (patched phonon 4.8.1+10, linked STATICALLY:
                   HRTF decode, occlusion, reflections, pathing — third_party/README.md)
          contents RelWithDebInfo/ — bw_audio.dll/.lib/.pdb (phonon is inside the dll;
                   there is no second library to keep beside it),
                   bwa_minimal.exe (smoke check: runs the whole client lifecycle, no
                   hardware needed), tools: bwa_playground / bwa_layout_tool /
                   bwa_calib_view (GUI — need a display), bwa_calibrate + bwa_zylia_probe
                   (console), cave_layout.json + constraints.json (example layout +
                   room, read by the tools from their own directory). Debug/ — engine
                   dll/.lib/.pdb + bwa_minimal. Root — include/bw_audio.h.
                   x64 only.
          license  GPLv3 (LICENSE) + THIRD_PARTY-NOTICES.md. Complete corresponding
                   source: this repo at
                   https://github.com/aforren1/cave-audio/tree/${{ github.sha }}
                   PLUS the ASIO SDK source (statically linked into bw_audio.dll) in
                   asio-sdk-src.zip beside these files — also a separate release asset.
                   Steam Audio is statically linked too (Apache-2.0); on a tagged
                   release its source ships as bw_audio-steam-audio-src-<tag>.zip.
          "@ | Out-File -Encoding utf8 dist/DIST.txt
          Get-Content dist/DIST.txt

      # Corresponding source for the OTHER statically linked dependency. phonon used to ship as its
      # own DLL, which made the pinned-commit link enough; inside bw_audio.dll it is the same case as
      # the ASIO SDK, so it gets the same treatment - the source beside the binary, not a URL to
      # chase. Apache-2.0 does not demand this (section 4 wants the license and the notices, both of
      # which ship already); GPLv3 section 6 governs the combined work, and shipping is cheaper than
      # arguing about which half of the DLL a recipient is entitled to. Tags only: a cached run has
      # no submodule checkout, and paying for one on every push to buy nothing would be silly.
      - name: Stage Steam Audio corresponding source (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $sha = (git rev-parse HEAD:third_party/steam-audio-source).Trim()
          if (-not (Test-Path third_party/steam-audio-source/.git)) {
            git submodule update --init --depth 1 third_party/steam-audio-source
            if (-not $?) { git submodule update --init third_party/steam-audio-source }
          }
          $zip = (Join-Path (Get-Location) 'dist/steam-audio-src.zip')
          if (Test-Path $zip) { Remove-Item $zip -Force }
          # The COMMIT, not the working tree: the build step applies our patch in place, and the
          # patch travels as itself (below) so a recipient can see exactly what we changed.
          git -C third_party/steam-audio-source archive --format=zip --prefix="steam-audio-$sha/" -o $zip HEAD
          if (-not $?) { throw "git archive of the steam-audio submodule failed" }
          $readme = @"
          Steam Audio corresponding source for bw_audio ${{ github.ref_name }}.

          Upstream:  https://github.com/ValveSoftware/steam-audio
          Commit:    $sha
          License:   Apache-2.0 (LICENSE.md in the tree above)

          bw_audio links this statically into bw_audio.dll. It is built with the recipe in
          third_party/README.md ("Steam Audio"), BUILD_SHARED_LIBS=OFF and --minimal, after
          applying the one patch in patches/ below. The tree here is the unpatched upstream
          commit, so apply the patch to reproduce the build:

            git apply patches/phonon-multiplyaccumulate-align.patch
          "@
          New-Item -ItemType Directory -Force dist/sa-extra/patches | Out-Null
          $readme | Out-File -Encoding ascii dist/sa-extra/README.txt
          Copy-Item third_party/patches/*.patch dist/sa-extra/patches/
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $z = [IO.Compression.ZipFile]::Open($zip, 'Update')
          try {
            foreach ($f in Get-ChildItem dist/sa-extra -Recurse -File) {
              $rel = $f.FullName.Substring((Resolve-Path dist/sa-extra).Path.Length + 1).Replace([char]92, '/')
              [IO.Compression.ZipFileExtensions]::CreateEntryFromFile($z, $f.FullName, "steam-audio-$sha/$rel") | Out-Null
            }
          } finally { $z.Dispose() }
          Remove-Item dist/sa-extra -Recurse -Force
          "staged $zip ($([math]::Round((Get-Item $zip).Length / 1MB, 1)) MB)"

      # The Unity package. Packed on EVERY run (not just tags) so a broken package - a missing .meta,
      # a tarball that somehow lost its DLLs - fails the build rather than the release. On a tag the
      # version is stamped from that tag (TAG below); off a tag pack.ps1 derives a git-describe dev
      # version. The step exports whichever it used as `steps.pack.outputs.version`, which names the
      # artifacts below. It goes in its OWN folder (dist/unity), because engine consumers and Unity
      # consumers want different things and the release below ships them as separate assets.
      - name: Pack UPM package
        id: pack
        shell: pwsh
        env:
          TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: |
          # -PluginsFrom pins RelWithDebInfo: the Debug build above ALSO POST_BUILD-stages into the
          # package folder (last config wins), so packing without it would ship the Debug engine.
          # NB: splat a HASHTABLE, not an array. Array splatting binds POSITIONALLY, so '-PluginsFrom'
          # would land in $Version and the trailing value would have no parameter left to bind to.
          $a = @{ PluginsFrom = 'build/RelWithDebInfo'; OutDir = 'dist/unity'
                  AndroidFrom = (Resolve-Path 'pack-android/unity').Path
                  LinuxFrom   = (Resolve-Path 'pack-linux/unity').Path
                  MacFrom     = (Resolve-Path 'pack-macos/unity').Path }
          if ($env:TAG) { $a.Version = $env:TAG }           # the tag is the version; pack stamps it into the manifest
          ./tools/upm/pack.ps1 @a

      # ---- the MATLAB toolbox ----------------------------------------------------------------
      # ONE folder a MATLAB user unzips and adds to their path, carrying every platform's MEX. A
      # MEX is per platform (.mexw64, .mexa64, .mexmaca64) and the lab's MATLAB users are on
      # Windows, so shipping only the one CI could build most cheaply would serve the wrong half.
      # This job is where the three meet: it built the Windows pair and downloaded the other two
      # in the pack inputs above.
      #
      # bin/<arch>/ uses MATLAB's OWN architecture names, which is what `computer('arch')` answers
      # and what +bwa/arch_dir.m looks for. The build tree's layout (bin/<matlab|octave>/...) is a
      # different one, on purpose: a build stages two interpreters side by side and a release
      # ships one.
      #
      # No Octave MEX in here. Octave's extension is `.mex` on every platform, so three of them
      # could not coexist under one name-per-arch layout without a second rule, and CI only builds
      # one anyway (the linux job). Octave users build with mkoctfile; the linux artifact carries
      # the one that exists.
      - name: Assemble the MATLAB toolbox
        shell: pwsh
        run: |
          $tb = 'dist/matlab/bw_audio-matlab'
          New-Item -ItemType Directory -Force `
            "$tb/bin/win64", "$tb/bin/glnxa64", "$tb/bin/maca64" | Out-Null

          Copy-Item -Recurse bindings/matlab/+bwa      "$tb/"
          Copy-Item -Recurse bindings/matlab/examples  "$tb/"
          Copy-Item bindings/matlab/README.md          "$tb/"
          # GPLv3 travels with the binaries, the same rule every other pack here follows.
          Copy-Item LICENSE, THIRD_PARTY-NOTICES.md    "$tb/"

          Copy-Item bindings/matlab/bin/matlab/win-x64/bwa_mex.mexw64  "$tb/bin/win64/"
          Copy-Item bindings/matlab/bin/matlab/win-x64/bw_audio.dll    "$tb/bin/win64/"
          Copy-Item pack-linux/matlab/bwa_mex.mexa64                   "$tb/bin/glnxa64/"
          Copy-Item pack-linux/matlab/libbw_audio.so                   "$tb/bin/glnxa64/"
          Copy-Item pack-macos/matlab/bwa_mex.mexmaca64                "$tb/bin/maca64/"
          Copy-Item pack-macos/matlab/libbw_audio.dylib                "$tb/bin/maca64/"

          # Assert all three BEFORE zipping. A toolbox missing one platform installs perfectly on
          # the other two and fails only on somebody else's machine, which is the shape of defect
          # this whole assembly exists to avoid.
          foreach ($p in @("$tb/bin/win64/bwa_mex.mexw64",
                           "$tb/bin/glnxa64/bwa_mex.mexa64",
                           "$tb/bin/maca64/bwa_mex.mexmaca64")) {
            if (-not (Test-Path $p) -or (Get-Item $p).Length -eq 0) { throw "missing or empty: $p" }
          }
          Get-ChildItem -Recurse $tb | Where-Object { -not $_.PSIsContainer } |
            Select-Object FullName, Length

      - name: Upload artifact (MATLAB toolbox, every platform)
        uses: actions/upload-artifact@v6
        with:
          name: bw_audio-matlab-${{ steps.pack.outputs.version }}-r${{ github.run_number }}
          path: dist/matlab/bw_audio-matlab/
          retention-days: 30
          if-no-files-found: error

      # ---- Python wheel (nanobind) --------------------------------------------------------------
      # Built here rather than in a job of its own, because a wheel carries the ENGINE LIBRARY
      # inside it and that library is this job's MSVC build. The wheel is tagged cp312-abi3, so one
      # file per platform serves Python 3.12 and every later version.
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Build the Python wheel
        shell: bash
        run: |
          uv python install 3.12
          # --python 3.12 pins the tag rather than inheriting whatever the runner image has on
          # PATH. Anything 3.12 or later produces the same abi3 wheel; pinning makes the ASSERTION
          # below meaningful instead of a report of the image's default.
          (cd bindings/python && uv build --wheel --python 3.12 --out-dir "$GITHUB_WORKSPACE/dist/python")
          whl=$(ls "$GITHUB_WORKSPACE"/dist/python/*.whl)
          echo "built $(basename "$whl")"
          # The stable ABI is the whole point of the 3.12 floor: without it there would be one
          # wheel per Python per platform. A version-specific tag here means nanobind's STABLE_ABI
          # did not engage, so fail rather than ship a wheel that only runs on one interpreter.
          case "$(basename "$whl")" in
            *-cp312-abi3-*) : ;;
            *) echo "expected a cp312-abi3 wheel, got $(basename "$whl")"; exit 1 ;;
          esac

      - name: Test the Python wheel (from the INSTALLED wheel, not the source tree)
        shell: bash
        run: |
          uv venv --python 3.12 .wheelenv
          uv pip install --python .wheelenv pytest numpy "$GITHUB_WORKSPACE"/dist/python/*.whl
          # No PYTHONPATH and no build tree on the path: this is the wheel a user would install.
          .wheelenv/Scripts/python -m pytest -q --color=no bindings/python/tests
          .wheelenv/Scripts/python bindings/python/examples/offline_render.py --tests
          .wheelenv/Scripts/python bindings/python/examples/live_onset.py --tests

      - name: Upload artifact (Python wheel)
        uses: actions/upload-artifact@v6
        with:
          name: bw_audio-python-win64-${{ steps.pack.outputs.version }}-r${{ github.run_number }}
          path: dist/python/
          retention-days: 30
          if-no-files-found: error

      # Two artifacts, not one bag: the engine (native consumers - the C ABI, the tools, the CAVE
      # machine) and the Unity package (a single .tgz). Downloading one no longer drags in the other.
      - name: Upload artifact (engine + tools)
        uses: actions/upload-artifact@v6
        with:
          # version-r<run> : the git-describe/tag version, plus the run number so re-runs of one commit don't collide
          name: bw_audio-win64-${{ steps.pack.outputs.version }}-r${{ github.run_number }}
          path: |
            dist/
            !dist/unity/**
            !dist/godot/**
            !dist/python/**
            !dist/matlab/**
          retention-days: 30
          if-no-files-found: error

      - name: Upload artifact (Godot addon)
        uses: actions/upload-artifact@v6
        with:
          name: godot-addon-${{ steps.packgd.outputs.version }}-r${{ github.run_number }}
          path: dist/godot/
          retention-days: 30
          if-no-files-found: error

      - name: Upload artifact (Unity package)
        uses: actions/upload-artifact@v6
        with:
          name: unity-package-${{ steps.pack.outputs.version }}-r${{ github.run_number }}
          path: dist/unity/
          retention-days: 30
          if-no-files-found: error

      # ---- release (tags only) -------------------------------------------------------------------
      # The Release IS the distribution - there is no registry. TWELVE assets: eight audiences want
      # different bytes, three of them are one Python wheel per platform, and the last two are the
      # GPLv3 corresponding source that must accompany all of it:
      #
      #   com.brainworks.bw_audio-<ver>.tgz   the Unity package (C# + every platform's engine library,
      #                                      import settings set).
      #                                      Installs via Package Manager > "+" > "from tarball".
      #   bw_audio-godot-<ver>.zip            the Godot addon (the GDExtension + the engine library for
      #                                      every platform, in both the editor and template_release
      #                                      flavours). Unzip into a project; a GDExtension loads on
      #                                      open, nothing to enable.
      #   bw_audio-win64-<tag>.zip            the engine itself: dll/lib/pdb + bw_audio.h + the tools.
      #                                      The durable home for the native side - workflow artifacts
      #                                      expire, a release does not.
      #   bw_audio-android-<tag>.zip          the Android engine: libbw_audio.so for arm64-v8a and
      #                                      x86_64 + bw_audio.h, staged whole by the android job.
      #   bw_audio-linux-x64-<tag>.zip        the Linux engine: libbw_audio.so + bw_audio.h, staged
      #                                      whole by the linux job. JACK and ALSA, no ASIO.
      #   bw_audio-macos-universal-<tag>.zip  the macOS engine: one universal libbw_audio.dylib
      #                                      (x86_64 + arm64) + bw_audio.h, staged whole by the
      #                                      macos job. UNSIGNED and un-notarized: a download needs
      #                                      its quarantine flag cleared, and shipping outside a lab
      #                                      would need a Developer ID signature.
      #   bw_audio-matlab-<tag>.zip           the MATLAB and Octave toolbox: the +bwa package, the
      #                                      examples, and bin/{win64,glnxa64,maca64} each holding
      #                                      that platform's MEX plus its engine library. Unzip and
      #                                      addpath; there is nothing to build.
      #   bw_audio-asio-sdk-src-<tag>.zip     the ASIO SDK source statically linked into bw_audio.dll,
      #                                      redistributed under its GPLv3 option. Corresponding source
      #                                      for the one GPL-covered component the repo does not itself
      #                                      carry (it is gitignored, fetched from Steinberg at build).
      #   bw_audio-steam-audio-src-<tag>.zip  the Steam Audio source statically linked into the same
      #                                      DLL (Apache-2.0), at its pinned commit, plus our patch.
      #                                      Same parity argument as the ASIO zip: the source sits
      #                                      beside the binary rather than behind a link.
      #   bw_audio-<abi>-cp312-abi3-*.whl    the Python binding, three of them: win_amd64 from this
      #                                      job, manylinux_2_28_x86_64 and macosx universal2 from
      #                                      the wheels job. The engine library is inside each one.
      #
      # Keep the engine bundle a .zip, and the package the only .tgz on the release. Every UPM registry
      # speaks the npm protocol and keys on a single publishable tarball, so should this ever be listed
      # on one, that stays a config change rather than a rebuild. It costs nothing to preserve.
      - name: Release (four engine zips + Godot addon + Unity package tarball + MATLAB toolbox + three Python wheels + the two source zips)
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $tgz = (Get-Item dist/unity/*.tgz).FullName
          # The Godot addon: unzip addons/bw_audio/ into a project and it loads on open. A zip
          # rather than anything registry-shaped, because Godot's Asset Library wants a public
          # repo laid out as an installable project, which this is not.
          $gd  = (Get-Item dist/godot/*.zip).FullName

          # The engine bundle: everything staged in dist/ EXCEPT the Unity package (which ships on its
          # own). GPLv3 travels with it - LICENSE, THIRD_PARTY-NOTICES.md and DIST.txt (which names the
          # commit and links the complete source) are already staged there.
          $zip = "dist/bw_audio-win64-$tag.zip"
          Compress-Archive -Path dist/RelWithDebInfo, dist/Debug, dist/bw_audio.h, dist/LICENSE,
                                 dist/THIRD_PARTY-NOTICES.md, dist/DIST.txt `
                           -DestinationPath $zip -Force
          $zip = (Get-Item $zip).FullName

          # GPLv3 corresponding source for the ASIO SDK (staged in dist/asio-sdk-src.zip). It ships as
          # its OWN release asset - deliberately NOT inside the engine .zip or the Unity .tgz - so it
          # sits in the same place as the binaries without bloating them (GPLv3 section 6d).
          $src = "dist/bw_audio-asio-sdk-src-$tag.zip"
          Copy-Item dist/asio-sdk-src.zip $src -Force
          $src = (Get-Item $src).FullName

          # And the same for Steam Audio, which a static link put inside the same DLL. Staged by the
          # "Stage Steam Audio corresponding source" step above (tags only).
          $sasrc = "dist/bw_audio-steam-audio-src-$tag.zip"
          Copy-Item dist/steam-audio-src.zip $sasrc -Force
          $sasrc = (Get-Item $sasrc).FullName

          # The Android bundle. The android job staged the whole tree (both ABIs, the header, the
          # licenses, its own DIST.txt) and this job only zips it, so ONE step creates the release
          # and there is never a second one to reconcile.
          $and = "dist/bw_audio-android-$tag.zip"
          Compress-Archive -Path pack-android/dist/* -DestinationPath $and -Force
          $and = (Get-Item $and).FullName

          # The Linux and macOS bundles, by exactly the same rule: their own jobs staged the whole
          # tree and this one only zips it.
          $lnx = "dist/bw_audio-linux-x64-$tag.zip"
          Compress-Archive -Path pack-linux/dist/* -DestinationPath $lnx -Force
          $lnx = (Get-Item $lnx).FullName
          $mac = "dist/bw_audio-macos-universal-$tag.zip"
          Compress-Archive -Path pack-macos/dist/* -DestinationPath $mac -Force
          $mac = (Get-Item $mac).FullName

          # The MATLAB and Octave toolbox: ONE folder carrying every platform's MEX plus that
          # platform's engine library, assembled above from this job's Windows pair and the two
          # pack inputs. A zip rather than a MATLAB Toolbox (.mltbx) because an .mltbx is a
          # MATLAB-only installer and this folder has to work in Octave too, where the install is
          # addpath and nothing else.
          $mtb = "dist/bw_audio-matlab-$tag.zip"
          Compress-Archive -Path dist/matlab/bw_audio-matlab -DestinationPath $mtb -Force
          $mtb = (Get-Item $mtb).FullName

          # The three Python wheels, attached as-is rather than zipped: pip and uv install a .whl
          # directly from a URL, and wrapping it would make the one-liner in the notes a two-step.
          # Each is already versioned by its own filename (the ABI version from the header), so
          # unlike the engine bundles above there is nothing to rename per tag.
          #
          # Windows comes from THIS job, Linux and macOS from the wheels job: those two are the
          # manylinux and universal2 wheels, not the per-runner ones in pack-linux/pack-macos,
          # which are tagged for their runner's glibc and architecture and stay artifacts. Assert
          # exactly one per platform AND the tag each one has to carry, because a wheel that
          # quietly fell back to a runner tag is a wheel that fails on the machine it was built
          # for the most: somebody else's.
          $whlWin = @(Get-Item dist/python/*.whl)
          $whlLnx = @(Get-Item wheelhouse/*-manylinux*.whl)
          $whlMac = @(Get-Item wheelhouse/*-macosx*.whl)
          if ($whlWin.Count -ne 1) { throw "expected 1 Windows wheel, found $($whlWin.Count)" }
          if ($whlLnx.Count -ne 1) { throw "expected 1 manylinux wheel, found $($whlLnx.Count)" }
          if ($whlMac.Count -ne 1) { throw "expected 1 macOS wheel, found $($whlMac.Count)" }
          if ($whlWin[0].Name -notlike '*-cp312-abi3-win_amd64.whl') { throw "not a cp312-abi3 win_amd64 wheel: $($whlWin[0].Name)" }
          if ($whlLnx[0].Name -notlike '*-cp312-abi3-manylinux_*_x86_64.whl') { throw "not a cp312-abi3 manylinux wheel: $($whlLnx[0].Name)" }
          if ($whlMac[0].Name -notlike '*-cp312-abi3-macosx_*_universal2.whl') { throw "not a cp312-abi3 universal2 wheel: $($whlMac[0].Name)" }
          $whl = @($whlWin[0].FullName, $whlLnx[0].FullName, $whlMac[0].FullName)
          $whl | ForEach-Object { Write-Host "release wheel: $(Split-Path $_ -Leaf)" }

          $notes = @"
          Windows x64, plus Android, Linux and macOS cross-builds. Seven downloads to use - the
          **Unity package**, the **Godot addon**, the **MATLAB and Octave toolbox**, or the engine
          itself for **Windows**, **Android**, **Linux** or **macOS** - plus the **ASIO SDK source**
          and the **Steam Audio source** (corresponding source; see License below).

          ## Unity

          Download ``com.brainworks.bw_audio-*.tgz`` below, then in Unity:
          **Package Manager > ``+`` > *Install package from tarball...*** That is the whole install.
          (Or install from a git URL: ``https://github.com/aforren1/cave-audio.git#unity``.)

          The package ships the native engine for every platform it supports - ``bw_audio.dll``
          (Windows), ``libbw_audio.so`` (Linux, Android) and ``libbw_audio.dylib`` (macOS, universal),
          one file each: Steam Audio is linked into it - with their import settings already set,
          nothing to build. Requires **Unity 6**. Turn OFF Unity's built-in audio
          (*Project Settings > Audio > Disable Unity Audio*): the engine owns the device.

          ## Godot

          Download ``bw_audio-godot-*.zip`` below and unzip it into your project so you end up with
          ``addons/bw_audio/``, then restart the editor. A GDExtension loads on project open - there is
          no plugin to enable. Requires **Godot 4.4+** (built against 4.7). The addon carries the
          editor and export libraries for **Windows x64**, **Linux x86_64** and **macOS universal**,
          plus the **Android arm64-v8a** export library.

          ## Engine (C ABI, tools)

          ``bw_audio-win64-$tag.zip`` - ``bw_audio.dll`` / ``.lib`` / ``.pdb`` (Steam Audio is **linked
          statically**, so there is nothing to keep beside it), ``bw_audio.h``, and the tools:
          ``bwa_playground``, ``bwa_layout_tool``, ``bwa_calib_view``, ``bwa_calibrate``, ``bwa_zylia_probe``.
          Needs the MSVC x64 runtime. See ``DIST.txt`` inside for the exact commit.

          ## Android

          ``bw_audio-android-$tag.zip`` - ``libbw_audio.so`` for **arm64-v8a** (a standalone headset)
          and **x86_64** (an emulator), plus ``bw_audio.h``. Built against **android-26**, output
          through **AAudio**; there is no array transport on Android, so this is the headphone path.
          Steam Audio is **linked statically inside it**, so the binaural path is the real HRTF
          decode and there is no second library to ship beside it.
          The Unity package and the Godot addon above carry the arm64-v8a library already, so install
          one of those unless you are linking the C ABI yourself.

          ## Linux and macOS

          ``bw_audio-linux-x64-$tag.zip`` - ``libbw_audio.so`` plus ``bw_audio.h``. Output goes
          through **JACK** (a PipeWire desktop answers the same ABI) or **ALSA**; the 26-channel
          array is reached over AES67 into the Dante network.

          ``bw_audio-macos-universal-$tag.zip`` - one universal ``libbw_audio.dylib`` (x86_64 and
          arm64) plus ``bw_audio.h``. macOS has **no device backend yet**, so this is the offline
          path: rendering through the manual sink and the test suite. It is **not signed or
          notarized**, so clear the quarantine flag after unzipping:
          ``xattr -dr com.apple.quarantine <folder>``.

          Both link Steam Audio statically, like every other build here. The Unity package and the
          Godot addon carry both libraries already.

          ## MATLAB and Octave

          ``bw_audio-matlab-$tag.zip`` - unzip it anywhere, then in MATLAB or Octave:

          ``addpath('<where-you-unzipped>/bw_audio-matlab')``

          That is the whole install. The folder carries ``+bwa`` (the class layer), the examples,
          and ``bin/win64``, ``bin/glnxa64`` and ``bin/maca64``, each holding that platform's MEX
          plus its engine library; ``bwa.setup`` picks yours. Steam Audio is linked into each
          library, so there is nothing to keep beside it. For Psychtoolbox: see
          ``bindings/matlab/README.md`` for the timing recipe and the note on not fighting
          PsychPortAudio for the same device.

          The MEX files here are **MATLAB's**. Octave needs its own (its extension is ``.mex`` on
          every platform), and CI builds one only on Linux - it rides in the workflow artifact
          ``bw_audio-matlab-linux-x64-*``. An Octave user on another platform builds it with
          ``mkoctfile`` from the checkout; the README has the one command.

          The macOS MEX is **arm64** and, like every other macOS binary here, **unsigned**: clear
          the quarantine flag after unzipping, ``xattr -dr com.apple.quarantine <folder>``.

          ## Python

          ``bw_audio-*.whl`` - one wheel per platform (Windows x64, Linux x86_64 **manylinux**,
          macOS **universal2**), tagged ``cp312-abi3``, so each one runs on **Python 3.12 and every
          later version**. The engine library is inside the wheel; there is nothing to install
          beside it.

          ``uv pip install <url-of-the-wheel>``

          The wheel version is the **ABI version** from ``bw_audio.h``, not this tag, so it can
          never claim a version the library is not. PsychoPy uses this package directly; see
          ``bindings/python/README.md``. The Linux wheel is ``manylinux_2_28`` (glibc 2.28 or
          newer: RHEL 8, Debian 10, Ubuntu 18.10 and later). It imports with neither
          ``libasound.so.2`` nor ``libjack.so.0`` installed: the engine loads each at run time, so
          the JACK and ALSA backends are available when their libraries are. The macOS wheel is
          one ``universal2`` file for both Apple architectures.

          ## License

          **GPLv3.** ``bw_audio.dll`` links the ASIO SDK under its GPLv3 option. Internal use never
          triggers copyleft - it is a *distribution* condition - but SHIPPING an app that includes this
          DLL to third parties would put that app under GPLv3. See ``docs/build.md`` for the
          proprietary-ASIO alternative.

          Complete corresponding source is this repo at the commit named in ``DIST.txt``, plus
          ``bw_audio-asio-sdk-src-$tag.zip`` and ``bw_audio-steam-audio-src-$tag.zip`` below (the two
          third-party sources compiled into the DLL).
          "@
          # One .tgz (the Unity package) + the Godot addon .zip + the four engine .zips (Windows,
          # Android, Linux, macOS) + the MATLAB toolbox .zip + the two corresponding-source .zips
          # + the three Python wheels. Keep the .tgz as the only package tarball - see the note above.
          gh release create $tag $tgz $gd $zip $and $lnx $mac $mtb $src $sasrc @whl --title "bw_audio $tag" --notes $notes

      # ---- distribution branches (tags only) ------------------------------------------------------
      # The gh-pages idea applied to the bindings. `main` stays source-only; each binding also gets a
      # branch whose ROOT is the installable thing, because both standard installers install from a
      # git ref and expect their manifest at the top level:
      #
      #   unity  ->  package.json at the root, so UPM takes a git URL directly:
      #                Package Manager > "+" > "Add package from git URL..."
      #                https://github.com/aforren1/cave-audio.git#unity
      #   godot  ->  addons/bw_audio/ at the root, for the Asset Library — which downloads a repo
      #              ARCHIVE at a specific commit, so the binaries must be IN the tree. A release
      #              asset cannot serve that entry, which is why this branch exists at all.
      #
      # Normal commits, never a force-push: an Asset Library entry pins a commit hash, and rewriting
      # history would eventually orphan a published one. The branches therefore grow by roughly the
      # addon's size per release, which is the standing cost of in-repo distribution.
      - name: Publish distribution branches
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GIT_TERMINAL_PROMPT: '0'
        run: |
          $v = $env:GITHUB_REF_NAME.TrimStart('v')
          # The remote URL must carry the token explicitly. actions/checkout puts the workflow
          # credential in this clone's http.extraheader, NOT in the URL, so `git remote get-url`
          # (the script's default) yields an unauthenticated URL and the push would fail. The
          # script never echoes it, and Actions masks the token in logs regardless.
          $remote = "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          ./tools/dist/publish-branch.ps1 -Branch unity -Source build/upm/package -Version $v -RemoteUrl $remote
          ./tools/dist/publish-branch.ps1 -Branch godot -Source build/godot/addon -Version $v -RemoteUrl $remote

  # ---- portability gate, and two more shipping jobs (docs/backends.md phases 2 and 5) ----------
  # These two jobs exist to catch a Win32 call sneaking back into the core, not to test audio: no
  # runner has an audio device, so both build the library, the console examples and the whole test
  # suite and run them on the null and manual sinks.
  #
  # They SHIP as well, since 2026-09-15: each builds its own Godot GDExtension in both flavours,
  # uploads a standalone engine artifact, and hands the Windows job a fixed-name pack input, exactly
  # as the android job does. That is what lets one addon and one Unity package carry every platform.
  #
  # The linux job DOES compile the two Linux backends (apt installs their dev packages) and asserts
  # both configured, because a runner that quietly lost a header would otherwise turn the whole
  # backend into dead code that nothing builds. Their sink-test sections then skip visibly on the
  # runner: no JACK server is running and there is no sound card.
  #
  # Both jobs now BUILD PHONON, each into its own lib/<platform> and under its own cache key, so
  # both run the with-SDK suite (38 tests) rather than the no-SDK one (33) and both assert
  # "Steam Audio ENABLED". A cold run pays for the phonon build the way the windows job does; a
  # warm one restores the archives and costs a few minutes. No ASIO: it is Windows-only by
  # definition, and nothing here fetches it.
  #
  # The macOS job is UNVERIFIED locally in BOTH halves: the shim's Apple paths (mach_absolute_time,
  # mach_wait_until, the SCHED_OTHER priority drop) were written from the documentation, and its
  # phonon build was written from the pinned scripts. Nobody here has a Mac. This job is the first
  # thing that will execute either.
  #
  # ANDROID IS CROSS-BUILT, in the job below, and deliberately WITHOUT an emulator. An emulator job is
  # possible here: ubuntu-latest runners expose /dev/kvm, so reactivecircus/android-emulator-runner can
  # boot an x86_64 system image and tools/android/run-tests.ps1 would push the suite onto it. What it
  # costs is several minutes of image download plus boot on every run, and what it buys is thin - phase
  # 3 verified the AAudio sink on a local emulator, and the numbers that matter (burst size, the MMAP
  # path, a real route-change disconnect, the CPU budget) need a headset, which no runner has. The
  # cross-BUILD is the part worth gating, and it is the cheap part.
  # ---- Android cross-build (docs/backends.md phase 3 + the bindings' Android packaging) ---------
  # Builds the library for both ABIs, proves the AAudio backend is in it, and produces the two things
  # the Windows job cannot: the arm64-v8a engine library that both bindings package, and the Godot
  # GDExtension for arm64-v8a (template_release, the flavour an exported game loads).
  #
  # Nothing RUNS here. The test executables are built, so a compile break in the suite still fails
  # this job, but running them needs a device - that is what tools/android/run-tests.ps1 is for.
  #
  # Steam Audio: BUILT STATICALLY here too, once per ABI, through the same composite action the
  # other three jobs call. An Android APK therefore carries the real HRTF decode, occlusion,
  # pathing and the reflection bed inside libbw_audio.so, with nothing beside it.
  #
  # UNVERIFIED ON A LINUX HOST. The Android phonon build was verified on a Windows host, where the
  # NDK host tag the pinned scripts hard-code happens to be the right one. This job is the first
  # thing that runs it from linux-x86_64, which is what third_party/patches/phonon-android-*.patch
  # exists for. Its loud failure mode is the configure assertion below: a patch that did not do its
  # job leaves no lib/android-<abi> staged, the configure falls back to a no-SDK build, and the
  # grep for "Steam Audio ENABLED" fails the job rather than shipping a quietly degraded library.
  android:
    runs-on: ubuntu-latest
    # Two phonon builds on a cold cache are the long pole, as they are in the windows job; a warm
    # cache restores both in seconds.
    timeout-minutes: 90
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v6      # no submodules: nothing here builds an SDK

      - name: Version
        id: ver
        shell: bash
        run: |
          # The same rule tools/upm/pack.ps1 uses, so the Android artifact's name matches the others
          # on a given run: the tag when there is one, else git describe, else the placeholder. A
          # default (shallow) checkout has no tags, so a branch build lands on 0.0.0-dev here exactly
          # as it does in the Windows job.
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            v="${GITHUB_REF_NAME#v}"
          else
            v="0.0.0-dev"
            if d=$(git describe --tags --long --dirty --match 'v*' 2>/dev/null); then
              if [[ "$d" =~ ^v?(.+)-([0-9]+)-g([0-9a-f]+)(-dirty)?$ ]]; then
                if [ "${BASH_REMATCH[2]}" = 0 ]; then v="${BASH_REMATCH[1]}"
                else v="${BASH_REMATCH[1]}-dev.${BASH_REMATCH[2]}.g${BASH_REMATCH[3]}"; fi
              fi
            fi
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "android version: $v"

      - name: NDK and generator
        shell: bash
        run: |
          # The runner image documents four names. ANDROID_NDK_ROOT (and its twin ANDROID_NDK_HOME)
          # is the image's DEFAULT NDK, r27 today; ANDROID_NDK_LATEST_HOME is the newest installed,
          # which moves whenever the image adds one. Prefer the pinned default so a new image cannot
          # change the compiler under this job silently, fall back to the latest, and fail loudly
          # rather than let CMake configure a HOST build that would pass every check below.
          NDK="${ANDROID_NDK_ROOT:-${ANDROID_NDK_HOME:-$ANDROID_NDK_LATEST_HOME}}"
          test -n "$NDK" && test -f "$NDK/build/cmake/android.toolchain.cmake" || {
            echo "no usable NDK: ANDROID_NDK_ROOT='$ANDROID_NDK_ROOT' ANDROID_NDK_LATEST_HOME='$ANDROID_NDK_LATEST_HOME'"
            exit 1; }
          echo "NDK=$NDK" >> "$GITHUB_ENV"
          # The pinned Steam Audio scripts read the NDK from ANDROID_NDK and nowhere else, so the
          # phonon steps below get it from the job environment rather than from an input.
          echo "ANDROID_NDK=$NDK" >> "$GITHUB_ENV"
          "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" --version | head -1
          sudo apt-get update && sudo apt-get install -y ninja-build   # the NDK ships no generator

      - name: Phonon cache key (submodule sha, no checkout needed)
        id: phonon-key
        shell: bash
        run: echo "sha=$(git rev-parse HEAD:third_party/steam-audio-source)" >> "$GITHUB_OUTPUT"

      # Two ABIs, two cache entries. Both stage into ONE artifacts tree - include/ is shared and the
      # archives land in lib/android-arm64 and lib/android-x64 - so each entry carries the shared
      # header plus its own lib dir, and the two restores merge into the tree CMake then detects.
      # The key names the platform AND the ABI: a cache is scoped to the repository rather than to
      # the runner OS, so jobs staging different lib/<platform> sets under one key would restore
      # each other's archives.
      - name: Cache phonon (arm64-v8a)
        id: phonon-arm64
        uses: actions/cache@v5
        with:
          path: |
            third_party/steam-audio-artifacts/include
            third_party/steam-audio-artifacts/lib/android-arm64
          key: phonon-android-arm64-v1-${{ steps.phonon-key.outputs.sha }}-${{ hashFiles('third_party/patches/**') }}

      - name: Build phonon (arm64-v8a; cache miss only; recipe = third_party/README.md)
        if: steps.phonon-arm64.outputs.cache-hit != 'true'
        uses: ./.github/actions/build-phonon
        with:
          platform: android
          arch: arm64          # build.py's spelling; the deps tree calls the same target armv8
          stage-dir: android-arm64

      - name: Cache phonon (x86_64)
        id: phonon-x64
        uses: actions/cache@v5
        with:
          path: |
            third_party/steam-audio-artifacts/include
            third_party/steam-audio-artifacts/lib/android-x64
          key: phonon-android-x64-v1-${{ steps.phonon-key.outputs.sha }}-${{ hashFiles('third_party/patches/**') }}

      - name: Build phonon (x86_64; cache miss only; recipe = third_party/README.md)
        if: steps.phonon-x64.outputs.cache-hit != 'true'
        uses: ./.github/actions/build-phonon
        with:
          platform: android
          arch: x64
          stage-dir: android-x64

      - name: Build both ABIs (android-26)
        shell: bash
        run: |
          for abi in arm64-v8a x86_64; do
            # ANDROID_STL is pinned, not left to default: a static phonon is C++, and c++_static
            # puts libc++ INSIDE libbw_audio.so so nothing ships beside it. Safe because the ABI
            # is C, so no C++ object crosses the library boundary. The NDK's CMake toolchain
            # already defaults this way; Gradle's does not, so say it.
            cmake -S . -B build-android-$abi -G Ninja \
                  -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
                  -DANDROID_ABI=$abi -DANDROID_PLATFORM=android-26 -DANDROID_STL=c++_static \
                  -DCMAKE_BUILD_TYPE=RelWithDebInfo -DBWA_BUILD_TESTS=ON | tee configure-$abi.log
            # The artifact must contain the device path this platform HAS. A configure that quietly
            # fell back to the null sink would ship a library that never opens a stream and say
            # nothing about it - the same reason the Windows job greps for ASIO.
            grep -q "AAudio backend ENABLED" configure-$abi.log
            # And the HRTF decode. This is also the one loud signal that this ABI's phonon archives
            # really got staged, whether they were built here or restored from the cache.
            grep -q "Steam Audio ENABLED" configure-$abi.log
            cmake --build build-android-$abi
            test -f build-android-$abi/libbw_audio.so
          done

      - name: Cache godot-cpp build (android)
        uses: actions/cache@v4
        with:
          # Same reasoning as the Windows godot-cpp cache: ~2100 generated binding files dwarf our
          # nine sources. One flavour only here, because a headset runs no editor.
          path: build-android-godot
          key: godot-cpp-android-${{ env.GODOT_CPP_COMMIT }}-arm64

      - name: Build the Godot GDExtension (arm64-v8a, template_release)
        shell: bash
        run: |
          cmake -S . -B build-android-godot -G Ninja \
                -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
                -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-26 -DANDROID_STL=c++_static \
                -DCMAKE_BUILD_TYPE=RelWithDebInfo \
                -DBWA_BUILD_GODOT=ON -DGODOTCPP_TARGET=template_release
          cmake --build build-android-godot --target bwa_gdextension
          # The manifest names this exact file (bindings/godot/addons/bw_audio/bw_audio.gdextension),
          # and the "lib" prefix is not cosmetic: an APK extracts only lib*.so from its lib/<abi>/.
          test -f bindings/godot/addons/bw_audio/bin/libbw_audio_gd.android.template_release.arm64.so

      - name: Stage dist
        shell: bash
        run: |
          mkdir -p dist-android/lib/arm64-v8a dist-android/lib/x86_64 dist-android/include
          cp build-android-arm64-v8a/libbw_audio.so dist-android/lib/arm64-v8a/
          cp build-android-x86_64/libbw_audio.so    dist-android/lib/x86_64/
          # Same symbol split as the linux job (see there), with the NDK's llvm-objcopy: the
          # artifact's .so is the 7 MB of code, its DWARF sits beside it as .so.debug.
          OBJCOPY="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-objcopy"
          for abi in arm64-v8a x86_64; do
            (cd "dist-android/lib/$abi"               && "$OBJCOPY" --only-keep-debug libbw_audio.so libbw_audio.so.debug               && "$OBJCOPY" --strip-debug --add-gnu-debuglink=libbw_audio.so.debug libbw_audio.so               && ls -l libbw_audio.so libbw_audio.so.debug)
          done
          cp include/bw_audio.h                     dist-android/include/
          cp LICENSE THIRD_PARTY-NOTICES.md         dist-android/
          cat > dist-android/DIST.txt <<EOF
          bw_audio android - limited distribution build
          commit   ${{ github.sha }} (${{ github.ref_name }})
          built    $(date -u +%Y-%m-%dT%H:%M:%S)Z  (GitHub Actions run ${{ github.run_id }})
          abis     lib/arm64-v8a - a standalone headset (Quest, Pico)
                   lib/x86_64    - the emulator (tools/android/run-tests.ps1 pushes onto one)
                   both built against android-26, which is AAudio's own floor
          backends AAudio=yes  SteamAudio=yes (STATIC). phonon is built from the pinned submodule
                   for both ABIs and linked INSIDE libbw_audio.so, so the binaural path is the
                   real HRTF decode and automatic occlusion, pathing and the reflection bed are
                   all present. There is no second file to ship or to keep beside it.
                   ISM early reflections, the FDN late tail and manual occlusion work as before.
          no array there is no 26-channel transport on Android; this is the headphone path.
                   A headset's pose reaches the engine through bwa_set_listener_pose.
          contents lib/<abi>/libbw_audio.so (stripped) + lib/<abi>/libbw_audio.so.debug (its
                   DWARF, linked by gnu_debuglink: keep the two together to symbolize a crash,
                   ship only the .so) + include/bw_audio.h. A Unity or Godot consumer wants the
                   package or the addon instead - both already carry the arm64-v8a library with
                   its import settings set.
          license  GPLv3 (LICENSE) + THIRD_PARTY-NOTICES.md. No ASIO SDK here (it is a Windows
                   driver model), so the complete corresponding source is this repo at
                   https://github.com/aforren1/cave-audio/tree/${{ github.sha }}
          EOF
          cat dist-android/DIST.txt

          # What the Windows job packs into the two bindings. A FIXED artifact name, because a
          # versioned one would have to be threaded through the download step; the versioned
          # artifact below is the one a human downloads.
          #
          # The packaged copies are STRIPPED of debug info, the standalone artifact's are not. That
          # is the same split Windows already has: the addon and the tarball ship bw_audio.dll while
          # its DWARF-equivalent sits in a .pdb they do not carry, and an APK pays for every byte it
          # holds. The engine measures 20.7 MB down to 7.0 with static phonon in it (it was 2.5 down
          # to 0.4 without), and the extension strips by about the same ratio, per release, on a
          # branch that keeps every release.
          mkdir -p pack-android/godot pack-android/unity
          cp -r dist-android pack-android/dist
          cp bindings/godot/addons/bw_audio/bin/libbw_audio_gd.android.template_release.arm64.so \
             bindings/godot/addons/bw_audio/bin/libbw_audio.so pack-android/godot/
          cp build-android-arm64-v8a/libbw_audio.so pack-android/unity/
          "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip" --strip-debug \
             pack-android/godot/*.so pack-android/unity/*.so
          ls -l pack-android/godot pack-android/unity

      - name: Upload artifact (Android engine)
        uses: actions/upload-artifact@v6
        with:
          name: bw_audio-android-${{ steps.ver.outputs.version }}-r${{ github.run_number }}
          path: dist-android/
          retention-days: 30
          if-no-files-found: error

      - name: Upload artifact (packing input for the windows job)
        uses: actions/upload-artifact@v6
        with:
          name: android-pack-input
          path: pack-android/
          retention-days: 1      # an intra-run handoff, not a download
          if-no-files-found: error

  linux:
    runs-on: ubuntu-latest
    # On a cold cache this pays for phonon AND two godot-cpp trees (~2100 generated files each);
    # a warm one restores both and runs in a fraction of it.
    timeout-minutes: 120
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        # still no submodules by default: the composite action fetches steam-audio-source itself,
        # and only on a phonon cache miss

      - name: Install the Linux backends' dev packages
        # HEADERS only: the two sinks dlopen libjack.so.0 and libasound.so.2 at run time, so
        # nothing here reaches the link line. The packages still have to be present or CMake
        # silently drops the backends.
        #
        # octave + liboctave-dev is the MATLAB and Octave binding's toolchain: mkoctfile builds
        # the MEX, octave-cli runs its ctests. This is the ONLY job that can do it - no runner
        # image carries MATLAB or Octave otherwise, and MATLAB needs a license CI does not have
        # (matlab-actions/setup-matlab is the follow-up if that changes).
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libjack-jackd2-dev octave liboctave-dev

      - name: Version
        id: ver
        shell: bash
        run: |
          # The same rule the android job and tools/upm/pack.ps1 use, so every artifact of one run
          # carries the same version. A default (shallow) checkout has no tags, so a branch build
          # lands on 0.0.0-dev here exactly as it does everywhere else.
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            v="${GITHUB_REF_NAME#v}"
          else
            v="0.0.0-dev"
            if d=$(git describe --tags --long --dirty --match 'v*' 2>/dev/null); then
              if [[ "$d" =~ ^v?(.+)-([0-9]+)-g([0-9a-f]+)(-dirty)?$ ]]; then
                if [ "${BASH_REMATCH[2]}" = 0 ]; then v="${BASH_REMATCH[1]}"
                else v="${BASH_REMATCH[1]}-dev.${BASH_REMATCH[2]}.g${BASH_REMATCH[3]}"; fi
              fi
            fi
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "linux version: $v"

      # The pinned build scripts are driven as `python`, not `python3`, and which of the two a
      # runner image happens to put on PATH is not a promise. Pin it.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Phonon cache key (submodule sha, no checkout needed)
        id: phonon-key
        shell: bash
        run: echo "sha=$(git rev-parse HEAD:third_party/steam-audio-source)" >> "$GITHUB_OUTPUT"

      - name: Cache phonon (built Steam Audio core)
        id: phonon
        uses: actions/cache@v5
        with:
          path: third_party/steam-audio-artifacts
          # Same key shape as the windows job, plus the PLATFORM. A cache is scoped to the
          # repository and not to the runner OS, so three jobs staging three different
          # lib/<platform> sets under one key would restore each other's archives.
          key: phonon-linux-v1-${{ steps.phonon-key.outputs.sha }}-${{ hashFiles('third_party/patches/**') }}

      - name: Build phonon (cache miss only; recipe = third_party/README.md)
        if: steps.phonon.outputs.cache-hit != 'true'
        uses: ./.github/actions/build-phonon
        with:
          platform: linux
          arch: x64
          stage-dir: linux-x64
          # STEAMAUDIO_ENABLE_AVX defaults ON and adds -fabi-version=6, which breaks <future>
          # inside hrtf.cpp on gcc 13 and older. Runner images ship gcc 13, so this is required
          # here; gcc 14 compiles it either way. third_party/README.md has the measurement.
          cmake-flags: -DSTEAMAUDIO_ENABLE_AVX=OFF

      - name: Configure
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo -DBWA_BUILD_TESTS=ON                 -DBWA_BUILD_MATLAB=ON | tee configure.log
          # Prove the port is actually being exercised, rather than a stale cache quietly
          # re-enabling a Windows-only path - and that both Linux backends really compiled.
          grep -q "Linux - JACK and ALSA backends available" configure.log
          grep -q "JACK backend ENABLED" configure.log
          grep -q "ALSA backend ENABLED" configure.log
          # The one loud signal that the phonon staging survived the cache round trip. A no-SDK
          # build passes every test below, so nothing further down would notice.
          grep -q "Steam Audio ENABLED" configure.log
          # The MATLAB binding is opt-in and skips SILENTLY when its toolchain is missing, which
          # is exactly the shape that would let it stop being built without anyone noticing.
          grep -q "Octave MEX enabled" configure.log

      - name: Build
        run: cmake --build build --config RelWithDebInfo

      - name: Check the library
        run: |
          # ctest below links bwa_core's OBJECTS, never this file, so nothing else here would
          # notice its absence: a LINKER_LANGUAGE CXX with no CXX language enabled made CMake emit
          # an EMPTY link rule, which prints "Linking CXX shared library", exits 0, and writes
          # nothing (docs/backends.md).
          test -s build/libbw_audio.so
          # phonon is STATIC: nothing to load beside the library.
          ! readelf -d build/libbw_audio.so | grep -q phonon
          # -Wl,--exclude-libs,ALL holds: the bwa_* ABI is the whole export list.
          test "$(nm -D --defined-only build/libbw_audio.so | grep -c ' ipl')" = 0
          # The two Linux backends load their libraries at RUN TIME (os_dl_*), so neither may be
          # in NEEDED and neither may leave an undefined symbol behind. A box with no JACK and no
          # sound card has to load this file and run the offline sink; linking either library
          # would make its absence a failure of the whole library instead of of one backend.
          ! readelf -d build/libbw_audio.so | grep -E 'NEEDED.*(libasound|libjack)'
          test "$(nm -D --undefined-only build/libbw_audio.so | grep -cE ' (snd_|jack_)')" = 0

      - name: Test
        # 42: the 33 a default off-Windows build registers, plus the five SDK-gated tests
        # (reflect, bake, path, dynmesh, steam_decode), plus the four the Octave binding adds
        # (octave_tests and its three examples). No matlab_* here: there is no MATLAB on a runner.
        run: ctest --test-dir build -C RelWithDebInfo --output-on-failure

      # ---- the MATLAB MEX ------------------------------------------------------------------------
      # UNVERIFIED LOCALLY, all of it: nobody here can run a GitHub-hosted MATLAB, so these steps
      # come from the patterns in https://github.com/mathworks/ci-configuration-examples rather
      # than from a run. setup-matlab needs no license token on a GitHub-hosted runner for a public
      # repository.
      #
      # They live INSIDE this job, after the engine build, so the MEX links the library this job
      # already produced - JACK, ALSA and a static phonon intact - instead of a second engine built
      # somewhere else. The Octave MEX above came from the same tree for the same reason.
      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v2
        with:
          # Pinned, so a new MathWorks release cannot change overnight what this job tested.
          release: R2024b

      - name: Configure and build the MATLAB MEX
        shell: bash
        run: |
          # setup-matlab puts the launcher on PATH but not matlabroot, and FindMatlab wants the
          # root. Ask MATLAB itself rather than guessing the install layout.
          root="$(matlab -batch 'disp(matlabroot)' | tail -1 | tr -d '\r')"
          echo "matlabroot: $root"
          test -d "$root"
          # The SAME build tree. Reconfiguring only adds the MATLAB target; nothing rebuilds.
          cmake -S . -B build -DMatlab_ROOT_DIR="$root" | tee matlab-configure.log
          # LOUD on the one failure these steps exist to catch: FindMatlab not locating the
          # action's install. The option skips SILENTLY when it finds no toolchain, so without
          # this the job would build nothing, run nothing, and pass.
          grep -q "MATLAB MEX enabled" matlab-configure.log
          cmake --build build --target bwa_mex_matlab
          mex=bindings/matlab/bin/matlab/linux-x64/bwa_mex.mexa64
          test -s "$mex"
          test -s bindings/matlab/bin/matlab/linux-x64/libbw_audio.so
          # It has to find the engine library BESIDE it, not on a system path: the staged pair is
          # what a user copies, and an empty runpath would only fail on their machine.
          readelf -d "$mex" | grep -E 'RUNPATH|RPATH' | grep -q 'ORIGIN'

      - name: Test the MATLAB binding
        uses: matlab-actions/run-command@v2
        with:
          # run-command fails the step on an uncaught error, so raising IS the failure signal.
          # run_tests returns 77 when no MEX was staged, which is a failure here: the step above
          # was supposed to stage one.
          command: |
            cd("bindings/matlab/tests");
            rc = run_tests();
            cd(fullfile("..", "examples"));
            rc = rc + offline_render("--tests");
            rc = rc + live_onset("--tests");
            rc = rc + AudioTunnel3DDemo_bwa("--tests");
            if rc ~= 0
                error("bwa:ci", "the MATLAB binding reported %d failing check groups", rc);
            end

      - name: Stage the MATLAB MEX for the windows job
        shell: bash
        run: |
          # Into the fixed-name pack input the windows job already downloads, so assembling the
          # cross-platform toolbox there costs no second handoff.
          mkdir -p pack-linux/matlab
          cp bindings/matlab/bin/matlab/linux-x64/bwa_mex.mexa64 pack-linux/matlab/
          cp build/libbw_audio.so pack-linux/matlab/
          strip --strip-debug pack-linux/matlab/libbw_audio.so
          ls -l pack-linux/matlab

      - name: Upload artifact (MATLAB and Octave binding)
        uses: actions/upload-artifact@v6
        with:
          name: bw_audio-matlab-linux-x64-${{ steps.ver.outputs.version }}-r${{ github.run_number }}
          # BOTH interpreters' MEX files with the engine library beside each, plus the package a
          # user adds to their path. Each MEX finds its library through an $ORIGIN runpath, so a
          # staged directory is self-contained. The cross-platform TOOLBOX (one folder, three
          # architectures) is assembled in the windows job and shipped from there; this artifact
          # is the Linux-only pair, and the only place the Octave MEX is published at all.
          path: |
            bindings/matlab/bin/
            bindings/matlab/+bwa/
            bindings/matlab/examples/
            bindings/matlab/README.md
          retention-days: 30
          if-no-files-found: error

      # ---- the Godot extension, and what the Windows job packs -----------------------------------
      # Same shape as the android job's contribution: this job is the only place a Linux GDExtension
      # can be built, so it builds one and hands it over. Two flavours here, unlike Android's one,
      # because a Linux collaborator runs an EDITOR as well as exporting a game.
      - name: Cache godot-cpp build (linux)
        uses: actions/cache@v4
        with:
          # Both trees, keyed on the pinned commit, exactly as the windows job does it: godot-cpp
          # generates and compiles ~2100 binding files per flavour and our nine rebuild on top.
          # runner.os keeps this entry apart from the Windows one under the same commit.
          path: |
            build-godot-editor
            build-godot-template_release
          key: godot-cpp-${{ env.GODOT_CPP_COMMIT }}-${{ runner.os }}

      - name: Build the Godot GDExtension (linux x86_64, both flavours)
        shell: bash
        run: |
          # No -G: the default Makefiles generator is on every runner image, and nothing here needs
          # ninja. BWA_BUILD_TESTS stays ON for the same reason the windows job pins it - these
          # trees are CACHED, and a stale entry with it off would silently change what they are.
          for t in editor template_release; do
            cmake -S . -B build-godot-$t -DCMAKE_BUILD_TYPE=RelWithDebInfo \
                  -DBWA_BUILD_GODOT=ON -DGODOTCPP_TARGET=$t -DBWA_BUILD_TESTS=ON
            cmake --build build-godot-$t --target bwa_gdextension
            ext=bindings/godot/addons/bw_audio/bin/libbw_audio_gd.linux.$t.x86_64.so
            # The manifest names this exact file. The "lib" prefix is CMake's own default off
            # Windows; the rest is godot-cpp's suffix property, so the two cannot drift.
            test -s "$ext"
            # And it must still LOAD the engine rather than having quietly absorbed it: the addon
            # ships one engine library, and the manifest lists it as a dependency.
            readelf -d "$ext" | grep -q 'NEEDED.*libbw_audio\.so'
          done
          # The POST_BUILD staged the engine library one directory down, because Android's has the
          # same file name and one addon carries both.
          test -s bindings/godot/addons/bw_audio/bin/linux/libbw_audio.so

      - name: Stage dist
        shell: bash
        run: |
          mkdir -p dist-linux/lib dist-linux/include
          cp build/libbw_audio.so dist-linux/lib/
          # Split the symbols out the way the Windows artifact ships a .pdb: the library a consumer
          # copies is the 7 MB of code, and the ~25 MB of DWARF (most of it phonon's, built -g)
          # sits beside it as libbw_audio.so.debug, found through the gnu_debuglink by any
          # debugger that sees the two together. Run in the lib dir so the link is a basename.
          (cd dist-linux/lib             && objcopy --only-keep-debug libbw_audio.so libbw_audio.so.debug             && objcopy --strip-debug --add-gnu-debuglink=libbw_audio.so.debug libbw_audio.so             && readelf -S libbw_audio.so | grep -q gnu_debuglink             && ls -l libbw_audio.so libbw_audio.so.debug)
          cp include/bw_audio.h   dist-linux/include/
          cp LICENSE THIRD_PARTY-NOTICES.md dist-linux/
          cat > dist-linux/DIST.txt <<EOF
          bw_audio linux-x64 - limited distribution build
          commit   ${{ github.sha }} (${{ github.ref_name }})
          built    $(date -u +%Y-%m-%dT%H:%M:%S)Z  (GitHub Actions run ${{ github.run_id }})
          built on ubuntu-latest (glibc); gcc, x86_64 only
          backends JACK=yes  ALSA=yes  SteamAudio=yes (STATIC). phonon is built from the pinned
                   submodule and linked INSIDE libbw_audio.so, so the binaural path is the real
                   HRTF decode and automatic occlusion, pathing and the reflection bed are all
                   present. There is no second file to ship or to keep beside it.
          no ASIO  ASIO is a Windows driver model. Linux reaches the 26-channel array through
                   JACK (a PipeWire desktop answers the same ABI) or a raw ALSA card; AES67 into
                   the Dante network is the transport. See docs/backends.md.
          contents lib/libbw_audio.so (stripped) + lib/libbw_audio.so.debug (its DWARF, linked
                   by gnu_debuglink: keep the two together to debug, ship only the .so) +
                   include/bw_audio.h. A Unity or Godot consumer wants the package or the addon
                   instead - both carry this library already, stripped, with their import
                   settings set.
          license  GPLv3 (LICENSE) + THIRD_PARTY-NOTICES.md. No ASIO SDK here, so the complete
                   corresponding source is this repo at
                   https://github.com/aforren1/cave-audio/tree/${{ github.sha }}
                   plus Steam Audio (Apache-2.0, statically linked); on a tagged release its
                   source ships as bw_audio-steam-audio-src-<tag>.zip.
          EOF
          cat dist-linux/DIST.txt

          # What the Windows job packs into the two bindings, plus the whole dist tree so that job
          # can zip it as a release asset without rebuilding anything. A FIXED artifact name: the
          # versioned one below is the one a human downloads.
          #
          # The packaged copies are STRIPPED, the standalone artifact's are not - the same split
          # Windows has, where the shipped DLL's symbols sit in a .pdb the packages do not carry.
          mkdir -p pack-linux/godot pack-linux/unity
          cp -r dist-linux pack-linux/dist
          cp bindings/godot/addons/bw_audio/bin/libbw_audio_gd.linux.editor.x86_64.so \
             bindings/godot/addons/bw_audio/bin/libbw_audio_gd.linux.template_release.x86_64.so \
             build/libbw_audio.so pack-linux/godot/
          cp build/libbw_audio.so pack-linux/unity/
          # Each -*From directory is FLAT; both packs read the manifest to learn where each file
          # belongs inside the package.
          strip --strip-debug pack-linux/godot/*.so pack-linux/unity/*.so
          ls -l pack-linux/godot pack-linux/unity

      # ---- Python wheel (nanobind) --------------------------------------------------------------
      # Same argument as the Windows job: the wheel carries the engine library, and this is the job
      # that builds a Linux one. It rides into pack-linux/ as well, so the Windows job can attach it
      # to the one release without rebuilding anything.
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Build the Python wheel
        shell: bash
        run: |
          uv python install 3.12
          # Straight into pack-linux/, the fixed-name tree the Windows job already downloads, so
          # the release step there attaches this wheel without a second handoff.
          (cd bindings/python && uv build --wheel --python 3.12 --out-dir "$GITHUB_WORKSPACE/pack-linux/python")
          whl=$(ls "$GITHUB_WORKSPACE"/pack-linux/python/*.whl)
          echo "built $(basename "$whl")"
          case "$(basename "$whl")" in
            *-cp312-abi3-*) : ;;
            *) echo "expected a cp312-abi3 wheel, got $(basename "$whl")"; exit 1 ;;
          esac
          # The wheel is tagged for THIS RUNNER'S glibc, not manylinux: it runs on the ubuntu-latest
          # image's glibc or newer, and not on an older distribution. Building from a checkout
          # always works. A manylinux build is a follow-up (bindings/python/README.md says so too).
          python3 -c "import sys;print('glibc floor:', __import__('platform').libc_ver())"
          # And the extension must find the engine library BESIDE it rather than on the system path.
          unzip -o -q "$whl" -d "$GITHUB_WORKSPACE/wheel-inspect"
          readelf -d "$GITHUB_WORKSPACE"/wheel-inspect/bw_audio/_bwa*.so | grep -E 'RUNPATH|RPATH' | grep -q 'ORIGIN'
          test -s "$GITHUB_WORKSPACE"/wheel-inspect/bw_audio/libbw_audio.so

      - name: Test the Python wheel (from the INSTALLED wheel, not the source tree)
        shell: bash
        run: |
          uv venv --python 3.12 .wheelenv
          uv pip install --python .wheelenv pytest numpy "$GITHUB_WORKSPACE"/pack-linux/python/*.whl
          .wheelenv/bin/python -m pytest -q --color=no bindings/python/tests
          .wheelenv/bin/python bindings/python/examples/offline_render.py --tests
          .wheelenv/bin/python bindings/python/examples/live_onset.py --tests

      - name: Upload artifact (Python wheel)
        uses: actions/upload-artifact@v6
        with:
          name: bw_audio-python-linux-x64-${{ steps.ver.outputs.version }}-r${{ github.run_number }}
          path: pack-linux/python/
          retention-days: 30
          if-no-files-found: error

      - name: Upload artifact (Linux engine)
        uses: actions/upload-artifact@v6
        with:
          name: bw_audio-linux-x64-${{ steps.ver.outputs.version }}-r${{ github.run_number }}
          path: dist-linux/
          retention-days: 30
          if-no-files-found: error

      - name: Upload artifact (packing input for the windows job)
        uses: actions/upload-artifact@v6
        with:
          name: linux-pack-input
          path: pack-linux/
          retention-days: 1      # an intra-run handoff, not a download
          if-no-files-found: error

  # UNVERIFIED LOCALLY, all of it: nobody here has a Mac, so this job is the first thing that
  # executes either the shim's Apple paths or a macOS phonon build. Both decisions below came out
  # of the pinned scripts rather than a run. build.py -p osx generates ONE tree named "osx" with
  # the Xcode generator, and core/CMakeLists.txt sets CMAKE_OSX_ARCHITECTURES "x86_64;arm64" for
  # every macOS build (get_dependencies.py passes the same pair to the three companions), so the
  # archives are universal and osx-universal is the honest stage-dir - which is also the name the
  # root CMakeLists prefers when more than one is staged. The failure mode is the configure
  # assertion, not a silent no-SDK build.
  macos:
    runs-on: macos-latest
    # Same arithmetic as the linux job, and every compile here is UNIVERSAL, so it is two
    # codegen passes per file.
    timeout-minutes: 120
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v6

      # `python`, not `python3`: see the linux job's copy of this step.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Version
        id: ver
        shell: bash
        run: |
          # The same rule as the android and linux jobs; see the android job's copy.
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            v="${GITHUB_REF_NAME#v}"
          else
            v="0.0.0-dev"
            if d=$(git describe --tags --long --dirty --match 'v*' 2>/dev/null); then
              if [[ "$d" =~ ^v?(.+)-([0-9]+)-g([0-9a-f]+)(-dirty)?$ ]]; then
                if [ "${BASH_REMATCH[2]}" = 0 ]; then v="${BASH_REMATCH[1]}"
                else v="${BASH_REMATCH[1]}-dev.${BASH_REMATCH[2]}.g${BASH_REMATCH[3]}"; fi
              fi
            fi
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "macos version: $v"

      - name: Phonon cache key (submodule sha, no checkout needed)
        id: phonon-key
        shell: bash
        run: echo "sha=$(git rev-parse HEAD:third_party/steam-audio-source)" >> "$GITHUB_OUTPUT"

      - name: Cache phonon (built Steam Audio core)
        id: phonon
        uses: actions/cache@v5
        with:
          path: third_party/steam-audio-artifacts
          key: phonon-osx-v2-${{ steps.phonon-key.outputs.sha }}-${{ hashFiles('third_party/patches/**') }}

      - name: Build phonon (cache miss only; recipe = third_party/README.md)
        if: steps.phonon.outputs.cache-hit != 'true'
        uses: ./.github/actions/build-phonon
        with:
          platform: osx
          arch: x64          # ignored for osx: the tree is universal, see the job comment
          stage-dir: osx-universal
          # No AVX flag: -fabi-version=6 is a Linux-only branch in core/CMakeLists.txt, and
          # Apple clang never sees it.

      - name: Configure
        run: |
          # UNIVERSAL, because the shipped artifact is one file for both Apple architectures and an
          # Intel Mac is still a machine a collaborator has. phonon's own archives are universal
          # already (core/CMakeLists.txt sets the same pair for every macOS build), so this costs
          # compile time and nothing else. The ctest suite below is built universal too and runs
          # natively on whichever arch the runner is.
          cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo -DBWA_BUILD_TESTS=ON \
                -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64" | tee configure.log
          grep -q "null and manual sinks only" configure.log
          grep -q "Steam Audio ENABLED" configure.log

      - name: Build
        run: cmake --build build --config RelWithDebInfo

      - name: Check the library
        # The same empty-link-rule guard as the linux job. No output-name or output-directory
        # override on the target and no -G here, so the default single-config Makefiles generator
        # writes it to the build root under CMake's own Apple naming.
        run: |
          test -s build/libbw_audio.dylib
          # A universal build that silently produced ONE slice is the failure this job cannot see
          # any other way: it links, it tests, and it fails on half the Macs that download it.
          lipo -info build/libbw_audio.dylib
          lipo -info build/libbw_audio.dylib | grep -q x86_64
          lipo -info build/libbw_audio.dylib | grep -q arm64
          # phonon is STATIC: nothing to load beside the library.
          ! otool -L build/libbw_audio.dylib | grep -q phonon

      - name: Test
        # 38, the same arithmetic as the linux job above.
        run: ctest --test-dir build -C RelWithDebInfo --output-on-failure

      # ---- the MATLAB MEX ------------------------------------------------------------------------
      # UNVERIFIED LOCALLY, like the rest of this job, and doubly so: written from the patterns in
      # https://github.com/mathworks/ci-configuration-examples, on a machine nobody here has.
      # Inside this job, after the engine build, so the MEX links the universal dylib this job
      # already produced rather than a second engine built elsewhere.
      #
      # macos-latest is APPLE SILICON, so MATLAB is the arm64 build and its MEX extension is
      # .mexmaca64. The engine dylib beside it is UNIVERSAL (x86_64 + arm64), which an arm64 MATLAB
      # loads happily; the MEX itself is arm64 only, because MATLAB's own mex toolchain builds for
      # the architecture it is. An Intel Mac needs a MEX built on one, which nothing here has.
      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v2
        with:
          # Pinned, so a new MathWorks release cannot change overnight what this job tested.
          release: R2024b

      - name: Configure and build the MATLAB MEX
        shell: bash
        run: |
          root="$(matlab -batch 'disp(matlabroot)' | tail -1 | tr -d '\r')"
          echo "matlabroot: $root"
          test -d "$root"
          # The SAME build tree. Reconfiguring only adds the MATLAB target; nothing rebuilds.
          cmake -S . -B build -DBWA_BUILD_MATLAB=ON -DMatlab_ROOT_DIR="$root" | tee matlab-configure.log
          # LOUD on the one failure these steps exist to catch: the option skips SILENTLY when it
          # finds no toolchain, so without this the job would build nothing and pass.
          grep -q "MATLAB MEX enabled" matlab-configure.log
          cmake --build build --target bwa_mex_matlab
          mex=bindings/matlab/bin/matlab/macos-universal/bwa_mex.mexmaca64
          test -s "$mex"
          test -s bindings/matlab/bin/matlab/macos-universal/libbw_audio.dylib
          # It has to find the engine library BESIDE it rather than on a system path.
          otool -l "$mex" | grep -q '@loader_path'

      - name: Test the MATLAB binding
        uses: matlab-actions/run-command@v2
        with:
          # run-command fails the step on an uncaught error, so raising IS the failure signal.
          command: |
            cd("bindings/matlab/tests");
            rc = run_tests();
            cd(fullfile("..", "examples"));
            rc = rc + offline_render("--tests");
            rc = rc + live_onset("--tests");
            rc = rc + AudioTunnel3DDemo_bwa("--tests");
            if rc ~= 0
                error("bwa:ci", "the MATLAB binding reported %d failing check groups", rc);
            end

      # ---- the Godot extension, and what the Windows job packs -----------------------------------
      # UNVERIFIED LOCALLY, like the rest of this job. Every file name below comes from godot-cpp's
      # own CMake: it sets OUTPUT_NAME to its GODOTCPP_SUFFIX property, whose arch component is the
      # literal "universal" when CMAKE_OSX_ARCHITECTURES holds both, and it never sets the FRAMEWORK
      # property, so CMake writes a plain lib*.dylib rather than a .framework bundle. The manifest
      # key carries no arch (Godot matches feature tags, and "universal" is not one); the FILE name
      # keeps godot-cpp's spelling. The failure mode is loud: the test -s and lipo checks below.
      - name: Cache godot-cpp build (macos)
        uses: actions/cache@v4
        with:
          path: |
            build-godot-editor
            build-godot-template_release
          key: godot-cpp-${{ env.GODOT_CPP_COMMIT }}-${{ runner.os }}

      - name: Build the Godot GDExtension (macos universal, both flavours)
        shell: bash
        run: |
          for t in editor template_release; do
            cmake -S . -B build-godot-$t -DCMAKE_BUILD_TYPE=RelWithDebInfo \
                  -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64" \
                  -DBWA_BUILD_GODOT=ON -DGODOTCPP_TARGET=$t -DBWA_BUILD_TESTS=ON
            cmake --build build-godot-$t --target bwa_gdextension
            ext=bindings/godot/addons/bw_audio/bin/libbw_audio_gd.macos.$t.universal.dylib
            test -s "$ext"
            lipo -info "$ext" | grep -q x86_64
            lipo -info "$ext" | grep -q arm64
            # It must still LOAD the engine rather than having quietly absorbed it: the addon ships
            # one engine library, and the manifest lists it as a dependency.
            otool -L "$ext" | grep -q libbw_audio.dylib
          done
          test -s bindings/godot/addons/bw_audio/bin/libbw_audio.dylib

      - name: Stage dist
        shell: bash
        run: |
          mkdir -p dist-macos/lib dist-macos/include
          cp build/libbw_audio.dylib dist-macos/lib/
          # The Apple spelling of the linux job's symbol split: the DWARF goes into a .dSYM bundle
          # beside the library, then the same export-preserving strip the pack step uses (-S -x,
          # never a bare strip on a dylib). Re-prove both slices survived it.
          dsymutil dist-macos/lib/libbw_audio.dylib -o dist-macos/lib/libbw_audio.dylib.dSYM
          strip -S -x dist-macos/lib/libbw_audio.dylib
          test -s dist-macos/lib/libbw_audio.dylib
          lipo -info dist-macos/lib/libbw_audio.dylib | grep -q x86_64
          lipo -info dist-macos/lib/libbw_audio.dylib | grep -q arm64
          ls -l dist-macos/lib; du -sh dist-macos/lib/libbw_audio.dylib.dSYM
          cp include/bw_audio.h      dist-macos/include/
          cp LICENSE THIRD_PARTY-NOTICES.md dist-macos/
          cat > dist-macos/DIST.txt <<EOF
          bw_audio macos-universal - limited distribution build
          commit   ${{ github.sha }} (${{ github.ref_name }})
          built    $(date -u +%Y-%m-%dT%H:%M:%S)Z  (GitHub Actions run ${{ github.run_id }})
          arches   one UNIVERSAL library, x86_64 + arm64 ($(lipo -info dist-macos/lib/libbw_audio.dylib))
          backends none. macOS has no device backend yet (CoreAudio is docs/backends.md phase 4),
                   so this runs the null and manual sinks: offline rendering and the test suite.
                   SteamAudio=yes (STATIC), so the binaural path is the real HRTF decode.
          unsigned NOT code-signed and NOT notarized. Gatekeeper blocks a downloaded unsigned
                   library, so clear the quarantine flag after unzipping:
                     xattr -dr com.apple.quarantine <this folder>
                   Shipping outside a lab needs a Developer ID signature and notarization.
          contents lib/libbw_audio.dylib (stripped) + lib/libbw_audio.dylib.dSYM (its symbols;
                   keep the two together to symbolize a crash, ship only the dylib) +
                   include/bw_audio.h. A Unity or Godot consumer wants the package or the addon
                   instead - both carry this library already, stripped, with their import
                   settings set.
          license  GPLv3 (LICENSE) + THIRD_PARTY-NOTICES.md. No ASIO SDK here, so the complete
                   corresponding source is this repo at
                   https://github.com/aforren1/cave-audio/tree/${{ github.sha }}
                   plus Steam Audio (Apache-2.0, statically linked); on a tagged release its
                   source ships as bw_audio-steam-audio-src-<tag>.zip.
          EOF
          cat dist-macos/DIST.txt

          # What the Windows job packs into the two bindings, plus the whole dist tree so that job
          # can zip it as a release asset. Same split as android and linux: the packaged copies are
          # stripped, the standalone artifact's are not.
          mkdir -p pack-macos/godot pack-macos/unity pack-macos/matlab
          cp -r dist-macos pack-macos/dist
          # The MATLAB MEX and its engine library, for the cross-platform toolbox the windows job
          # assembles. arm64 MEX, universal dylib - see the MATLAB steps above.
          cp bindings/matlab/bin/matlab/macos-universal/bwa_mex.mexmaca64 pack-macos/matlab/
          cp build/libbw_audio.dylib pack-macos/matlab/
          strip -S -x pack-macos/matlab/libbw_audio.dylib
          cp bindings/godot/addons/bw_audio/bin/libbw_audio_gd.macos.editor.universal.dylib \
             bindings/godot/addons/bw_audio/bin/libbw_audio_gd.macos.template_release.universal.dylib \
             build/libbw_audio.dylib pack-macos/godot/
          cp build/libbw_audio.dylib pack-macos/unity/
          # -S drops the debug map, -x every local symbol. Both are what Xcode itself does to a
          # shared library ("Strip Style: Non-Global Symbols"), and they leave the global symbol
          # table the dynamic linker binds against - which -fvisibility=hidden has already reduced
          # to the bwa_* ABI. A bare `strip` is the one to avoid here: on a Mach-O dylib it will
          # take the exported entries with it and the result no longer loads.
          strip -S -x pack-macos/godot/*.dylib pack-macos/unity/*.dylib
          # Prove the strip did not damage them.
          for f in pack-macos/godot/*.dylib pack-macos/unity/*.dylib; do
            test -s "$f"
            lipo -info "$f" | grep -q arm64
          done
          ls -l pack-macos/godot pack-macos/unity

      # ---- Python wheel (nanobind) --------------------------------------------------------------
      # Same argument as the other two jobs. The wheel is NOT universal even though the engine
      # library inside it is: a wheel's platform tag names one architecture, so this ships for the
      # runner's own (arm64 on the current macos-latest image). Nothing else here changes.
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Build the Python wheel
        shell: bash
        run: |
          uv python install 3.12
          (cd bindings/python && uv build --wheel --python 3.12 --out-dir "$GITHUB_WORKSPACE/pack-macos/python")
          whl=$(ls "$GITHUB_WORKSPACE"/pack-macos/python/*.whl)
          echo "built $(basename "$whl")"
          case "$(basename "$whl")" in
            *-cp312-abi3-*) : ;;
            *) echo "expected a cp312-abi3 wheel, got $(basename "$whl")"; exit 1 ;;
          esac
          # The extension must find the engine library beside it, not on the system path.
          unzip -o -q "$whl" -d "$GITHUB_WORKSPACE/wheel-inspect"
          otool -l "$GITHUB_WORKSPACE"/wheel-inspect/bw_audio/_bwa*.so | grep -q '@loader_path'
          test -s "$GITHUB_WORKSPACE"/wheel-inspect/bw_audio/libbw_audio.dylib

      - name: Test the Python wheel (from the INSTALLED wheel, not the source tree)
        shell: bash
        run: |
          uv venv --python 3.12 .wheelenv
          uv pip install --python .wheelenv pytest numpy "$GITHUB_WORKSPACE"/pack-macos/python/*.whl
          .wheelenv/bin/python -m pytest -q --color=no bindings/python/tests
          .wheelenv/bin/python bindings/python/examples/offline_render.py --tests
          .wheelenv/bin/python bindings/python/examples/live_onset.py --tests

      - name: Upload artifact (Python wheel)
        uses: actions/upload-artifact@v6
        with:
          name: bw_audio-python-macos-${{ steps.ver.outputs.version }}-r${{ github.run_number }}
          path: pack-macos/python/
          retention-days: 30
          if-no-files-found: error

      - name: Upload artifact (macOS engine)
        uses: actions/upload-artifact@v6
        with:
          name: bw_audio-macos-universal-${{ steps.ver.outputs.version }}-r${{ github.run_number }}
          path: dist-macos/
          retention-days: 30
          if-no-files-found: error

      - name: Upload artifact (packing input for the windows job)
        uses: actions/upload-artifact@v6
        with:
          name: macos-pack-input
          path: pack-macos/
          retention-days: 1      # an intra-run handoff, not a download
          if-no-files-found: error

  # ---- the RELEASE Python wheels (manylinux + universal2) --------------------------------------
  # The three per-runner `uv build --wheel` steps above are the FAST GATE: one per desktop job,
  # proving the binding still builds and tests where the engine was just built. What they cannot
  # produce is a wheel a stranger can install. `uv build` tags for the MACHINE - the runner image's
  # glibc on Linux, the runner's own architecture on macOS - so the Linux wheel refused an older
  # distribution and the macOS wheel served one of the two Apple architectures.
  #
  # This job fixes both, and only those two: it runs cibuildwheel, which builds the Linux wheel
  # INSIDE a manylinux container and the macOS wheel for x86_64 and arm64 at once. Windows is
  # deliberately absent - a Windows wheel already names one ABI and one architecture, so the
  # windows job's own wheel IS the release's and there is nothing for a container to add.
  #
  # The release step in the windows job therefore attaches the Windows wheel from that job and
  # these two from here. The per-runner Linux and macOS wheels stay as artifacts and stop being
  # release assets.
  #
  # Everything the Linux wheel links is built inside the container, phonon included, by
  # tools/phonon/cibw-before-all-linux.sh over the one recipe in tools/phonon/build-phonon.sh -
  # the same script the composite action runs. That is why the recipe is a script now: a composite
  # action runs on the RUNNER, and the archives have to come from the image that links them.
  #
  # macOS side: UNVERIFIED LOCALLY, like the macos job. Nobody here has a Mac, so the universal2
  # build, delocate's repair and the deployment target below came out of cibuildwheel's
  # documentation. The failure modes are all loud (the tag assertion, lipo, otool).
  wheels:
    name: wheels (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: macos
    runs-on: ${{ matrix.os }}
    # A cold phonon cache dominates, exactly as it does in the other jobs.
    timeout-minutes: 150
    env:
      # ONE reference to the build image, read in two places: the prime step's `docker run` below,
      # and cibuildwheel itself. They MUST be the same image, or the stamp the before-all script
      # writes beside the staged archives will not match and every run rebuilds phonon inside the
      # container. A digest rather than a tag for the same reason a submodule is a sha. This is
      # cibuildwheel 4.2.1's own pin for the `manylinux_2_28` alias; bump it by running
      # cibuildwheel and reading the digest it prints when it starts the container.
      # UNUSED on macOS: cibuildwheel reads this option only for a Linux build.
      CIBW_MANYLINUX_X86_64_IMAGE: quay.io/pypa/manylinux_2_28_x86_64@sha256:53390351aeb4688114b02c36a23b3e6ce1166ee9b7afc5df1a4f776354fc764c
      # NOT named CIBW_*: cibuildwheel rejects environment variables with that prefix that it
      # does not recognize, which is a good rule and this is not one of its options.
      CIBUILDWHEEL_VERSION: "4.2.1"
    steps:
      - uses: actions/checkout@v6
        # no submodules: the phonon script fetches steam-audio-source itself, and only on a miss

      # `python`, not `python3`: both pinned Steam Audio scripts are driven that way, and on macOS
      # this job runs them on the runner rather than in a container.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Phonon cache key (submodule sha, no checkout needed)
        id: phonon-key
        shell: bash
        run: echo "sha=$(git rev-parse HEAD:third_party/steam-audio-source)" >> "$GITHUB_OUTPUT"

      # Two cache steps rather than one with a conditional key, because the macOS entry has to be
      # BYTE-IDENTICAL to the macos job's: that job builds the same universal archives, and one
      # shared entry means only one of the two ever pays for them. On a cold cache the two jobs
      # run at the same time and both build; one of them then loses the save with an "already
      # exists" warning, which costs a build and nothing else. The Linux entry cannot be shared
      # with the linux job - those archives are the ubuntu image's gcc, and the whole point here
      # is that this wheel's phonon comes from the manylinux image.
      - name: Cache phonon (manylinux container build)
        id: phonon-linux
        if: matrix.platform == 'linux'
        uses: actions/cache@v5
        with:
          path: third_party/steam-audio-artifacts
          # The IMAGE is part of this key: archives built by one image must never be restored
          # into another. So are the scripts, because they are the recipe.
          key: phonon-manylinux-v1-${{ env.CIBW_MANYLINUX_X86_64_IMAGE }}-${{ steps.phonon-key.outputs.sha }}-${{ hashFiles('third_party/patches/**', 'tools/phonon/**') }}

      - name: Cache phonon (built Steam Audio core)
        id: phonon-mac
        if: matrix.platform == 'macos'
        uses: actions/cache@v5
        with:
          path: third_party/steam-audio-artifacts
          key: phonon-osx-v2-${{ steps.phonon-key.outputs.sha }}-${{ hashFiles('third_party/patches/**') }}

      # cibuildwheel copies the project INTO the container and copies only the wheel back out, so
      # a phonon built by its before_all step never reaches the workspace and could never be
      # cached. Build it here instead, in the same image, through the same script: the staged
      # archives land in the workspace, the cache saves them, and the before_all inside
      # cibuildwheel finds the stamp and skips straight past the build.
      - name: Prime the phonon staging inside the manylinux image
        if: matrix.platform == 'linux' && steps.phonon-linux.outputs.cache-hit != 'true'
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/project" -w /project \
            "$CIBW_MANYLINUX_X86_64_IMAGE" bash tools/phonon/cibw-before-all-linux.sh

      # The package directory is bindings/python, but the working directory has to be the
      # REPOSITORY: the build needs the whole tree (cmake.source-dir is "../.."), and cibuildwheel
      # copies the working directory into the container. Same reason pyproject.toml points
      # scikit-build-core at the repo root.
      - name: Build the wheel (cibuildwheel)
        run: uvx cibuildwheel@${{ env.CIBUILDWHEEL_VERSION }} --platform ${{ matrix.platform }} bindings/python

      - name: Check the manylinux wheel
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          whl=$(ls wheelhouse/*.whl)
          # tr: BSD wc pads its count with spaces, so the macOS copy of this line needs it.
          test "$(ls wheelhouse/*.whl | wc -l | tr -d ' ')" = 1
          echo "built $(basename "$whl")"
          # manylinux_2_28, not the runner's glibc, and still one wheel for every Python from
          # 3.12. The name carries TWO platform tags: auditwheel found the wheel eligible for
          # manylinux_2_27 as well and says so in the filename, so match the end of the name
          # rather than the whole of it.
          case "$(basename "$whl")" in
            *-cp312-abi3-*manylinux_2_28_x86_64.whl) : ;;
            *) echo "expected a cp312-abi3 manylinux_2_28_x86_64 wheel, got $(basename "$whl")"; exit 1 ;;
          esac
          unzip -l "$whl"
          unzip -o -q "$whl" -d wheel-inspect
          # The engine library and the extension, side by side inside the package.
          test -s wheel-inspect/bw_audio/libbw_audio.so
          ls wheel-inspect/bw_audio/_bwa*.so
          # auditwheel must have grafted NOTHING. The engine dlopens libasound and libjack, so
          # neither is in its NEEDED list and the --exclude flags now hold trivially; they and
          # these two assertions stay as GUARDS, because bundling either was always wrong (a
          # bundled libjack cannot match the running server, and libasound is on every Linux
          # desktop). Everything else the engine needs is in the manylinux policy. A
          # bw_audio.libs/ directory here means the repair vendored something, which would also
          # mean it rewrote the extension's runpath.
          ! test -d wheel-inspect/bw_audio.libs
          ! find wheel-inspect -name 'libasound*' -o -name 'libjack*' | grep .
          # And the $ORIGIN link survived, so the extension still finds the engine beside it.
          readelf -d wheel-inspect/bw_audio/_bwa*.so | grep -E 'RUNPATH|RPATH' | grep -q 'ORIGIN'

      - name: Check the universal2 wheel
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          whl=$(ls wheelhouse/*.whl)
          # tr: BSD wc pads its count with spaces, so the macOS copy of this line needs it.
          test "$(ls wheelhouse/*.whl | wc -l | tr -d ' ')" = 1
          echo "built $(basename "$whl")"
          case "$(basename "$whl")" in
            *-cp312-abi3-macosx_*_universal2.whl) : ;;
            *) echo "expected cp312-abi3-macosx_*_universal2, got $(basename "$whl")"; exit 1 ;;
          esac
          unzip -l "$whl"
          unzip -o -q "$whl" -d wheel-inspect
          test -s wheel-inspect/bw_audio/libbw_audio.dylib
          # BOTH slices in BOTH binaries. A universal2 wheel whose engine library is one
          # architecture links, installs, imports on the runner, and fails on half the Macs that
          # download it - the same failure the macos job's lipo checks exist to prevent.
          for f in wheel-inspect/bw_audio/libbw_audio.dylib wheel-inspect/bw_audio/_bwa*.so; do
            lipo -info "$f"
            lipo -info "$f" | grep -q x86_64
            lipo -info "$f" | grep -q arm64
          done
          # delocate should have had nothing to do: the engine dylib links system frameworks only,
          # and the extension finds the engine through @loader_path.
          otool -L wheel-inspect/bw_audio/_bwa*.so
          otool -l wheel-inspect/bw_audio/_bwa*.so | grep -q '@loader_path'
          ! test -d wheel-inspect/bw_audio/.dylibs

      # A FIXED artifact name, like the other jobs' pack inputs: the windows job downloads these
      # two by name for the release. No version in the name, because a wheel's filename already
      # carries the only version a wheel has (the ABI version from bw_audio.h), and 30 days
      # because these are also the wheels a human wants off a branch build.
      - name: Upload artifact (release wheel)
        uses: actions/upload-artifact@v6
        with:
          name: release-wheel-${{ matrix.platform }}
          path: wheelhouse/*.whl
          retention-days: 30
          if-no-files-found: error
