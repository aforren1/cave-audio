# CI: build + test the core engine ("the C part"), and package bw_audio.dll for
# limited distribution as a workflow artifact (repo access required to download).
#
# ONE ENGINE PER PLATFORM. Each desktop job builds the engine ONCE, runs ctest on it, and then
# installs it as an engine SDK (`cmake --install ... --component bwa_sdk`). Every binding in that
# job - the MATLAB MEX, the Octave MEX, both Godot extension flavours and the Python wheel -
# configures with -DBWA_ENGINE_SDK against that tree, which makes the root CMakeLists compile no
# engine at all (see its "SDK MODE" block). So the binary a package ships IS the binary that
# job tested, and each job builds one engine where it used to build four. Every step that stages
# the engine somewhere asserts the file it staged against the SDK's, so the claim cannot rot.
#
# LINUX BUILDS ITS ENGINE IN A CONTAINER. A manylinux_2_28 wheel needs a glibc-2.28 engine and the
# runner image carries 2.39, so the linux job ran one engine through ctest while the wheels job
# built a different one for the release wheel. Now tools/ci/build-engine-manylinux.sh builds,
# tests and installs the ONE Linux engine inside that image, and the MEX pair, the Godot addon
# and the wheel all take it from there. Only the engine step is containerized: MATLAB and the
# Godot toolchain do not install in AlmaLinux 8, and they do not need to - a binding compiled on
# the runner against a glibc-2.28 shared object is an ordinary ABI client.
#
# BUILDING AND PACKING ARE TWO JOBS. `windows` builds and tests the Windows engine and every
# binding that links it, and it waits for NOTHING: it starts with android, linux and macos rather
# than after them, which is where most of this workflow's wall time used to go. It ends by handing
# over a fixed-name `windows-pack-input`, the same way the other three jobs do. `package` is the
# one that waits (`needs: [windows, android, linux, macos, wheels]`): it downloads the four pack
# inputs plus the release wheels, packs the Godot addon, the Unity package and the MATLAB toolbox,
# and on a tag creates the release. It compiles nothing. The per-platform engine artifacts are
# uploaded by the jobs that built them, so they exist even when packing fails.
#
# Scope (deliberate, see third_party/README.md):
#   - ASIO backend: BUILT. The SDK is fetched from Steinberg's official URL (the
#     repo's documented one-liner) and cached; it is dual-licensed GPLv3/proprietary
#     and this project uses the GPLv3 option, consistent with the repo LICENSE — so
#     the artifact is redistributable under GPLv3 (source = this repo at the commit).
#   - Steam Audio: BUILT STATICALLY (the patched phonon core, recipe =
#     third_party/README.md, driven by .github/actions/build-phonon), cached on the
#     submodule sha + patch hash — the first run pays the phonon build, later runs
#     restore it. The with-SDK tests (reflect/bake/path/steam_decode) run, binaural is
#     the real HRTF decode, and phonon lives INSIDE bw_audio.dll: there is no second
#     file to ship or to keep beside it. On a tag its corresponding source ships too.
#   - Tools (playground/layout_tool/calib_view + calibrate/zylia_probe): BUILT and
#     shipped in the artifact. Their imgui-test-engine UI suites need a display +
#     OpenGL, which runners don't have — ctest excludes those three suites here
#     (they run locally / at the rig).
#   - Godot binding: BUILT and TESTED. Unlike the imgui tools, Godot's --headless
#     needs no display or GL, so the demo scenes and the Godot playground's self-test
#     are ordinary CI. Its own build trees (GODOTCPP_TARGET is build-wide, and a
#     shippable addon needs both editor and template_release), cached on the pinned
#     godot-cpp commit. Ships as a fourth release asset.
#   - Android: CROSS-BUILT in its own job (arm64-v8a and x86_64, android-26), with a static
#     phonon per ABI so an APK gets the HRTF decode, occlusion, pathing and the reflection bed
#     inside libbw_audio.so, and shipped as its own artifact. It also builds the Godot GDExtension for arm64-v8a and
#     hands both libraries to the package job, which is the only place that packs the
#     bindings. No emulator: see the android job's own note.
#   - Linux and macOS: the two portability jobs SHIP too. Each builds its own Godot GDExtension
#     (both flavours) and hands the extension plus the engine library to the package job, the same
#     way android does, so one addon and one Unity package carry every platform. Each also uploads
#     a standalone engine artifact of its own. macOS builds UNIVERSAL (x86_64 + arm64) and is
#     unsigned; see those jobs' notes.
#   - MATLAB and Octave binding: BOTH MEX files are built INSIDE each desktop job, after that
#     job's engine build, so each links that platform's engine (ASIO/WASAPI, JACK/ALSA, the
#     universal dylib) rather than a second one. Every desktop job installs Octave (apt on Linux,
#     choco on Windows, brew on macOS) and runs the four octave_* ctests. The package job
#     assembles all six binaries into ONE toolbox folder: bin/<arch>/ per platform, each holding
#     that platform's MATLAB MEX, its Octave MEX and the ONE engine library both load. UNVERIFIED
#     LOCALLY: no runner MATLAB is reachable from here, so every MATLAB step comes from
#     mathworks/ci-configuration-examples. The Octave half is verified locally on Windows and
#     Linux; the macOS one is not, like the rest of that job.
#   - Python wheels: every desktop job builds one with `uv build --wheel` as its own fast gate,
#     and a separate `wheels` job builds the NINE a RELEASE ships - cp310, cp311 and cp312-abi3
#     on each of the three desktops, Linux inside a manylinux container, macOS as universal2 -
#     with cibuildwheel. Three per platform and not one: nanobind's stable ABI starts at 3.12, so
#     the cp312 wheel covers 3.12 and later while 3.10 and 3.11 each need their own. NO wheel
#     builds an engine: the `wheels` job downloads each desktop job's engine SDK and hands
#     cibuildwheel the path, so it compiles the nanobind extension and nothing else, and builds
#     no phonon at all. That is why it `needs: [windows, linux, macos]`.
#   - Configs: x64 only. RelWithDebInfo is the full build (tested + tools);
#     Debug builds the engine + bwa_minimal for downstream debugging (smoke-run).
#
# No audio hardware on runners: the test descs force the null sink (bwa_desc.sink
# = BWA_SINK_NULL) and everything else auto-falls-back to it, by design.
name: ci

on:
  push:
    branches: [main]
    tags: ['v*']        # a tag additionally RELEASES the Unity package (see the release steps)
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read        # least privilege: only the `package` job writes, and it asks for it itself

env:
  # The Godot editor CI tests against, and the godot-cpp commit the extension builds against.
  # These two must agree: godot-cpp's bundled extension_api.json declares which engine version
  # its generated bindings target. Bump them together, and keep GODOT_CPP_COMMIT in step with
  # BWA_GODOT_CPP_COMMIT in bindings/godot/CMakeLists.txt (this one only keys the cache).
  GODOT_VERSION: 4.7.1-stable
  GODOT_CPP_COMMIT: ba0edfed90512ec64aba51d4295a3e7e30112f86

jobs:
  windows:
    runs-on: windows-latest
    # NO `needs`. This job builds and tests the Windows engine, the two MEX gateways, both Godot
    # extension flavours and the Python wheel, all against the one engine SDK it installs - and
    # none of that wants a line from another platform. It used to wait for the three cross-builds
    # and for the wheels job, because the SAME job also packed the bindings and cut the release.
    # That packing is the `package` job now, so the longest job in the matrix starts at t=0 and
    # the cross-builds run beside it instead of in front of it.
    #
    # What the pack still needs from a Windows machine - the engine, the two extension flavours,
    # the MEX pair and the wheel - leaves here as the fixed-name `windows-pack-input` artifact at
    # the end of the job, exactly as android, linux and macos hand theirs over.
    timeout-minutes: 75   # the uncached phonon build is the long pole; cached runs are far under
    steps:
      - uses: actions/checkout@v7
        # no submodules by default: steam-audio-source is fetched only on a phonon cache miss

      # ---- one version -----------------------------------------------------------------------------
      # BWA_VERSION_* in the header is what every built thing reports (bwa_get_version, the wheel
      # filename, the MEX, the CMake package), and the tag is what the release is called. They are
      # ONE number by contract: tools/release.ps1 writes the tag into the header before tagging.
      # A hand-made tag can break that, so a v-tag whose header says something else fails HERE,
      # first thing, before any job spends an hour building a release that would contradict itself.
      - name: Check the header version against the tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          h=$(sed -nE 's/^#define BWA_VERSION_MAJOR ([0-9]+).*/\1/p' include/bw_audio.h).$(sed -nE 's/^#define BWA_VERSION_MINOR ([0-9]+).*/\1/p' include/bw_audio.h).$(sed -nE 's/^#define BWA_VERSION_PATCH ([0-9]+).*/\1/p' include/bw_audio.h)
          t="${GITHUB_REF_NAME#v}"
          echo "header BWA_VERSION $h, tag $t"
          if [ "$h" != "$t" ]; then
            echo "::error::include/bw_audio.h says $h but this tag is v$t. Cut releases with tools/release.ps1, which sets the header to the tag."
            exit 1
          fi

      - name: Version
        id: ver
        shell: bash
        run: |
          # The same rule the android, linux and macos jobs use, and the same one tools/upm/pack.ps1
          # derives in the package job, so every artifact of one run carries the same version. This
          # job no longer runs the pack, so it needs its own copy to name the two artifacts below.
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            v="${GITHUB_REF_NAME#v}"
          else
            v="0.0.0-dev"
            if d=$(git describe --tags --long --dirty --match 'v*' 2>/dev/null); then
              if [[ "$d" =~ ^v?(.+)-([0-9]+)-g([0-9a-f]+)(-dirty)?$ ]]; then
                if [ "${BASH_REMATCH[2]}" = 0 ]; then v="${BASH_REMATCH[1]}"
                else v="${BASH_REMATCH[1]}-dev.${BASH_REMATCH[2]}.g${BASH_REMATCH[3]}"; fi
              fi
            fi
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "windows version: $v"

      - name: Cache ASIO SDK
        id: asiosdk
        uses: actions/cache@v6
        with:
          path: third_party/asiosdk
          key: asiosdk-v1   # bump manually to pick up a new Steinberg release

      - name: Fetch ASIO SDK (Steinberg, GPLv3 option)
        if: steps.asiosdk.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          curl.exe -fsSL -o asiosdk.zip https://www.steinberg.net/asiosdk
          Expand-Archive asiosdk.zip -DestinationPath asiosdk_tmp
          # the zip's top-level dir name varies by release — locate common/asio.h and take its parent
          $hit = Get-ChildItem asiosdk_tmp -Recurse -Filter asio.h |
                 Where-Object { $_.Directory.Name -eq 'common' } | Select-Object -First 1
          if (-not $hit) { throw "asio.h not found in the Steinberg zip — layout changed?" }
          Move-Item $hit.Directory.Parent.FullName third_party/asiosdk
          Remove-Item asiosdk.zip, asiosdk_tmp -Recurse -Force

      - name: Phonon cache key (submodule sha, no checkout needed)
        id: phonon-key
        shell: bash
        run: echo "sha=$(git rev-parse HEAD:third_party/steam-audio-source)" >> "$GITHUB_OUTPUT"

      - name: Cache phonon (built Steam Audio core)
        id: phonon
        uses: actions/cache@v6
        with:
          path: third_party/steam-audio-artifacts
          key: phonon-v1-${{ steps.phonon-key.outputs.sha }}-${{ hashFiles('third_party/patches/**') }}

      # The recipe is a composite action so the Linux, macOS and Android phonon builds can call it
      # instead of copying it (docs/backends.md). Its inputs are documented in the action itself.
      - name: Build phonon (cache miss only; recipe = third_party/README.md)
        if: steps.phonon.outputs.cache-hit != 'true'
        uses: ./.github/actions/build-phonon
        with:
          platform: windows
          arch: x64
          toolchain: vs2022
          stage-dir: windows-x64

      # ---- Octave (the second half of the MATLAB binding's toolchain) -----------------------------
      # octave.portable, NOT the `octave` meta package. The meta package pulls octave.install, whose
      # own script drives the vendor GUI installer with AUTOHOTKEY because its silent switches do not
      # work - a thing to avoid on a headless runner. octave.portable just unzips the official
      # ftp.gnu.org 7z and renames the folder, which is verifiable and cannot hang: its
      # chocolateyInstall.ps1 extracts octave-9.2.0-w64.7z into
      # <ChocolateyInstall>\lib\octave.portable\tools\ and renames it to `octave`, so mkoctfile.exe
      # and octave-cli.exe land in tools\octave\mingw64\bin. That is the layout
      # bindings/matlab/CMakeLists.txt globs as $ENV{OCTAVE_HOME}/bin, so pointing OCTAVE_HOME at
      # the mingw64 directory is the whole integration.
      #
      # The version is PINNED: it is the newest octave.portable carries (June 2024) and an unpinned
      # install would let a new package change the compiler under this job overnight. The cost is a
      # 436 MB download from ftp.gnu.org plus the unzip, which is minutes against this job's phonon
      # build. If that ever bites, the alternative is a cached slim archive (pr0m1th3as/octave-ci
      # does exactly that) at the price of a third-party release to trust.
      - name: Install Octave
        shell: pwsh
        run: |
          choco install octave.portable --version 9.2.0 -y --no-progress
          # DISCOVER the install rather than hard-coding the path above: the package has renamed its
          # unpacked folder before. Fail loudly HERE, where the reason is obvious, instead of letting
          # CMake skip the Octave MEX and the configure grep report something vaguer.
          $ci = if ($env:ChocolateyInstall) { $env:ChocolateyInstall } else { 'C:\ProgramData\chocolatey' }
          $lib = Join-Path $ci 'lib\octave.portable'
          $mk = Get-ChildItem $lib -Recurse -Filter mkoctfile.exe -ErrorAction SilentlyContinue |
                Select-Object -First 1
          if (-not $mk) { throw "mkoctfile.exe not found under $lib - did octave.portable change its layout?" }
          # OCTAVE_HOME is OCTAVE'S OWN variable, not a name this repository made up: it is the
          # install PREFIX, which on Windows is the mingw64 directory (include/, lib/ and
          # share/ sit under it), and mkoctfile derives every path it passes the compiler
          # from it. The first run exported the directory ABOVE mingw64, because that was
          # the shape the CMake glob wanted, and mkoctfile then looked for mex.h under
          # <that>/include, where nothing is. CMake globs $ENV{OCTAVE_HOME}/bin now, and
          # this asserts the shape rather than assuming it, so a moved mkoctfile cannot
          # silently produce a hint that points nowhere.
          $bin = Split-Path $mk.FullName -Parent
          if ($bin -notmatch '[\\/]mingw64[\\/]bin$') { throw "unexpected mkoctfile location: $bin" }
          $oct = Split-Path $bin -Parent
          # FORWARD slashes: a backslash is an escape character in a CMake glob pattern, not a
          # separator. The CMakeLists normalizes it as well; neither side relies on the other.
          $oct = $oct -replace '\\','/'
          "OCTAVE_HOME=$oct" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          # Prove the prefix is right the way the build will use it: with OCTAVE_HOME set,
          # mkoctfile's own idea of the Octave include directory must hold mex.h.
          $env:OCTAVE_HOME = $oct
          $inc = (& $mk.FullName -p OCTINCLUDEDIR).Trim()
          if (-not (Test-Path (Join-Path $inc 'mex.h'))) { throw "no mex.h under $inc - OCTAVE_HOME=$oct is not the prefix mkoctfile expects" }
          & $mk.FullName --version
          & (Join-Path $bin 'octave-cli.exe') --version | Select-Object -First 1

      - name: Configure
        shell: bash
        run: |
          # No -G pin: CMake defaults to the newest Visual Studio on the runner. Pinning
          # "Visual Studio 17 2022" broke when the windows-latest image dropped VS 2022.
          #
          # THE ENGINE ONLY. No binding is configured in this tree any more: it builds and tests
          # the engine, the step after the smoke run turns it into an install SDK, and every
          # binding in this job then links THAT file. One engine per platform, and the binary the
          # packages ship is the binary ctest just ran.
          cmake -S . -B build -A x64 \
                -DBWA_BUILD_PLAYGROUND=ON \
                -DBWA_BUILD_CALIBVIEW=ON \
                -DBWA_BUILD_CALIBRATE=ON | tee configure.log
          # the artifact must contain the production device path AND the HRTF decode —
          # fail loudly if either didn't wire up
          grep -q "ASIO backend ENABLED" configure.log
          grep -q "Steam Audio ENABLED" configure.log

      - name: Build (RelWithDebInfo — everything)
        shell: bash
        run: cmake --build build --config RelWithDebInfo

      - name: Build (Debug — engine + smoke only)
        run: cmake --build build --config Debug --target bw_audio bwa_minimal

      - name: Test
        # 45 registered, 42 run: -E drops the three GUI UI suites, which need a display and OpenGL.
        # No binding test here any more - the bindings have their own tree (build-bind) below, and
        # this one is the engine the SDK is cut from.
        run: ctest --test-dir build -C RelWithDebInfo --output-on-failure -E '^(playground|layout_tool|calib_view)$'

      - name: Smoke (Debug)
        # the Debug dll ships too — prove it loads and runs a lifecycle
        # (no device on the runner: the AUTO sink policy falls back to the silent null sink)
        run: build/Debug/bwa_minimal.exe

      # ---- the engine SDK ------------------------------------------------------------------------
      # ONE ENGINE PER PLATFORM. Everything below this line - the two MEX gateways, both Godot
      # extension flavours, the wheel - used to compile its own copy of the engine, so this job
      # built it four times and shipped four files that were only meant to be the same. Now it is
      # installed once, from the tree ctest just ran, and each binding configures with
      # -DBWA_ENGINE_SDK against it (root CMakeLists, "SDK MODE").
      #
      # --component bwa_sdk: this build tree also carries raylib's install rules and the Python
      # binding's, and an unfiltered install would mix all three into one prefix.
      - name: Install the engine SDK
        shell: bash
        run: |
          cmake --install build --prefix "$GITHUB_WORKSPACE/engine-sdk" \
                --component bwa_sdk --config RelWithDebInfo
          test -s engine-sdk/bin/bw_audio.dll
          test -s engine-sdk/lib/bw_audio.lib
          test -s engine-sdk/include/bw_audio.h
          test -s engine-sdk/lib/cmake/bw_audio/bw_audioConfig.cmake
          # The one assertion that makes the rest of this job mean anything: what the SDK carries
          # has to BE the file the Test step ran against, not a rebuild of it.
          cmp build/RelWithDebInfo/bw_audio.dll engine-sdk/bin/bw_audio.dll

      # ---- the Octave MEX, against the SDK --------------------------------------------------------
      # Its own tree, in bindings-only mode. The MATLAB half joins it further down, once
      # matlab-actions has installed a MATLAB for FindMatlab to find; that two-phase shape is the
      # same one this job has always had, just moved off the engine tree.
      - name: Configure and build the Octave MEX
        shell: bash
        run: |
          cmake -S . -B build-bind -A x64 \
                -DBWA_ENGINE_SDK="$GITHUB_WORKSPACE/engine-sdk" \
                -DBWA_BUILD_MATLAB=ON | tee bind-configure.log
          # SDK MODE is not a fallback: if it silently did not engage, this tree would compile a
          # second engine and every claim above would be false.
          grep -q "SDK MODE" bind-configure.log
          # And BWA_BUILD_MATLAB skips SILENTLY when it finds no toolchain, which is exactly the
          # shape that would let the Octave MEX stop being built without anyone noticing.
          grep -q "Octave MEX enabled" bind-configure.log
          cmake --build build-bind --config RelWithDebInfo
          test -s bindings/matlab/bin/octave/win-x64/bwa_mex.mex
          # The engine beside the gateway is the SDK's, byte for byte.
          cmp engine-sdk/bin/bw_audio.dll bindings/matlab/bin/octave/win-x64/bw_audio.dll

      - name: Test the Octave binding
        # --no-tests=error: an empty selection is a FAILURE, not a pass. octave_tests itself exits
        # 77 (SKIPPED) when no MEX was staged for the running interpreter, which the build step
        # above already ruled out.
        run: ctest --test-dir build-bind -C RelWithDebInfo --output-on-failure --no-tests=error -R '^octave_'

      # ---- the MATLAB MEX ------------------------------------------------------------------------
      # UNVERIFIED LOCALLY on a runner: written from the patterns in
      # https://github.com/mathworks/ci-configuration-examples. On a GitHub-hosted runner for a
      # public repository no license token is needed, but the license only exists INSIDE the
      # matlab-actions run-* steps (a shell step's `matlab` launch is unlicensed), so anything
      # that has to run MATLAB code goes through run-command. MSVC - already here for the
      # engine - is a compiler MATLAB supports for MEX on Windows.
      #
      # Inside this job, after the engine build, so the MEX links the DLL this job already produced
      # with ASIO, WASAPI and a static phonon intact, rather than a second engine built elsewhere.
      # It reaches that DLL through the engine SDK now, like every other binding here.
      #
      # The OCTAVE half of this binding is already built and tested by then - see the Install Octave
      # and Configure steps above. Only MATLAB waits until here, because only MATLAB needs an action
      # to install it and a licensed run-command step to drive it.
      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v3
        with:
          # Pinned, so a new MathWorks release cannot change overnight what this job tested.
          release: R2024b

      - name: Find matlabroot
        # setup-matlab puts the launcher on PATH but not matlabroot, and FindMatlab wants the
        # root. Ask MATLAB itself rather than guessing the install layout - but through
        # run-command, not `matlab -batch` in a shell step: on a public repository the license
        # is granted ONLY inside matlab-actions' run-* steps, and a direct launch dies with
        # "License checkout failed" (it did, on the first run of these steps).
        uses: matlab-actions/run-command@v3
        with:
          command: |
            f = fopen(getenv("GITHUB_ENV"), "a");
            fprintf(f, "MATLAB_ROOT=%s\n", matlabroot);
            fclose(f);

      - name: Configure and build the MATLAB MEX
        shell: bash
        run: |
          root="$MATLAB_ROOT"
          echo "matlabroot: $root"
          test -d "$root"
          # The SAME bindings tree the Octave MEX used, still in SDK mode. Reconfiguring only adds
          # the MATLAB target; nothing rebuilds, and no engine is compiled here at all.
          cmake -S . -B build-bind -DMatlab_ROOT_DIR="$root" | tee matlab-configure.log
          # LOUD on the one failure these steps exist to catch: FindMatlab not locating the
          # action's install. The option skips SILENTLY when it finds no toolchain, so without
          # this the job would build nothing, run nothing, and pass.
          grep -q "MATLAB MEX enabled" matlab-configure.log
          cmake --build build-bind --config RelWithDebInfo --target bwa_mex_matlab
          test -s bindings/matlab/bin/matlab/win-x64/bwa_mex.mexw64
          cmp engine-sdk/bin/bw_audio.dll bindings/matlab/bin/matlab/win-x64/bw_audio.dll

      - name: Test the MATLAB binding
        uses: matlab-actions/run-command@v3
        with:
          # run-command fails the step on an uncaught error, so raising IS the failure signal.
          # run_tests returns 77 when no MEX was staged, which is a failure here: the step above
          # was supposed to stage one.
          command: |
            cd("bindings/matlab/tests");
            rc = run_tests();
            cd(fullfile("..", "examples"));
            rc = rc + offline_render("--tests");
            rc = rc + live_onset("--tests");
            rc = rc + AudioTunnel3DDemo_bwa("--tests");
            if rc ~= 0
                error("bwa:ci", "the MATLAB binding reported %d failing check groups", rc);
            end

      # ---- Godot binding ---------------------------------------------------------------------
      # Its own build trees, because GODOTCPP_TARGET is a build-WIDE choice in godot-cpp: one
      # tree yields one library flavour, and a shippable addon needs two (editor for the editor,
      # template_release for exported games). The test step below builds the editor one and runs
      # the Godot ctests on it; the step after builds the release one, because the pack that used
      # to build it runs in the package job now, on a runner with no engine SDK.
      #
      # Unlike the three imgui tools, these tests DO run here: Godot's --headless mode needs no
      # display or GL, so the demo scenes and the playground self-test are ordinary CI.
      - name: Cache Godot editor
        id: godot-cache
        uses: actions/cache@v6
        with:
          path: godot-bin
          key: godot-${{ env.GODOT_VERSION }}

      - name: Fetch Godot editor
        if: steps.godot-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          # The standard build, not mono: a GDExtension needs no .NET runtime, and the mono
          # download is much larger for nothing.
          V=${GODOT_VERSION}
          curl -fsSL -o godot.zip \
            "https://github.com/godotengine/godot/releases/download/${V}/Godot_v${V}_win64.exe.zip"
          mkdir -p godot-bin && unzip -q godot.zip -d godot-bin
          test -f "godot-bin/Godot_v${V}_win64.exe"

      - name: Cache godot-cpp build
        uses: actions/cache@v6
        with:
          # Both trees: godot-cpp generates and compiles ~2100 binding files per flavour, which
          # dwarfs our own nine. Keyed on the PINNED COMMIT, so bumping it invalidates cleanly;
          # our sources rebuild incrementally on top.
          path: |
            build-godot-editor
            build-godot-template_release
          # -sdk1: these trees stopped compiling an engine of their own, so an entry saved before
          # that still holds the old targets and cache variables. Bump this suffix, never reuse it.
          key: godot-cpp-${{ env.GODOT_CPP_COMMIT }}-${{ runner.os }}-sdk1

      - name: Test (Godot binding)
        shell: bash
        run: |
          # BWA_BUILD_TESTS explicitly ON: this tree is CACHED between runs, so a stale cache
          # entry with it off would leave ctest selecting nothing.
          #
          # BWA_ENGINE_SDK: each flavour used to compile the whole engine again, so this job built
          # three of them. The extension links the SDK's import library and its POST_BUILD stages
          # the SDK's DLL into the addon.
          cmake -S . -B build-godot-editor -A x64 \
                -DBWA_ENGINE_SDK="$GITHUB_WORKSPACE/engine-sdk" \
                -DBWA_BUILD_GODOT=ON -DGODOTCPP_TARGET=editor -DBWA_BUILD_TESTS=ON \
                -DBWA_GODOT_EXE="$PWD/godot-bin/Godot_v${GODOT_VERSION}_win64.exe"
          cmake --build build-godot-editor --config RelWithDebInfo --target bwa_gdextension test_godot_room
          cmp engine-sdk/bin/bw_audio.dll bindings/godot/addons/bw_audio/bin/bw_audio.dll
          # --no-tests=error: an empty selection is a FAILURE, not a pass. Without it a broken
          # filter, a missing BWA_GODOT_EXE or a stale cache all look exactly like success.
          ctest --test-dir build-godot-editor -C RelWithDebInfo --output-on-failure \
                --no-tests=error -R '^godot_'

      - name: Build the Godot GDExtension (windows, template_release)
        shell: bash
        run: |
          # The flavour an EXPORTED game loads. tools/godot/pack.ps1 used to configure and build it
          # as part of packing; the pack is in the package job now and compiles nothing, so the
          # second flavour is built here - in the tree the godot-cpp cache above already covers, and
          # against the same engine SDK the editor flavour links.
          cmake -S . -B build-godot-template_release -A x64 \
                -DBWA_ENGINE_SDK="$GITHUB_WORKSPACE/engine-sdk" \
                -DBWA_BUILD_GODOT=ON -DGODOTCPP_TARGET=template_release -DBWA_BUILD_TESTS=ON
          cmake --build build-godot-template_release --config RelWithDebInfo --target bwa_gdextension
          # The manifest names this exact file, and the addon ships the SDK's engine beside it.
          test -s bindings/godot/addons/bw_audio/bin/bw_audio_gd.windows.template_release.x86_64.dll
          cmp engine-sdk/bin/bw_audio.dll bindings/godot/addons/bw_audio/bin/bw_audio.dll

      - name: Stage dist
        shell: pwsh
        run: |
          # -Force = mkdir -p (safe on DIRECTORIES; it truncates only files). dist/ does not exist
          # yet in this job - the packing steps that used to create it moved to the package job -
          # and the wheel step below adds dist/python beside what this one stages.
          New-Item -ItemType Directory -Force dist, dist/RelWithDebInfo, dist/Debug | Out-Null
          Copy-Item include/bw_audio.h,
                    LICENSE,
                    THIRD_PARTY-NOTICES.md dist/
          # GPLv3 corresponding source for the ASIO SDK statically compiled into bw_audio.dll.
          # The SDK is redistributable under its GPLv3 option, so ship its source BESIDE the
          # binaries (its own archive, deliberately NOT folded into the engine bundle) — a DLL
          # recipient then has the complete corresponding source, not just a fetch URL (GPLv3
          # section 6). Rides in this workflow artifact and, on a tag, as a third release asset.
          Compress-Archive -Path third_party/asiosdk -DestinationPath dist/asio-sdk-src.zip -Force
          # the JSONs live NEXT TO the tools: playground/layout_tool resolve
          # ./cave_layout.json + ./constraints.json relative to their working dir
          Copy-Item examples/cave_layout.json,
                    examples/constraints.json dist/RelWithDebInfo/
          Copy-Item build/RelWithDebInfo/bw_audio.dll,
                    build/RelWithDebInfo/bw_audio.lib,
                    build/RelWithDebInfo/bw_audio.pdb,
                    build/RelWithDebInfo/bwa_minimal.exe,
                    build/RelWithDebInfo/bwa_playground.exe,
                    build/RelWithDebInfo/bwa_layout_tool.exe,
                    build/RelWithDebInfo/bwa_calib_view.exe,
                    build/RelWithDebInfo/bwa_calibrate.exe,
                    build/RelWithDebInfo/bwa_zylia_probe.exe dist/RelWithDebInfo/
          Copy-Item build/Debug/bw_audio.dll,
                    build/Debug/bw_audio.lib,
                    build/Debug/bw_audio.pdb,
                    build/Debug/bwa_minimal.exe dist/Debug/
          @"
          bw_audio win64 — limited distribution build
          commit   ${{ github.sha }} (${{ github.ref_name }})
          built    $((Get-Date).ToUniversalTime().ToString('s'))Z  (GitHub Actions run ${{ github.run_id }})
          try      RelWithDebInfo\bwa_playground.exe — needs no audio device (renders
                   silently, the 3D view + meters stay live); bwa_playground --help for keys
          needs    the Microsoft VC++ x64 runtime (vcruntime140*.dll). Any machine with
                   Visual Studio has it; otherwise https://aka.ms/vs/17/release/vc_redist.x64.exe
          backends ASIO=yes  SteamAudio=yes (patched phonon 4.8.1+10, linked STATICALLY:
                   HRTF decode, occlusion, reflections, pathing — third_party/README.md)
          contents RelWithDebInfo/ — bw_audio.dll/.lib/.pdb (phonon is inside the dll;
                   there is no second library to keep beside it),
                   bwa_minimal.exe (smoke check: runs the whole client lifecycle, no
                   hardware needed), tools: bwa_playground / bwa_layout_tool /
                   bwa_calib_view (GUI — need a display), bwa_calibrate + bwa_zylia_probe
                   (console), cave_layout.json + constraints.json (example layout +
                   room, read by the tools from their own directory). Debug/ — engine
                   dll/.lib/.pdb + bwa_minimal. Root — include/bw_audio.h.
                   x64 only.
          license  GPLv3 (LICENSE) + THIRD_PARTY-NOTICES.md. Complete corresponding
                   source: this repo at
                   https://github.com/aforren1/cave-audio/tree/${{ github.sha }}
                   PLUS the ASIO SDK source (statically linked into bw_audio.dll) in
                   asio-sdk-src.zip beside these files — also a separate release asset.
                   Steam Audio is statically linked too (Apache-2.0); on a tagged
                   release its source ships as bw_audio-steam-audio-src-<tag>.zip.
          "@ | Out-File -Encoding utf8 dist/DIST.txt
          Get-Content dist/DIST.txt

      # ---- Python wheel (nanobind), THE FAST GATE -----------------------------------------------
      # One wheel, one interpreter, and NOT a release asset. It proves the binding still builds and
      # tests against the engine this job just built, here, before the slower `wheels` job runs at
      # all - the same role the linux and macos jobs' `uv build` steps play. The wheels a release
      # ships are the nine cibuildwheel builds in that job, Windows included since it joined the
      # matrix; this one stays a per-run artifact (bw_audio-python-win64-*) for anyone who wants
      # the branch build.
      #
      # It is still worth pinning to 3.12: the abi3 assertion below is the cheapest place to catch
      # nanobind's STABLE_ABI silently failing to engage, and it catches it in the fast job.
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true

      - name: Build the Python wheel
        shell: bash
        run: |
          uv python install 3.12
          # --python 3.12 pins the tag rather than inheriting whatever the runner image has on
          # PATH. Anything 3.12 or later produces the same abi3 wheel; pinning makes the ASSERTION
          # below meaningful instead of a report of the image's default.
          #
          # -C cmake.define.BWA_ENGINE_SDK: scikit-build-core forwards a config setting of that
          # shape straight to the CMake command line, which is what puts the root CMakeLists into
          # bindings-only mode. Without it the wheel build compiles a SECOND full engine inside its
          # own isolated build directory, and the wheel then carries a file this job never tested.
          (cd bindings/python && uv build --wheel --python 3.12 \
              -C cmake.define.BWA_ENGINE_SDK="$GITHUB_WORKSPACE/engine-sdk" \
              --out-dir "$GITHUB_WORKSPACE/dist/python")
          whl=$(ls "$GITHUB_WORKSPACE"/dist/python/*.whl)
          echo "built $(basename "$whl")"
          # The engine inside the wheel is the SDK's, byte for byte.
          unzip -o -q "$whl" -d "$GITHUB_WORKSPACE/wheel-inspect"
          cmp engine-sdk/bin/bw_audio.dll "$GITHUB_WORKSPACE/wheel-inspect/bw_audio/bw_audio.dll"
          # The stable ABI is the whole point of the 3.12 floor: without it there would be one
          # wheel per Python per platform. A version-specific tag here means nanobind's STABLE_ABI
          # did not engage, so fail rather than ship a wheel that only runs on one interpreter.
          case "$(basename "$whl")" in
            *-cp312-abi3-*) : ;;
            *) echo "expected a cp312-abi3 wheel, got $(basename "$whl")"; exit 1 ;;
          esac

      - name: Test the Python wheel (from the INSTALLED wheel, not the source tree)
        shell: bash
        run: |
          uv venv --python 3.12 .wheelenv
          uv pip install --python .wheelenv pytest numpy "$GITHUB_WORKSPACE"/dist/python/*.whl
          # No PYTHONPATH and no build tree on the path: this is the wheel a user would install.
          .wheelenv/Scripts/python -m pytest -q --color=no bindings/python/tests
          .wheelenv/Scripts/python bindings/python/examples/offline_render.py --tests
          .wheelenv/Scripts/python bindings/python/examples/live_onset.py --tests

      - name: Upload artifact (Python wheel)
        uses: actions/upload-artifact@v7
        with:
          name: bw_audio-python-win64-${{ steps.ver.outputs.version }}-r${{ github.run_number }}
          path: dist/python/
          retention-days: 30
          if-no-files-found: error

      # The engine artifact stays in THIS job, and deliberately: a native consumer's download
      # should exist whenever the engine built and tested, whether or not the cross-platform
      # packing downstream succeeded. The Unity package and the Godot addon are the package job's.
      - name: Upload artifact (engine + tools)
        uses: actions/upload-artifact@v7
        with:
          # version-r<run> : the git-describe/tag version, plus the run number so re-runs of one commit don't collide
          name: bw_audio-win64-${{ steps.ver.outputs.version }}-r${{ github.run_number }}
          path: |
            dist/
            !dist/python/**
          retention-days: 30
          if-no-files-found: error

      # The engine SDK, for the wheels job's three Windows wheels - the same bw_audio.dll this
      # job's ctest ran and every binding above links. Without this handoff cibuildwheel would
      # compile a second engine inside its own build directory and the release wheels would carry
      # a file nothing tested. The linux and macos jobs upload the same artifact under their own
      # names; Windows joined them when the wheels job gained a windows matrix entry.
      - name: Upload artifact (engine SDK for the wheels job)
        uses: actions/upload-artifact@v7
        with:
          name: windows-engine-sdk
          path: engine-sdk/
          retention-days: 1      # an intra-run handoff, not a download
          if-no-files-found: error

      # ---- what the package job packs ------------------------------------------------------------
      # A FIXED artifact name, like the android, linux and macos pack inputs: the versioned
      # artifacts above are the ones a human downloads, this one is an intra-run handoff.
      #
      # dist/ rides along whole (minus the wheel, which travels in its own directory) so the release
      # step there can zip the Windows engine bundle and the ASIO source without rebuilding
      # anything - the same rule the other three jobs follow. The binding directories are FLAT,
      # because that is the shape both pack scripts read a prebuilt platform out of.
      - name: Stage the packing input
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force `
            pack-windows/dist, pack-windows/godot, pack-windows/unity,
            pack-windows/matlab | Out-Null
          Copy-Item -Recurse dist/RelWithDebInfo, dist/Debug pack-windows/dist/
          Copy-Item dist/bw_audio.h, dist/LICENSE, dist/THIRD_PARTY-NOTICES.md,
                    dist/DIST.txt, dist/asio-sdk-src.zip pack-windows/dist/
          # The two extension flavours and the engine library the manifest names for windows.
          # pack.ps1 takes them by name out of a flat -WindowsFrom directory, the same way it
          # takes the android, linux and macos sets.
          $gb = 'bindings/godot/addons/bw_audio/bin'
          Copy-Item "$gb/bw_audio_gd.windows.editor.x86_64.dll",
                    "$gb/bw_audio_gd.windows.template_release.x86_64.dll",
                    "$gb/bw_audio.dll" pack-windows/godot/
          Copy-Item build/RelWithDebInfo/bw_audio.dll pack-windows/unity/
          # BOTH interpreters' MEX files and ONE engine library, for the toolbox the package job
          # assembles - the same three files the linux and macos jobs stage.
          Copy-Item bindings/matlab/bin/matlab/win-x64/bwa_mex.mexw64,
                    bindings/matlab/bin/octave/win-x64/bwa_mex.mex,
                    bindings/matlab/bin/matlab/win-x64/bw_audio.dll pack-windows/matlab/
          # No wheel here on purpose. Every release wheel now comes from the wheels job, Windows
          # included; this job's wheel is its fast gate and travels as its own artifact.
          Get-ChildItem -Recurse pack-windows | Where-Object { -not $_.PSIsContainer } |
            Select-Object FullName, Length

      - name: Upload artifact (packing input for the package job)
        uses: actions/upload-artifact@v7
        with:
          name: windows-pack-input
          path: pack-windows/
          retention-days: 1      # an intra-run handoff, not a download
          if-no-files-found: error

  # ---- packing and the release ------------------------------------------------------------------
  # Every other platform's libraries are packed INTO both bindings, and only a Windows machine can
  # pack them: tools/upm/pack.ps1, tools/godot/pack.ps1, tools/upm/gen-meta.ps1 and
  # tools/dist/doc-pointers.ps1 are PowerShell, and the Windows halves of both packages are MSVC
  # builds. So this job waits for the four build jobs rather than reproducing any of them.
  #
  # It COMPILES NOTHING. Every binary it ships was built and tested by the job that owns that
  # platform and arrived in that job's fixed-name pack input; this one downloads the four, packs
  # the Godot addon, the Unity package and the MATLAB toolbox, and on a tag creates the release.
  # Splitting it out of the windows job is what lets the Windows engine build start at t=0.
  #
  # The wheels job is in `needs` for the release: it builds the manylinux and universal2 wheels,
  # and the release step attaches them beside the windows job's own.
  package:
    runs-on: windows-latest
    needs: [windows, android, linux, macos, wheels]
    permissions:
      contents: write     # the release step attaches the assets and the branch push writes refs
      actions: write      # deleting this run's handoff artifacts at the end
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        # Same checkout the windows job uses - no submodules. The Steam Audio source step below
        # inits the one submodule it needs, on tags only, and everything else here is either in
        # the tree already (the pack scripts, +bwa, the addon sources) or in a pack input.

      # Every platform arrives the same way: a FIXED artifact name (versioned names are for the
      # artifacts a human downloads), so none of these steps needs version plumbing.
      - name: Download the Windows libraries (built by the windows job)
        uses: actions/download-artifact@v8
        with:
          name: windows-pack-input
          path: pack-windows

      - name: Download the Android libraries (built by the android job)
        uses: actions/download-artifact@v8
        with:
          name: android-pack-input
          path: pack-android

      - name: Download the Linux libraries (built by the linux job)
        uses: actions/download-artifact@v8
        with:
          name: linux-pack-input
          path: pack-linux

      - name: Download the macOS libraries (built by the macos job)
        uses: actions/download-artifact@v8
        with:
          name: macos-pack-input
          path: pack-macos

      # The NINE release wheels: three Pythons (cp310, cp311, cp312-abi3) on each of the three
      # desktops, all built by the wheels job. They are not the per-runner wheels the three desktop
      # jobs build - those are the fast gate, tagged for the runner's own glibc, architecture and
      # one interpreter, and they stay artifacts. The Windows one stopped being a release asset
      # when Windows joined the wheels job.
      - name: Download the release wheels (built by the wheels job)
        uses: actions/download-artifact@v8
        with:
          pattern: release-wheel-*
          merge-multiple: true
          path: wheelhouse

      - name: Pack Godot addon
        id: packgd
        shell: pwsh
        run: |
          # -SkipBuild plus FOUR -*From switches: this job compiles nothing, so every platform
          # arrives prebuilt, Windows included. The windows job builds both Windows flavours
          # against the engine SDK it tested, which is the engine the Windows half of the addon
          # ships; -EngineSdk is therefore not passed here, because nothing is configured.
          # pack.ps1 still refuses to ship a manifest whose libraries are missing, so a pack input
          # that lost a file fails here rather than at load time on somebody's machine.
          $a = @{ OutDir = 'dist/godot'; SkipBuild = $true
                  WindowsFrom = (Resolve-Path 'pack-windows/godot').Path
                  AndroidFrom = (Resolve-Path 'pack-android/godot').Path
                  LinuxFrom = (Resolve-Path 'pack-linux/godot').Path
                  MacFrom   = (Resolve-Path 'pack-macos/godot').Path }
          if ($env:GITHUB_REF -like 'refs/tags/v*') { $a.Version = $env:GITHUB_REF_NAME.TrimStart('v') }
          ./tools/godot/pack.ps1 @a

      # Corresponding source for the OTHER statically linked dependency. phonon used to ship as its
      # own DLL, which made the pinned-commit link enough; inside bw_audio.dll it is the same case as
      # the ASIO SDK, so it gets the same treatment - the source beside the binary, not a URL to
      # chase. Apache-2.0 does not demand this (section 4 wants the license and the notices, both of
      # which ship already); GPLv3 section 6 governs the combined work, and shipping is cheaper than
      # arguing about which half of the DLL a recipient is entitled to. Tags only: a cached run has
      # no submodule checkout, and paying for one on every push to buy nothing would be silly.
      - name: Stage Steam Audio corresponding source (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          # dist/ exists by now (the Godot pack above writes dist/godot), but this step creates the
          # archive INSIDE it, so say so rather than depend on step order.
          New-Item -ItemType Directory -Force dist | Out-Null
          $sha = (git rev-parse HEAD:third_party/steam-audio-source).Trim()
          if (-not (Test-Path third_party/steam-audio-source/.git)) {
            git submodule update --init --depth 1 third_party/steam-audio-source
            if (-not $?) { git submodule update --init third_party/steam-audio-source }
          }
          $zip = (Join-Path (Get-Location) 'dist/steam-audio-src.zip')
          if (Test-Path $zip) { Remove-Item $zip -Force }
          # The COMMIT, not the working tree: the build step applies our patch in place, and the
          # patch travels as itself (below) so a recipient can see exactly what we changed.
          git -C third_party/steam-audio-source archive --format=zip --prefix="steam-audio-$sha/" -o $zip HEAD
          if (-not $?) { throw "git archive of the steam-audio submodule failed" }
          $readme = @"
          Steam Audio corresponding source for bw_audio ${{ github.ref_name }}.

          Upstream:  https://github.com/ValveSoftware/steam-audio
          Commit:    $sha
          License:   Apache-2.0 (LICENSE.md in the tree above)

          bw_audio links this statically into bw_audio.dll. It is built with the recipe in
          third_party/README.md ("Steam Audio"), BUILD_SHARED_LIBS=OFF and --minimal, after
          applying the patches in patches/ below. The tree here is the unpatched upstream
          commit, so apply the patch to reproduce the build:

            git apply patches/phonon-multiplyaccumulate-align.patch

          The other files in patches/ are not patches to this tree. The phonon-android-* ones
          apply to it too but only for an Android build, and deps-flatbuffers-* applies to a
          dependency that core/build/get_dependencies.py downloads, not to anything here.
          "@
          New-Item -ItemType Directory -Force dist/sa-extra/patches | Out-Null
          $readme | Out-File -Encoding ascii dist/sa-extra/README.txt
          Copy-Item third_party/patches/*.patch dist/sa-extra/patches/
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $z = [IO.Compression.ZipFile]::Open($zip, 'Update')
          try {
            foreach ($f in Get-ChildItem dist/sa-extra -Recurse -File) {
              $rel = $f.FullName.Substring((Resolve-Path dist/sa-extra).Path.Length + 1).Replace([char]92, '/')
              [IO.Compression.ZipFileExtensions]::CreateEntryFromFile($z, $f.FullName, "steam-audio-$sha/$rel") | Out-Null
            }
          } finally { $z.Dispose() }
          Remove-Item dist/sa-extra -Recurse -Force
          "staged $zip ($([math]::Round((Get-Item $zip).Length / 1MB, 1)) MB)"

      # The Unity package. Packed on EVERY run (not just tags) so a broken package - a missing .meta,
      # a tarball that somehow lost its DLLs - fails the build rather than the release. On a tag the
      # version is stamped from that tag (TAG below); off a tag pack.ps1 derives a git-describe dev
      # version. The step exports whichever it used as `steps.pack.outputs.version`, which names the
      # artifacts below. It goes in its OWN folder (dist/unity), because engine consumers and Unity
      # consumers want different things and the release below ships them as separate assets.
      - name: Pack UPM package
        id: pack
        shell: pwsh
        env:
          TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: |
          # -PluginsFrom is the windows job's RelWithDebInfo engine, staged into the pack input.
          # It still has to be passed: Runtime/Plugins/x86_64 is a package folder a local build
          # POST_BUILD-stages into, so packing without it could ship whatever a previous run left
          # there. All four platforms now arrive the same way.
          # NB: splat a HASHTABLE, not an array. Array splatting binds POSITIONALLY, so '-PluginsFrom'
          # would land in $Version and the trailing value would have no parameter left to bind to.
          $a = @{ PluginsFrom = (Resolve-Path 'pack-windows/unity').Path; OutDir = 'dist/unity'
                  AndroidFrom = (Resolve-Path 'pack-android/unity').Path
                  LinuxFrom   = (Resolve-Path 'pack-linux/unity').Path
                  MacFrom     = (Resolve-Path 'pack-macos/unity').Path }
          if ($env:TAG) { $a.Version = $env:TAG }           # the tag is the version; pack stamps it into the manifest
          ./tools/upm/pack.ps1 @a

      # ---- the MATLAB and Octave toolbox ---------------------------------------------------------
      # ONE folder a MATLAB or Octave user unzips and adds to their path, carrying every platform's
      # MEX files. A MEX is per platform AND per interpreter (.mexw64/.mexa64/.mexmaca64 against
      # .mex) and the lab's users are on Windows, so shipping only the one CI could build most
      # cheaply would serve the wrong half. This job is where the three platforms meet: it built the
      # Windows set and downloaded the other two in the pack inputs above.
      #
      # bin/<arch>/ uses MATLAB's OWN architecture names, which is what `computer('arch')` answers
      # and what +bwa/arch_dir.m looks for. The build tree's layout (bin/<matlab|octave>/...) is a
      # different one, on purpose: a build stages two interpreters side by side and a release
      # ships one.
      #
      # Every platform's set arrives in its pack input, Windows included: this job builds nothing.
      #
      # BOTH interpreters' MEX files ride in each bin/<arch>/. Octave's extension is `.mex` on every
      # platform, but the layout is one directory PER ARCHITECTURE, so the three never meet: what
      # shares a directory is one .mexw64 and one .mex, whose names differ. +bwa/setup.m looks for
      # bwa_mex.<mexext> in bin/<arch_dir>(), and arch_dir maps Octave onto MATLAB's own names
      # (win64 / glnxa64 / maca64), so each interpreter finds its own file with no second rule.
      #
      # The ENGINE LIBRARY is staged ONCE per architecture: both MEX files in a directory load the
      # same bw_audio.dll / libbw_audio.so / libbw_audio.dylib, which is also the ABI check
      # bwa.setup runs. Two copies would be two ABIs to keep in step.
      - name: Assemble the MATLAB toolbox
        shell: pwsh
        run: |
          $tb = 'dist/matlab/bw_audio-matlab'
          New-Item -ItemType Directory -Force `
            "$tb/bin/win64", "$tb/bin/glnxa64", "$tb/bin/maca64" | Out-Null

          Copy-Item -Recurse bindings/matlab/+bwa      "$tb/"
          Copy-Item -Recurse bindings/matlab/examples  "$tb/"
          Copy-Item bindings/matlab/README.md          "$tb/"
          # GPLv3 travels with the binaries, the same rule every other pack here follows.
          Copy-Item LICENSE, THIRD_PARTY-NOTICES.md    "$tb/"

          # The engine library comes from the MATLAB staging directory in each case, and only once
          # per architecture: the Octave staging holds a byte-identical copy of the same build.
          Copy-Item pack-windows/matlab/bwa_mex.mexw64                 "$tb/bin/win64/"
          Copy-Item pack-windows/matlab/bwa_mex.mex                    "$tb/bin/win64/"
          Copy-Item pack-windows/matlab/bw_audio.dll                   "$tb/bin/win64/"
          Copy-Item pack-linux/matlab/bwa_mex.mexa64                   "$tb/bin/glnxa64/"
          Copy-Item pack-linux/matlab/bwa_mex.mex                      "$tb/bin/glnxa64/"
          Copy-Item pack-linux/matlab/libbw_audio.so                   "$tb/bin/glnxa64/"
          Copy-Item pack-macos/matlab/bwa_mex.mexmaca64                "$tb/bin/maca64/"
          Copy-Item pack-macos/matlab/bwa_mex.mex                      "$tb/bin/maca64/"
          Copy-Item pack-macos/matlab/libbw_audio.dylib                "$tb/bin/maca64/"

          # Assert all SIX BEFORE zipping. A toolbox missing one platform installs perfectly on the
          # other two and fails only on somebody else's machine, which is the shape of defect this
          # whole assembly exists to avoid - and the same is true one interpreter at a time.
          foreach ($p in @("$tb/bin/win64/bwa_mex.mexw64",   "$tb/bin/win64/bwa_mex.mex",
                           "$tb/bin/glnxa64/bwa_mex.mexa64", "$tb/bin/glnxa64/bwa_mex.mex",
                           "$tb/bin/maca64/bwa_mex.mexmaca64", "$tb/bin/maca64/bwa_mex.mex")) {
            if (-not (Test-Path $p) -or (Get-Item $p).Length -eq 0) { throw "missing or empty: $p" }
          }
          Get-ChildItem -Recurse $tb | Where-Object { -not $_.PSIsContainer } |
            Select-Object FullName, Length

      - name: Upload artifact (MATLAB toolbox, every platform)
        uses: actions/upload-artifact@v7
        with:
          name: bw_audio-matlab-${{ steps.pack.outputs.version }}-r${{ github.run_number }}
          path: dist/matlab/bw_audio-matlab/
          retention-days: 30
          if-no-files-found: error

      - name: Upload artifact (Godot addon)
        uses: actions/upload-artifact@v7
        with:
          name: godot-addon-${{ steps.packgd.outputs.version }}-r${{ github.run_number }}
          path: dist/godot/
          retention-days: 30
          if-no-files-found: error

      - name: Upload artifact (Unity package)
        uses: actions/upload-artifact@v7
        with:
          name: unity-package-${{ steps.pack.outputs.version }}-r${{ github.run_number }}
          path: dist/unity/
          retention-days: 30
          if-no-files-found: error

      # ---- release (tags only) -------------------------------------------------------------------
      # The Release IS the distribution - there is no registry. EIGHTEEN assets: seven audiences
      # want different bytes, nine of them are the Python wheels (three interpreters on each of the
      # three desktops), and the last two are the GPLv3 corresponding source that must accompany
      # all of it:
      #
      #   com.brainworks.bw_audio-<ver>.tgz   the Unity package (C# + every platform's engine library,
      #                                      import settings set).
      #                                      Installs via Package Manager > "+" > "from tarball".
      #   bw_audio-godot-<ver>.zip            the Godot addon (the GDExtension + the engine library for
      #                                      every platform, in both the editor and template_release
      #                                      flavours). Unzip into a project; a GDExtension loads on
      #                                      open, nothing to enable.
      #   bw_audio-win64-<tag>.zip            the engine itself: dll/lib/pdb + bw_audio.h + the tools.
      #                                      The durable home for the native side - workflow artifacts
      #                                      expire, a release does not.
      #   bw_audio-android-<tag>.zip          the Android engine: libbw_audio.so for arm64-v8a and
      #                                      x86_64 + bw_audio.h, staged whole by the android job.
      #   bw_audio-linux-x64-<tag>.zip        the Linux engine: libbw_audio.so + bw_audio.h, staged
      #                                      whole by the linux job. JACK and ALSA, no ASIO.
      #   bw_audio-macos-universal-<tag>.zip  the macOS engine: one universal libbw_audio.dylib
      #                                      (x86_64 + arm64) + bw_audio.h, staged whole by the
      #                                      macos job. UNSIGNED and un-notarized: a download needs
      #                                      its quarantine flag cleared, and shipping outside a lab
      #                                      would need a Developer ID signature.
      #   bw_audio-matlab-<tag>.zip           the MATLAB and Octave toolbox: the +bwa package, the
      #                                      examples, and bin/{win64,glnxa64,maca64} each holding
      #                                      that platform's TWO MEX files (MATLAB's and Octave's)
      #                                      plus the one engine library both load. Unzip and
      #                                      addpath; there is nothing to build.
      #   bw_audio-asio-sdk-src-<tag>.zip     the ASIO SDK source statically linked into bw_audio.dll,
      #                                      redistributed under its GPLv3 option. Corresponding source
      #                                      for the one GPL-covered component the repo does not itself
      #                                      carry (it is gitignored, fetched from Steinberg at build).
      #   bw_audio-steam-audio-src-<tag>.zip  the Steam Audio source statically linked into the same
      #                                      DLL (Apache-2.0), at its pinned commit, plus our patch.
      #                                      Same parity argument as the ASIO zip: the source sits
      #                                      beside the binary rather than behind a link.
      #   bw_audio-<abi>-cp3??-*.whl          the Python binding, NINE of them, all from the wheels
      #                                      job: cp310, cp311 and cp312-abi3 for each of win_amd64,
      #                                      manylinux_2_28_x86_64 and macosx universal2. The engine
      #                                      library is inside each one. The cp312 wheel is the abi3
      #                                      one and serves 3.12 and every later Python; 3.10 and
      #                                      3.11 predate that limited API and get their own file.
      #
      # Keep the engine bundle a .zip, and the package the only .tgz on the release. Every UPM registry
      # speaks the npm protocol and keys on a single publishable tarball, so should this ever be listed
      # on one, that stays a config change rather than a rebuild. It costs nothing to preserve.
      - name: Release (four engine zips + Godot addon + Unity package tarball + MATLAB toolbox + nine Python wheels + the two source zips)
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $tgz = (Get-Item dist/unity/*.tgz).FullName
          # The Godot addon: unzip addons/bw_audio/ into a project and it loads on open. A zip
          # rather than anything registry-shaped, because Godot's Asset Library wants a public
          # repo laid out as an installable project, which this is not.
          $gd  = (Get-Item dist/godot/*.zip).FullName

          # The engine bundle: what the windows job staged in its dist/ and handed over. GPLv3
          # travels with it - LICENSE, THIRD_PARTY-NOTICES.md and DIST.txt (which names the commit
          # and links the complete source) are already in there. Named explicitly rather than
          # globbed, so the ASIO source zip beside them stays its own asset.
          $zip = "dist/bw_audio-win64-$tag.zip"
          Compress-Archive -Path pack-windows/dist/RelWithDebInfo, pack-windows/dist/Debug,
                                 pack-windows/dist/bw_audio.h, pack-windows/dist/LICENSE,
                                 pack-windows/dist/THIRD_PARTY-NOTICES.md, pack-windows/dist/DIST.txt `
                           -DestinationPath $zip -Force
          $zip = (Get-Item $zip).FullName

          # GPLv3 corresponding source for the ASIO SDK (staged by the windows job, which is the one
          # that fetches the SDK). It ships as its OWN release asset - deliberately NOT inside the
          # engine .zip or the Unity .tgz - so it sits in the same place as the binaries without
          # bloating them (GPLv3 section 6d).
          $src = "dist/bw_audio-asio-sdk-src-$tag.zip"
          Copy-Item pack-windows/dist/asio-sdk-src.zip $src -Force
          $src = (Get-Item $src).FullName

          # And the same for Steam Audio, which a static link put inside the same DLL. Staged by the
          # "Stage Steam Audio corresponding source" step above (tags only).
          $sasrc = "dist/bw_audio-steam-audio-src-$tag.zip"
          Copy-Item dist/steam-audio-src.zip $sasrc -Force
          $sasrc = (Get-Item $sasrc).FullName

          # The Android bundle. The android job staged the whole tree (both ABIs, the header, the
          # licenses, its own DIST.txt) and this job only zips it - which is now the rule for every
          # platform, Windows included, so ONE step creates the release and there is never a second
          # one to reconcile.
          $and = "dist/bw_audio-android-$tag.zip"
          Compress-Archive -Path pack-android/dist/* -DestinationPath $and -Force
          $and = (Get-Item $and).FullName

          # The Linux and macOS bundles, by exactly the same rule: their own jobs staged the whole
          # tree and this one only zips it.
          $lnx = "dist/bw_audio-linux-x64-$tag.zip"
          Compress-Archive -Path pack-linux/dist/* -DestinationPath $lnx -Force
          $lnx = (Get-Item $lnx).FullName
          $mac = "dist/bw_audio-macos-universal-$tag.zip"
          Compress-Archive -Path pack-macos/dist/* -DestinationPath $mac -Force
          $mac = (Get-Item $mac).FullName

          # The MATLAB and Octave toolbox: ONE folder carrying every platform's two MEX files plus
          # that platform's engine library, assembled above from the three pack inputs. A zip rather than a MATLAB Toolbox (.mltbx) because an .mltbx is a
          # MATLAB-only installer and this folder has to work in Octave too, where the install is
          # addpath and nothing else.
          $mtb = "dist/bw_audio-matlab-$tag.zip"
          Compress-Archive -Path dist/matlab/bw_audio-matlab -DestinationPath $mtb -Force
          $mtb = (Get-Item $mtb).FullName

          # The NINE Python wheels, attached as-is rather than zipped: pip and uv install a .whl
          # directly from a URL, and wrapping it would make the one-liner in the notes a two-step.
          # Each is already versioned by its own filename (BWA_VERSION from the header, which the
          # check at the top of the windows job pins to this tag), so unlike the engine bundles
          # above there is nothing to rename per tag.
          #
          # All nine come from the wheels job, Windows included since it joined that matrix. The
          # per-runner wheels the three desktop jobs build are the fast gate - tagged for their
          # runner's glibc, architecture and the one interpreter the step pins - and stay
          # artifacts. Assert exactly three per platform AND the ABI tag each one has to carry,
          # because a wheel that quietly fell back to a runner tag, or an interpreter that quietly
          # dropped out of the matrix, is a wheel that fails on the machine it was built for the
          # most: somebody else's. cp312-abi3 covers 3.12 and later; cp310 and cp311 each cover
          # only themselves, which is why they are named one by one here.
          $whlSets = [ordered]@{
            'win_amd64'  = @(Get-Item wheelhouse/*-win_amd64.whl)
            'manylinux'  = @(Get-Item wheelhouse/*-manylinux*_x86_64.whl)
            'universal2' = @(Get-Item wheelhouse/*-macosx_*_universal2.whl)
          }
          $whl = @()
          foreach ($plat in $whlSets.Keys) {
            $set = $whlSets[$plat]
            if ($set.Count -ne 3) { throw "expected 3 $plat wheels, found $($set.Count)" }
            foreach ($abi in 'cp310-cp310', 'cp311-cp311', 'cp312-abi3') {
              $hit = @($set | Where-Object { $_.Name -like "*-$abi-*" })
              if ($hit.Count -ne 1) { throw "expected exactly 1 $abi $plat wheel, found $($hit.Count)" }
              $whl += $hit[0].FullName
            }
          }
          $whl | ForEach-Object { Write-Host "release wheel: $(Split-Path $_ -Leaf)" }

          $notes = @"
          Windows x64, plus Android, Linux and macOS cross-builds. Seven downloads to use - the
          **Unity package**, the **Godot addon**, the **MATLAB and Octave toolbox**, or the engine
          itself for **Windows**, **Android**, **Linux** or **macOS** - plus the **ASIO SDK source**
          and the **Steam Audio source** (corresponding source; see License below).

          ## Unity

          Download ``com.brainworks.bw_audio-*.tgz`` below, then in Unity:
          **Package Manager > ``+`` > *Install package from tarball...*** That is the whole install.
          (Or install from a git URL: ``https://github.com/aforren1/cave-audio.git#unity``.)

          The package ships the native engine for every platform it supports - ``bw_audio.dll``
          (Windows), ``libbw_audio.so`` (Linux, Android) and ``libbw_audio.dylib`` (macOS, universal),
          one file each: Steam Audio is linked into it - with their import settings already set,
          nothing to build. Requires **Unity 6**. Turn OFF Unity's built-in audio
          (*Project Settings > Audio > Disable Unity Audio*): the engine owns the device.

          ## Godot

          Download ``bw_audio-godot-*.zip`` below and unzip it into your project so you end up with
          ``addons/bw_audio/``, then restart the editor. A GDExtension loads on project open - there is
          no plugin to enable. Requires **Godot 4.4+** (built against 4.7). The addon carries the
          editor and export libraries for **Windows x64**, **Linux x86_64** and **macOS universal**,
          plus the **Android arm64-v8a** export library.

          ## Engine (C ABI, tools)

          ``bw_audio-win64-$tag.zip`` - ``bw_audio.dll`` / ``.lib`` / ``.pdb`` (Steam Audio is **linked
          statically**, so there is nothing to keep beside it), ``bw_audio.h``, and the tools:
          ``bwa_playground``, ``bwa_layout_tool``, ``bwa_calib_view``, ``bwa_calibrate``, ``bwa_zylia_probe``.
          Needs the MSVC x64 runtime. See ``DIST.txt`` inside for the exact commit.

          ## Android

          ``bw_audio-android-$tag.zip`` - ``libbw_audio.so`` for **arm64-v8a** (a standalone headset)
          and **x86_64** (an emulator), plus ``bw_audio.h``. Built against **android-26**, output
          through **AAudio**; there is no array transport on Android, so this is the headphone path.
          Steam Audio is **linked statically inside it**, so the binaural path is the real HRTF
          decode and there is no second library to ship beside it.
          The Unity package and the Godot addon above carry the arm64-v8a library already, so install
          one of those unless you are linking the C ABI yourself.

          ## Linux and macOS

          ``bw_audio-linux-x64-$tag.zip`` - ``libbw_audio.so`` plus ``bw_audio.h``. Output goes
          through **JACK** (a PipeWire desktop answers the same ABI) or **ALSA**; the 26-channel
          array is reached over AES67 into the Dante network.

          ``bw_audio-macos-universal-$tag.zip`` - one universal ``libbw_audio.dylib`` (x86_64 and
          arm64) plus ``bw_audio.h``. macOS has **no device backend yet**, so this is the offline
          path: rendering through the manual sink and the test suite. It is **not signed or
          notarized**, so clear the quarantine flag after unzipping:
          ``xattr -dr com.apple.quarantine <folder>``.

          Both link Steam Audio statically, like every other build here. The Unity package and the
          Godot addon carry both libraries already.

          ## MATLAB and Octave

          ``bw_audio-matlab-$tag.zip`` - unzip it anywhere, then in MATLAB or Octave:

          ``addpath('<where-you-unzipped>/bw_audio-matlab')``

          That is the whole install. The folder carries ``+bwa`` (the class layer), the examples,
          and ``bin/win64``, ``bin/glnxa64`` and ``bin/maca64``, each holding that platform's **two**
          MEX files - MATLAB's (``.mexw64`` / ``.mexa64`` / ``.mexmaca64``) and Octave's (``.mex``) -
          plus the one engine library both of them load. ``bwa.setup`` picks the right one for the
          interpreter you are in. Steam Audio is linked into each library, so there is nothing to
          keep beside it. For Psychtoolbox: see ``bindings/matlab/README.md`` for the timing recipe
          and the note on not fighting PsychPortAudio for the same device.

          The macOS MEX files are **arm64** and, like every other macOS binary here, **unsigned**:
          clear the quarantine flag after unzipping, ``xattr -dr com.apple.quarantine <folder>``.

          ## Python

          ``bw_audio-*.whl`` - **nine wheels**: three Pythons on each of three platforms (Windows
          x64, Linux x86_64 **manylinux**, macOS **universal2**). Together they cover **Python
          3.10 and later**. The engine library is inside each wheel; there is nothing to install
          beside it.

          | Tag | Runs on |
          | --- | --- |
          | ``cp310-cp310-<platform>`` | Python 3.10 |
          | ``cp311-cp311-<platform>`` | Python 3.11 |
          | ``cp312-abi3-<platform>`` | Python **3.12 and every later version** |

          The ``cp312`` wheel is built on the **stable ABI**, so one file serves 3.12, 3.13, 3.14
          and whatever comes next. 3.10 and 3.11 predate that limited API and each needs its own
          file. Pick the one matching your interpreter:

          ``uv pip install <url-of-the-wheel>``

          The wheel version is this tag's number, read from ``bw_audio.h`` at build time, so
          ``bw_audio.abi_version()`` inside it answers the same number. PsychoPy uses this package
          directly; see
          ``bindings/python/README.md``. The Linux wheel is ``manylinux_2_28`` (glibc 2.28 or
          newer: RHEL 8, Debian 10, Ubuntu 18.10 and later). It imports with neither
          ``libasound.so.2`` nor ``libjack.so.0`` installed: the engine loads each at run time, so
          the JACK and ALSA backends are available when their libraries are. The macOS wheel is
          one ``universal2`` file for both Apple architectures.

          ## License

          **GPLv3.** ``bw_audio.dll`` links the ASIO SDK under its GPLv3 option. Internal use never
          triggers copyleft - it is a *distribution* condition - but SHIPPING an app that includes this
          DLL to third parties would put that app under GPLv3. See ``docs/build.md`` for the
          proprietary-ASIO alternative.

          Complete corresponding source is this repo at the commit named in ``DIST.txt``, plus
          ``bw_audio-asio-sdk-src-$tag.zip`` and ``bw_audio-steam-audio-src-$tag.zip`` below (the two
          third-party sources compiled into the DLL).
          "@
          # One .tgz (the Unity package) + the Godot addon .zip + the four engine .zips (Windows,
          # Android, Linux, macOS) + the MATLAB toolbox .zip + the two corresponding-source .zips
          # + the nine Python wheels. Keep the .tgz as the only package tarball - see the note above.
          gh release create $tag $tgz $gd $zip $and $lnx $mac $mtb $src $sasrc @whl --title "bw_audio $tag" --notes $notes

      # ---- distribution branches (tags only) ------------------------------------------------------
      # The gh-pages idea applied to the bindings. `main` stays source-only; each binding also gets a
      # branch whose ROOT is the installable thing, because both standard installers install from a
      # git ref and expect their manifest at the top level:
      #
      #   unity  ->  package.json at the root, so UPM takes a git URL directly:
      #                Package Manager > "+" > "Add package from git URL..."
      #                https://github.com/aforren1/cave-audio.git#unity
      #   godot  ->  addons/bw_audio/ at the root, for the Asset Library — which downloads a repo
      #              ARCHIVE at a specific commit, so the binaries must be IN the tree. A release
      #              asset cannot serve that entry, which is why this branch exists at all.
      #
      # Normal commits, never a force-push: an Asset Library entry pins a commit hash, and rewriting
      # history would eventually orphan a published one. The branches therefore grow by roughly the
      # addon's size per release, which is the standing cost of in-repo distribution.
      - name: Publish distribution branches
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GIT_TERMINAL_PROMPT: '0'
        run: |
          $v = $env:GITHUB_REF_NAME.TrimStart('v')
          # The remote URL must carry the token explicitly. actions/checkout puts the workflow
          # credential in this clone's http.extraheader, NOT in the URL, so `git remote get-url`
          # (the script's default) yields an unauthenticated URL and the push would fail. The
          # script never echoes it, and Actions masks the token in logs regardless.
          $remote = "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          ./tools/dist/publish-branch.ps1 -Branch unity -Source build/upm/package -Version $v -RemoteUrl $remote
          ./tools/dist/publish-branch.ps1 -Branch godot -Source build/godot/addon -Version $v -RemoteUrl $remote

      # ---- prune the handoff artifacts ------------------------------------------------------------
      # The four `*-pack-input` and three `*-engine-sdk` artifacts exist only to move files between
      # jobs of THIS run. Their retention is already one day, but for that day they sit on the run
      # page beside the real downloads, seven distractions next to the dozen a person might want.
      # So delete them once everything that reads them has succeeded. On SUCCESS only: a failed
      # package job is re-run with "re-run failed jobs", which reads these same artifacts, and
      # deleting them would turn one failure into two. `release-wheel-*` stays: on a branch push it
      # is the only place the manylinux and universal2 wheels exist at all.
      - name: Prune the handoff artifacts
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
            --jq '.artifacts[] | select(.name | test("-(pack-input|engine-sdk)$")) | "\(.id) \(.name)"' \
          | while read -r id name; do
              echo "deleting $name ($id)"
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id"
            done

  # ---- portability gate, and two more shipping jobs (docs/backends.md phases 2 and 5) ----------
  # These two jobs exist to catch a Win32 call sneaking back into the core, not to test audio: no
  # runner has an audio device, so both build the library, the console examples and the whole test
  # suite and run them on the null and manual sinks.
  #
  # They SHIP as well, since 2026-09-15: each builds its own Godot GDExtension in both flavours,
  # uploads a standalone engine artifact, and hands the package job a fixed-name pack input, exactly
  # as the android job does. That is what lets one addon and one Unity package carry every platform.
  #
  # The linux job DOES compile the two Linux backends (apt installs their dev packages) and asserts
  # both configured, because a runner that quietly lost a header would otherwise turn the whole
  # backend into dead code that nothing builds. Their sink-test sections then skip visibly on the
  # runner: no JACK server is running and there is no sound card.
  #
  # Both jobs now BUILD PHONON, each into its own lib/<platform> and under its own cache key, so
  # both run the with-SDK suite (38 tests) rather than the no-SDK one (33) and both assert
  # "Steam Audio ENABLED". A cold run pays for the phonon build the way the windows job does; a
  # warm one restores the archives and costs a few minutes. No ASIO: it is Windows-only by
  # definition, and nothing here fetches it.
  #
  # The macOS job is UNVERIFIED locally in BOTH halves: the shim's Apple paths (mach_absolute_time,
  # mach_wait_until, the SCHED_OTHER priority drop) were written from the documentation, and its
  # phonon build was written from the pinned scripts. Nobody here has a Mac. This job is the first
  # thing that will execute either.
  #
  # ANDROID IS CROSS-BUILT, in the job below, and deliberately WITHOUT an emulator. An emulator job is
  # possible here: ubuntu-latest runners expose /dev/kvm, so reactivecircus/android-emulator-runner can
  # boot an x86_64 system image and tools/android/run-tests.ps1 would push the suite onto it. What it
  # costs is several minutes of image download plus boot on every run, and what it buys is thin - phase
  # 3 verified the AAudio sink on a local emulator, and the numbers that matter (burst size, the MMAP
  # path, a real route-change disconnect, the CPU budget) need a headset, which no runner has. The
  # cross-BUILD is the part worth gating, and it is the cheap part.
  # ---- Android cross-build (docs/backends.md phase 3 + the bindings' Android packaging) ---------
  # Builds the library for both ABIs, proves the AAudio backend is in it, and produces the two things
  # no other job can: the arm64-v8a engine library that both bindings package, and the Godot
  # GDExtension for arm64-v8a (template_release, the flavour an exported game loads).
  #
  # Nothing RUNS here. The test executables are built, so a compile break in the suite still fails
  # this job, but running them needs a device - that is what tools/android/run-tests.ps1 is for.
  #
  # Steam Audio: BUILT STATICALLY here too, once per ABI, through the same composite action the
  # other three jobs call. An Android APK therefore carries the real HRTF decode, occlusion,
  # pathing and the reflection bed inside libbw_audio.so, with nothing beside it.
  #
  # UNVERIFIED ON A LINUX HOST. The Android phonon build was verified on a Windows host, where the
  # NDK host tag the pinned scripts hard-code happens to be the right one. This job is the first
  # thing that runs it from linux-x86_64, which is what third_party/patches/phonon-android-*.patch
  # exists for. Its loud failure mode is the configure assertion below: a patch that did not do its
  # job leaves no lib/android-<abi> staged, the configure falls back to a no-SDK build, and the
  # grep for "Steam Audio ENABLED" fails the job rather than shipping a quietly degraded library.
  android:
    runs-on: ubuntu-latest
    # Two phonon builds on a cold cache are the long pole, as they are in the windows job; a warm
    # cache restores both in seconds.
    timeout-minutes: 90
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v7      # no submodules: nothing here builds an SDK

      - name: Version
        id: ver
        shell: bash
        run: |
          # The same rule tools/upm/pack.ps1 uses, so the Android artifact's name matches the others
          # on a given run: the tag when there is one, else git describe, else the placeholder. A
          # default (shallow) checkout has no tags, so a branch build lands on 0.0.0-dev here exactly
          # as it does in the Windows job.
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            v="${GITHUB_REF_NAME#v}"
          else
            v="0.0.0-dev"
            if d=$(git describe --tags --long --dirty --match 'v*' 2>/dev/null); then
              if [[ "$d" =~ ^v?(.+)-([0-9]+)-g([0-9a-f]+)(-dirty)?$ ]]; then
                if [ "${BASH_REMATCH[2]}" = 0 ]; then v="${BASH_REMATCH[1]}"
                else v="${BASH_REMATCH[1]}-dev.${BASH_REMATCH[2]}.g${BASH_REMATCH[3]}"; fi
              fi
            fi
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "android version: $v"

      - name: NDK and generator
        shell: bash
        run: |
          # The runner image documents four names. ANDROID_NDK_ROOT (and its twin ANDROID_NDK_HOME)
          # is the image's DEFAULT NDK, r27 today; ANDROID_NDK_LATEST_HOME is the newest installed,
          # which moves whenever the image adds one. Prefer the pinned default so a new image cannot
          # change the compiler under this job silently, fall back to the latest, and fail loudly
          # rather than let CMake configure a HOST build that would pass every check below.
          NDK="${ANDROID_NDK_ROOT:-${ANDROID_NDK_HOME:-$ANDROID_NDK_LATEST_HOME}}"
          test -n "$NDK" && test -f "$NDK/build/cmake/android.toolchain.cmake" || {
            echo "no usable NDK: ANDROID_NDK_ROOT='$ANDROID_NDK_ROOT' ANDROID_NDK_LATEST_HOME='$ANDROID_NDK_LATEST_HOME'"
            exit 1; }
          echo "NDK=$NDK" >> "$GITHUB_ENV"
          # The pinned Steam Audio scripts read the NDK from ANDROID_NDK and nowhere else, so the
          # phonon steps below get it from the job environment rather than from an input.
          echo "ANDROID_NDK=$NDK" >> "$GITHUB_ENV"
          "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" --version | head -1
          sudo apt-get update && sudo apt-get install -y ninja-build   # the NDK ships no generator

      - name: Phonon cache key (submodule sha, no checkout needed)
        id: phonon-key
        shell: bash
        run: echo "sha=$(git rev-parse HEAD:third_party/steam-audio-source)" >> "$GITHUB_OUTPUT"

      # Two ABIs, two cache entries. Both stage into ONE artifacts tree - include/ is shared and the
      # archives land in lib/android-arm64 and lib/android-x64 - so each entry carries the shared
      # header plus its own lib dir, and the two restores merge into the tree CMake then detects.
      # The key names the platform AND the ABI: a cache is scoped to the repository rather than to
      # the runner OS, so jobs staging different lib/<platform> sets under one key would restore
      # each other's archives.
      - name: Cache phonon (arm64-v8a)
        id: phonon-arm64
        uses: actions/cache@v6
        with:
          path: |
            third_party/steam-audio-artifacts/include
            third_party/steam-audio-artifacts/lib/android-arm64
          key: phonon-android-arm64-v1-${{ steps.phonon-key.outputs.sha }}-${{ hashFiles('third_party/patches/**') }}

      - name: Build phonon (arm64-v8a; cache miss only; recipe = third_party/README.md)
        if: steps.phonon-arm64.outputs.cache-hit != 'true'
        uses: ./.github/actions/build-phonon
        with:
          platform: android
          arch: arm64          # build.py's spelling; the deps tree calls the same target armv8
          stage-dir: android-arm64

      - name: Cache phonon (x86_64)
        id: phonon-x64
        uses: actions/cache@v6
        with:
          path: |
            third_party/steam-audio-artifacts/include
            third_party/steam-audio-artifacts/lib/android-x64
          key: phonon-android-x64-v1-${{ steps.phonon-key.outputs.sha }}-${{ hashFiles('third_party/patches/**') }}

      - name: Build phonon (x86_64; cache miss only; recipe = third_party/README.md)
        if: steps.phonon-x64.outputs.cache-hit != 'true'
        uses: ./.github/actions/build-phonon
        with:
          platform: android
          arch: x64
          stage-dir: android-x64

      - name: Build both ABIs (android-26)
        shell: bash
        run: |
          for abi in arm64-v8a x86_64; do
            # ANDROID_STL is pinned, not left to default: a static phonon is C++, and c++_static
            # puts libc++ INSIDE libbw_audio.so so nothing ships beside it. Safe because the ABI
            # is C, so no C++ object crosses the library boundary. The NDK's CMake toolchain
            # already defaults this way; Gradle's does not, so say it.
            cmake -S . -B build-android-$abi -G Ninja \
                  -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
                  -DANDROID_ABI=$abi -DANDROID_PLATFORM=android-26 -DANDROID_STL=c++_static \
                  -DCMAKE_BUILD_TYPE=RelWithDebInfo -DBWA_BUILD_TESTS=ON | tee configure-$abi.log
            # The artifact must contain the device path this platform HAS. A configure that quietly
            # fell back to the null sink would ship a library that never opens a stream and say
            # nothing about it - the same reason the Windows job greps for ASIO.
            grep -q "AAudio backend ENABLED" configure-$abi.log
            # And the HRTF decode. This is also the one loud signal that this ABI's phonon archives
            # really got staged, whether they were built here or restored from the cache.
            grep -q "Steam Audio ENABLED" configure-$abi.log
            cmake --build build-android-$abi
            test -f build-android-$abi/libbw_audio.so
          done

      - name: Cache godot-cpp build (android)
        uses: actions/cache@v6
        with:
          # Same reasoning as the Windows godot-cpp cache: ~2100 generated binding files dwarf our
          # nine sources. One flavour only here, because a headset runs no editor.
          path: build-android-godot
          key: godot-cpp-android-${{ env.GODOT_CPP_COMMIT }}-arm64

      - name: Build the Godot GDExtension (arm64-v8a, template_release)
        shell: bash
        run: |
          cmake -S . -B build-android-godot -G Ninja \
                -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
                -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-26 -DANDROID_STL=c++_static \
                -DCMAKE_BUILD_TYPE=RelWithDebInfo \
                -DBWA_BUILD_GODOT=ON -DGODOTCPP_TARGET=template_release
          cmake --build build-android-godot --target bwa_gdextension
          # The manifest names this exact file (bindings/godot/addons/bw_audio/bw_audio.gdextension),
          # and the "lib" prefix is not cosmetic: an APK extracts only lib*.so from its lib/<abi>/.
          test -f bindings/godot/addons/bw_audio/bin/libbw_audio_gd.android.template_release.arm64.so

      - name: Stage dist
        shell: bash
        run: |
          mkdir -p dist-android/lib/arm64-v8a dist-android/lib/x86_64 dist-android/include
          cp build-android-arm64-v8a/libbw_audio.so dist-android/lib/arm64-v8a/
          cp build-android-x86_64/libbw_audio.so    dist-android/lib/x86_64/
          # Same symbol split as the linux job (see there), with the NDK's llvm-objcopy: the
          # artifact's .so is the 7 MB of code, its DWARF sits beside it as .so.debug.
          OBJCOPY="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-objcopy"
          for abi in arm64-v8a x86_64; do
            (cd "dist-android/lib/$abi"               && "$OBJCOPY" --only-keep-debug libbw_audio.so libbw_audio.so.debug               && "$OBJCOPY" --strip-debug --add-gnu-debuglink=libbw_audio.so.debug libbw_audio.so               && ls -l libbw_audio.so libbw_audio.so.debug)
          done
          cp include/bw_audio.h                     dist-android/include/
          cp LICENSE THIRD_PARTY-NOTICES.md         dist-android/
          cat > dist-android/DIST.txt <<EOF
          bw_audio android - limited distribution build
          commit   ${{ github.sha }} (${{ github.ref_name }})
          built    $(date -u +%Y-%m-%dT%H:%M:%S)Z  (GitHub Actions run ${{ github.run_id }})
          abis     lib/arm64-v8a - a standalone headset (Quest, Pico)
                   lib/x86_64    - the emulator (tools/android/run-tests.ps1 pushes onto one)
                   both built against android-26, which is AAudio's own floor
          backends AAudio=yes  SteamAudio=yes (STATIC). phonon is built from the pinned submodule
                   for both ABIs and linked INSIDE libbw_audio.so, so the binaural path is the
                   real HRTF decode and automatic occlusion, pathing and the reflection bed are
                   all present. There is no second file to ship or to keep beside it.
                   ISM early reflections, the FDN late tail and manual occlusion work as before.
          no array there is no 26-channel transport on Android; this is the headphone path.
                   A headset's pose reaches the engine through bwa_set_listener_pose.
          contents lib/<abi>/libbw_audio.so (stripped) + lib/<abi>/libbw_audio.so.debug (its
                   DWARF, linked by gnu_debuglink: keep the two together to symbolize a crash,
                   ship only the .so) + include/bw_audio.h. A Unity or Godot consumer wants the
                   package or the addon instead - both already carry the arm64-v8a library with
                   its import settings set.
          license  GPLv3 (LICENSE) + THIRD_PARTY-NOTICES.md. No ASIO SDK here (it is a Windows
                   driver model), so the complete corresponding source is this repo at
                   https://github.com/aforren1/cave-audio/tree/${{ github.sha }}
          EOF
          cat dist-android/DIST.txt

          # What the package job packs into the two bindings. A FIXED artifact name, because a
          # versioned one would have to be threaded through the download step; the versioned
          # artifact below is the one a human downloads.
          #
          # The packaged copies are STRIPPED of debug info, the standalone artifact's are not. That
          # is the same split Windows already has: the addon and the tarball ship bw_audio.dll while
          # its DWARF-equivalent sits in a .pdb they do not carry, and an APK pays for every byte it
          # holds. The engine measures 20.7 MB down to 7.0 with static phonon in it (it was 2.5 down
          # to 0.4 without), and the extension strips by about the same ratio, per release, on a
          # branch that keeps every release.
          mkdir -p pack-android/godot pack-android/unity
          cp -r dist-android pack-android/dist
          cp bindings/godot/addons/bw_audio/bin/libbw_audio_gd.android.template_release.arm64.so \
             bindings/godot/addons/bw_audio/bin/libbw_audio.so pack-android/godot/
          cp build-android-arm64-v8a/libbw_audio.so pack-android/unity/
          "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip" --strip-debug \
             pack-android/godot/*.so pack-android/unity/*.so
          ls -l pack-android/godot pack-android/unity

      - name: Upload artifact (Android engine)
        uses: actions/upload-artifact@v7
        with:
          name: bw_audio-android-${{ steps.ver.outputs.version }}-r${{ github.run_number }}
          path: dist-android/
          retention-days: 30
          if-no-files-found: error

      - name: Upload artifact (packing input for the package job)
        uses: actions/upload-artifact@v7
        with:
          name: android-pack-input
          path: pack-android/
          retention-days: 1      # an intra-run handoff, not a download
          if-no-files-found: error

  # THE ENGINE IS BUILT IN A CONTAINER HERE, and only the engine. A manylinux_2_28 wheel needs a
  # glibc-2.28 engine and this runner image carries 2.39, so before this job built one engine for
  # ctest, the MEX pair and the Godot addon and the `wheels` job built a SECOND for the release
  # wheel - and the file a stranger pip-installed was the one nothing had tested. Now
  # tools/ci/build-engine-manylinux.sh builds, ctests and installs ONE engine SDK inside the image,
  # and everything after it (both MEX gateways, both Godot flavours, both wheels) links that SDK on
  # the runner. Bindings are ABI clients, so a runner-compiled client of a 2.28 shared object is
  # fine; the reverse - installing MATLAB or the Godot toolchain in AlmaLinux 8 - is not, which is
  # why only the engine step is containerized and the job is not.
  linux:
    runs-on: ubuntu-latest
    # On a cold cache this pays for phonon AND two godot-cpp trees (~2100 generated files each);
    # a warm one restores both and runs in a fraction of it.
    timeout-minutes: 120
    env:
      # The engine image, and it MUST be the same pin the wheels job names, because the two share
      # one phonon cache entry and the stamp the before-all writes carries the image tag. A digest
      # rather than a tag for the same reason a submodule is a sha.
      BWA_MANYLINUX_IMAGE: quay.io/pypa/manylinux_2_28_x86_64@sha256:53390351aeb4688114b02c36a23b3e6ce1166ee9b7afc5df1a4f776354fc764c
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        # still no submodules by default: the container's phonon script fetches steam-audio-source
        # itself, and only on a phonon cache miss

      - name: Install Octave
        # octave + octave-dev is the Octave half of the MATLAB and Octave binding's toolchain:
        # mkoctfile builds the MEX, octave-cli runs its ctests. No runner image carries Octave,
        # so each desktop job installs its own - choco on Windows, brew on macOS, apt here, which
        # is by far the cheapest of the three. (The package is octave-dev since Ubuntu 22.04; the
        # older liboctave-dev name does not resolve on a current runner.)
        #
        # The two BACKENDS' dev packages used to be installed here too. They are not any more: the
        # engine is compiled inside the manylinux container, and that container installs its own
        # (tools/phonon/cibw-before-all-linux.sh, which asserts pkg-config finds both). Nothing on
        # the runner compiles a line of the engine now.
        run: |
          sudo apt-get update
          sudo apt-get install -y octave octave-dev

      - name: Version
        id: ver
        shell: bash
        run: |
          # The same rule the android job and tools/upm/pack.ps1 use, so every artifact of one run
          # carries the same version. A default (shallow) checkout has no tags, so a branch build
          # lands on 0.0.0-dev here exactly as it does everywhere else.
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            v="${GITHUB_REF_NAME#v}"
          else
            v="0.0.0-dev"
            if d=$(git describe --tags --long --dirty --match 'v*' 2>/dev/null); then
              if [[ "$d" =~ ^v?(.+)-([0-9]+)-g([0-9a-f]+)(-dirty)?$ ]]; then
                if [ "${BASH_REMATCH[2]}" = 0 ]; then v="${BASH_REMATCH[1]}"
                else v="${BASH_REMATCH[1]}-dev.${BASH_REMATCH[2]}.g${BASH_REMATCH[3]}"; fi
              fi
            fi
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "linux version: $v"

      # A predictable interpreter for the few reporting lines below (the wheel step's glibc
      # print). The phonon and engine builds no longer need one here - both run in the container,
      # which puts its own `python` on PATH.
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Phonon cache key (submodule sha, no checkout needed)
        id: phonon-key
        shell: bash
        run: echo "sha=$(git rev-parse HEAD:third_party/steam-audio-source)" >> "$GITHUB_OUTPUT"

      - name: Cache phonon (manylinux container build)
        id: phonon
        uses: actions/cache@v6
        with:
          path: third_party/steam-audio-artifacts
          # BYTE-IDENTICAL to the wheels job's linux entry, on purpose: both build phonon with the
          # same script in the same image, so whichever job runs first pays for it and the other
          # restores it. The IMAGE is part of the key because archives built by one image must
          # never be restored into another, and so are the scripts, because they are the recipe.
          key: phonon-manylinux-v1-${{ env.BWA_MANYLINUX_IMAGE }}-${{ steps.phonon-key.outputs.sha }}-${{ hashFiles('third_party/patches/**', 'tools/phonon/**') }}

      # Configure, build, ctest and install the engine SDK, all inside the image. The script says
      # why; the short version is that this is the ONE Linux engine, and the wheels job takes it
      # from here rather than building a second. A cache hit skips the phonon build inside it.
      - name: Build and test the engine (manylinux container)
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/project" -w /project \
            "$BWA_MANYLINUX_IMAGE" bash tools/ci/build-engine-manylinux.sh

      - name: Check the library
        # On the runner, against the file the container wrote. readelf and nm read it happily;
        # nothing here writes into that tree.
        run: |
          # ctest links bwa_core's OBJECTS, never this file, so nothing else would notice its
          # absence: a LINKER_LANGUAGE CXX with no CXX language enabled made CMake emit an EMPTY
          # link rule, which prints "Linking CXX shared library", exits 0, and writes nothing
          # (docs/backends.md).
          test -s build/libbw_audio.so
          # phonon is STATIC: nothing to load beside the library.
          ! readelf -d build/libbw_audio.so | grep -q phonon
          # -Wl,--exclude-libs,ALL holds: the bwa_* ABI is the whole export list.
          test "$(nm -D --defined-only build/libbw_audio.so | grep -c ' ipl')" = 0
          # The two Linux backends load their libraries at RUN TIME (os_dl_*), so neither may be
          # in NEEDED and neither may leave an undefined symbol behind. A box with no JACK and no
          # sound card has to load this file and run the offline sink; linking either library
          # would make its absence a failure of the whole library instead of of one backend.
          ! readelf -d build/libbw_audio.so | grep -E 'NEEDED.*(libasound|libjack)'
          test "$(nm -D --undefined-only build/libbw_audio.so | grep -cE ' (snd_|jack_)')" = 0

      # ---- the Octave MEX, against the SDK ---------------------------------------------------------
      # Its own tree, in bindings-only mode (root CMakeLists, "SDK MODE"), on the RUNNER: mkoctfile
      # is the runner's Octave, and what it links is the container's glibc-2.28 shared object. The
      # MATLAB half joins the same tree below, once matlab-actions has installed a MATLAB.
      - name: Configure and build the Octave MEX
        run: |
          cmake -S . -B build-bind -DCMAKE_BUILD_TYPE=RelWithDebInfo \
                -DBWA_ENGINE_SDK="$GITHUB_WORKSPACE/engine-sdk" \
                -DBWA_BUILD_MATLAB=ON | tee bind-configure.log
          # SDK MODE is not a fallback: if it silently did not engage, this tree would compile a
          # second engine - the exact thing this job exists to stop doing.
          grep -q "SDK MODE" bind-configure.log
          # And BWA_BUILD_MATLAB skips SILENTLY when it finds no toolchain, which is exactly the
          # shape that would let the Octave MEX stop being built without anyone noticing.
          grep -q "Octave MEX enabled" bind-configure.log
          cmake --build build-bind
          test -s bindings/matlab/bin/octave/linux-x64/bwa_mex.mex
          cmp engine-sdk/lib/libbw_audio.so bindings/matlab/bin/octave/linux-x64/libbw_audio.so

      - name: Test the Octave binding
        # --no-tests=error: an empty selection is a FAILURE, not a pass.
        run: ctest --test-dir build-bind --output-on-failure --no-tests=error -R '^octave_'

      # ---- the MATLAB MEX ------------------------------------------------------------------------
      # UNVERIFIED LOCALLY, all of it: nobody here can run a GitHub-hosted MATLAB, so these steps
      # come from the patterns in https://github.com/mathworks/ci-configuration-examples rather
      # than from a run. On a GitHub-hosted runner for a public repository no license token is
      # needed, but the license only exists INSIDE the matlab-actions run-* steps: a shell
      # step's own `matlab` launch is unlicensed, so anything that has to run MATLAB code
      # goes through run-command.
      #
      # They live INSIDE this job, after the engine build, so the MEX links the library this job
      # already produced - JACK, ALSA and a static phonon intact - instead of a second engine built
      # somewhere else. The Octave MEX above came from the same SDK for the same reason.
      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v3
        with:
          # Pinned, so a new MathWorks release cannot change overnight what this job tested.
          release: R2024b

      - name: Find matlabroot
        # setup-matlab puts the launcher on PATH but not matlabroot, and FindMatlab wants the
        # root. Ask MATLAB itself rather than guessing the install layout - but through
        # run-command, not `matlab -batch` in a shell step: on a public repository the license
        # is granted ONLY inside matlab-actions' run-* steps, and a direct launch dies with
        # "License checkout failed" (it did, on the first run of these steps).
        uses: matlab-actions/run-command@v3
        with:
          command: |
            f = fopen(getenv("GITHUB_ENV"), "a");
            fprintf(f, "MATLAB_ROOT=%s\n", matlabroot);
            fclose(f);

      - name: Configure and build the MATLAB MEX
        shell: bash
        run: |
          root="$MATLAB_ROOT"
          echo "matlabroot: $root"
          test -d "$root"
          # The SAME bindings tree the Octave MEX used, still in SDK mode. Reconfiguring only adds
          # the MATLAB target; nothing rebuilds, and no engine is compiled here at all.
          cmake -S . -B build-bind -DMatlab_ROOT_DIR="$root" | tee matlab-configure.log
          # LOUD on the one failure these steps exist to catch: FindMatlab not locating the
          # action's install. The option skips SILENTLY when it finds no toolchain, so without
          # this the job would build nothing, run nothing, and pass.
          grep -q "MATLAB MEX enabled" matlab-configure.log
          cmake --build build-bind --target bwa_mex_matlab
          mex=bindings/matlab/bin/matlab/linux-x64/bwa_mex.mexa64
          test -s "$mex"
          cmp engine-sdk/lib/libbw_audio.so bindings/matlab/bin/matlab/linux-x64/libbw_audio.so
          # It has to find the engine library BESIDE it, not on a system path: the staged pair is
          # what a user copies, and an empty runpath would only fail on their machine.
          readelf -d "$mex" | grep -E 'RUNPATH|RPATH' | grep -q 'ORIGIN'

      - name: Test the MATLAB binding
        uses: matlab-actions/run-command@v3
        with:
          # run-command fails the step on an uncaught error, so raising IS the failure signal.
          # run_tests returns 77 when no MEX was staged, which is a failure here: the step above
          # was supposed to stage one.
          command: |
            cd("bindings/matlab/tests");
            rc = run_tests();
            cd(fullfile("..", "examples"));
            rc = rc + offline_render("--tests");
            rc = rc + live_onset("--tests");
            rc = rc + AudioTunnel3DDemo_bwa("--tests");
            if rc ~= 0
                error("bwa:ci", "the MATLAB binding reported %d failing check groups", rc);
            end

      - name: Stage the MEX files for the package job
        shell: bash
        run: |
          # Into the fixed-name pack input the package job already downloads, so assembling the
          # cross-platform toolbox there costs no second handoff. BOTH interpreters' MEX files,
          # and ONE engine library: the two staging directories hold the same build of it, and
          # both MEX files load it out of the bin/glnxa64 they end up sharing.
          mkdir -p pack-linux/matlab
          cp bindings/matlab/bin/matlab/linux-x64/bwa_mex.mexa64 pack-linux/matlab/
          cp bindings/matlab/bin/octave/linux-x64/bwa_mex.mex    pack-linux/matlab/
          cp build/libbw_audio.so pack-linux/matlab/
          strip --strip-debug pack-linux/matlab/libbw_audio.so
          ls -l pack-linux/matlab

      - name: Upload artifact (MATLAB and Octave binding)
        uses: actions/upload-artifact@v7
        with:
          name: bw_audio-matlab-linux-x64-${{ steps.ver.outputs.version }}-r${{ github.run_number }}
          # BOTH interpreters' MEX files with the engine library beside each, plus the package a
          # user adds to their path. Each MEX finds its library through an $ORIGIN runpath, so a
          # staged directory is self-contained. The cross-platform TOOLBOX (one folder, three
          # architectures, both interpreters) is assembled in the package job and shipped from
          # there; this artifact is the Linux-only pair, in the build tree's own layout.
          path: |
            bindings/matlab/bin/
            bindings/matlab/+bwa/
            bindings/matlab/examples/
            bindings/matlab/README.md
          retention-days: 30
          if-no-files-found: error

      # ---- the Godot extension, and what the package job packs -----------------------------------
      # Same shape as the android job's contribution: this job is the only place a Linux GDExtension
      # can be built, so it builds one and hands it over. Two flavours here, unlike Android's one,
      # because a Linux collaborator runs an EDITOR as well as exporting a game.
      - name: Cache godot-cpp build (linux)
        uses: actions/cache@v6
        with:
          # Both trees, keyed on the pinned commit, exactly as the windows job does it: godot-cpp
          # generates and compiles ~2100 binding files per flavour and our nine rebuild on top.
          # runner.os keeps this entry apart from the Windows one under the same commit.
          path: |
            build-godot-editor
            build-godot-template_release
          # -sdk1: these trees stopped compiling an engine of their own, so an entry saved before
          # that still holds the old targets and cache variables. Bump this suffix, never reuse it.
          key: godot-cpp-${{ env.GODOT_CPP_COMMIT }}-${{ runner.os }}-sdk1

      - name: Build the Godot GDExtension (linux x86_64, both flavours)
        shell: bash
        run: |
          # No -G: the default Makefiles generator is on every runner image, and nothing here needs
          # ninja. BWA_BUILD_TESTS stays ON for the same reason the windows job pins it - these
          # trees are CACHED, and a stale entry with it off would silently change what they are.
          #
          # BWA_ENGINE_SDK: each flavour used to compile the whole engine again, so this job built
          # three of them. Now both link the one the container tested, and the POST_BUILD stages
          # that exact file into the addon.
          for t in editor template_release; do
            cmake -S . -B build-godot-$t -DCMAKE_BUILD_TYPE=RelWithDebInfo \
                  -DBWA_ENGINE_SDK="$GITHUB_WORKSPACE/engine-sdk" \
                  -DBWA_BUILD_GODOT=ON -DGODOTCPP_TARGET=$t -DBWA_BUILD_TESTS=ON
            cmake --build build-godot-$t --target bwa_gdextension
            ext=bindings/godot/addons/bw_audio/bin/libbw_audio_gd.linux.$t.x86_64.so
            # The manifest names this exact file. The "lib" prefix is CMake's own default off
            # Windows; the rest is godot-cpp's suffix property, so the two cannot drift.
            test -s "$ext"
            # And it must still LOAD the engine rather than having quietly absorbed it: the addon
            # ships one engine library, and the manifest lists it as a dependency.
            readelf -d "$ext" | grep -q 'NEEDED.*libbw_audio\.so'
          done
          # The POST_BUILD staged the engine library one directory down, because Android's has the
          # same file name and one addon carries both.
          test -s bindings/godot/addons/bw_audio/bin/linux/libbw_audio.so
          cmp engine-sdk/lib/libbw_audio.so bindings/godot/addons/bw_audio/bin/linux/libbw_audio.so

      - name: Stage dist
        shell: bash
        run: |
          mkdir -p dist-linux/lib dist-linux/include
          cp build/libbw_audio.so dist-linux/lib/
          # Split the symbols out the way the Windows artifact ships a .pdb: the library a consumer
          # copies is the 7 MB of code, and the ~25 MB of DWARF (most of it phonon's, built -g)
          # sits beside it as libbw_audio.so.debug, found through the gnu_debuglink by any
          # debugger that sees the two together. Run in the lib dir so the link is a basename.
          (cd dist-linux/lib             && objcopy --only-keep-debug libbw_audio.so libbw_audio.so.debug             && objcopy --strip-debug --add-gnu-debuglink=libbw_audio.so.debug libbw_audio.so             && readelf -S libbw_audio.so | grep -q gnu_debuglink             && ls -l libbw_audio.so libbw_audio.so.debug)
          cp include/bw_audio.h   dist-linux/include/
          cp LICENSE THIRD_PARTY-NOTICES.md dist-linux/
          cat > dist-linux/DIST.txt <<EOF
          bw_audio linux-x64 - limited distribution build
          commit   ${{ github.sha }} (${{ github.ref_name }})
          built    $(date -u +%Y-%m-%dT%H:%M:%S)Z  (GitHub Actions run ${{ github.run_id }})
          built on manylinux_2_28 (AlmaLinux 8, glibc 2.28); gcc 14, x86_64 only. The SAME file
                   the release wheel and the Godot addon carry - one engine per platform.
          backends JACK=yes  ALSA=yes  SteamAudio=yes (STATIC). phonon is built from the pinned
                   submodule and linked INSIDE libbw_audio.so, so the binaural path is the real
                   HRTF decode and automatic occlusion, pathing and the reflection bed are all
                   present. There is no second file to ship or to keep beside it.
          no ASIO  ASIO is a Windows driver model. Linux reaches the 26-channel array through
                   JACK (a PipeWire desktop answers the same ABI) or a raw ALSA card; AES67 into
                   the Dante network is the transport. See docs/backends.md.
          contents lib/libbw_audio.so (stripped) + lib/libbw_audio.so.debug (its DWARF, linked
                   by gnu_debuglink: keep the two together to debug, ship only the .so) +
                   include/bw_audio.h. A Unity or Godot consumer wants the package or the addon
                   instead - both carry this library already, stripped, with their import
                   settings set.
          license  GPLv3 (LICENSE) + THIRD_PARTY-NOTICES.md. No ASIO SDK here, so the complete
                   corresponding source is this repo at
                   https://github.com/aforren1/cave-audio/tree/${{ github.sha }}
                   plus Steam Audio (Apache-2.0, statically linked); on a tagged release its
                   source ships as bw_audio-steam-audio-src-<tag>.zip.
          EOF
          cat dist-linux/DIST.txt

          # What the package job packs into the two bindings, plus the whole dist tree so that job
          # can zip it as a release asset without rebuilding anything. A FIXED artifact name: the
          # versioned one below is the one a human downloads.
          #
          # The packaged copies are STRIPPED, the standalone artifact's are not - the same split
          # Windows has, where the shipped DLL's symbols sit in a .pdb the packages do not carry.
          mkdir -p pack-linux/godot pack-linux/unity
          cp -r dist-linux pack-linux/dist
          cp bindings/godot/addons/bw_audio/bin/libbw_audio_gd.linux.editor.x86_64.so \
             bindings/godot/addons/bw_audio/bin/libbw_audio_gd.linux.template_release.x86_64.so \
             build/libbw_audio.so pack-linux/godot/
          cp build/libbw_audio.so pack-linux/unity/
          # Each -*From directory is FLAT; both packs read the manifest to learn where each file
          # belongs inside the package.
          strip --strip-debug pack-linux/godot/*.so pack-linux/unity/*.so
          ls -l pack-linux/godot pack-linux/unity

      # ---- Python wheel (nanobind) --------------------------------------------------------------
      # Same argument as the windows job: the wheel carries the engine library, and this is the job
      # that builds a Linux one. It rides into pack-linux/ as well, so the package job can attach it
      # to the one release without rebuilding anything.
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true

      - name: Build the Python wheel
        shell: bash
        run: |
          uv python install 3.12
          # Straight into pack-linux/, the fixed-name tree the package job already downloads, so
          # the release step there attaches this wheel without a second handoff.
          (cd bindings/python && uv build --wheel --python 3.12 --out-dir "$GITHUB_WORKSPACE/pack-linux/python")
          whl=$(ls "$GITHUB_WORKSPACE"/pack-linux/python/*.whl)
          echo "built $(basename "$whl")"
          case "$(basename "$whl")" in
            *-cp312-abi3-*) : ;;
            *) echo "expected a cp312-abi3 wheel, got $(basename "$whl")"; exit 1 ;;
          esac
          # The wheel is tagged for THIS RUNNER'S glibc, not manylinux: it runs on the ubuntu-latest
          # image's glibc or newer, and not on an older distribution. Building from a checkout
          # always works. A manylinux build is a follow-up (bindings/python/README.md says so too).
          python3 -c "import sys;print('glibc floor:', __import__('platform').libc_ver())"
          # And the extension must find the engine library BESIDE it rather than on the system path.
          unzip -o -q "$whl" -d "$GITHUB_WORKSPACE/wheel-inspect"
          readelf -d "$GITHUB_WORKSPACE"/wheel-inspect/bw_audio/_bwa*.so | grep -E 'RUNPATH|RPATH' | grep -q 'ORIGIN'
          test -s "$GITHUB_WORKSPACE"/wheel-inspect/bw_audio/libbw_audio.so

      - name: Test the Python wheel (from the INSTALLED wheel, not the source tree)
        shell: bash
        run: |
          uv venv --python 3.12 .wheelenv
          uv pip install --python .wheelenv pytest numpy "$GITHUB_WORKSPACE"/pack-linux/python/*.whl
          .wheelenv/bin/python -m pytest -q --color=no bindings/python/tests
          .wheelenv/bin/python bindings/python/examples/offline_render.py --tests
          .wheelenv/bin/python bindings/python/examples/live_onset.py --tests

      - name: Upload artifact (Python wheel)
        uses: actions/upload-artifact@v7
        with:
          name: bw_audio-python-linux-x64-${{ steps.ver.outputs.version }}-r${{ github.run_number }}
          path: pack-linux/python/
          retention-days: 30
          if-no-files-found: error

      - name: Upload artifact (Linux engine)
        uses: actions/upload-artifact@v7
        with:
          name: bw_audio-linux-x64-${{ steps.ver.outputs.version }}-r${{ github.run_number }}
          path: dist-linux/
          retention-days: 30
          if-no-files-found: error

      - name: Upload artifact (packing input for the package job)
        uses: actions/upload-artifact@v7
        with:
          name: linux-pack-input
          path: pack-linux/
          retention-days: 1      # an intra-run handoff, not a download
          if-no-files-found: error

      # The engine SDK the container produced, for the wheels job. That job builds the
      # manylinux_2_28 release wheel, and this is the glibc-2.28 engine it must carry - the same
      # one the ctest above ran, the addon ships and both MEX gateways load. Without this handoff
      # cibuildwheel would compile a second engine inside its own container and the release wheel
      # would carry a file nothing tested. UNSTRIPPED: the wheel's own install rule strips its copy.
      - name: Upload artifact (engine SDK for the wheels job)
        uses: actions/upload-artifact@v7
        with:
          name: linux-engine-sdk
          path: engine-sdk/
          retention-days: 1      # an intra-run handoff, not a download
          if-no-files-found: error

  # UNVERIFIED LOCALLY, all of it: nobody here has a Mac, so this job is the first thing that
  # executes either the shim's Apple paths or a macOS phonon build. Both decisions below came out
  # of the pinned scripts rather than a run. build.py -p osx generates ONE tree named "osx" with
  # the Xcode generator, and core/CMakeLists.txt sets CMAKE_OSX_ARCHITECTURES "x86_64;arm64" for
  # every macOS build (get_dependencies.py passes the same pair to the three companions), so the
  # archives are universal and osx-universal is the honest stage-dir - which is also the name the
  # root CMakeLists prefers when more than one is staged. The failure mode is the configure
  # assertion, not a silent no-SDK build.
  macos:
    runs-on: macos-latest
    # Same arithmetic as the linux job, and every compile here is UNIVERSAL, so it is two
    # codegen passes per file.
    timeout-minutes: 120
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      # `python`, not `python3`: see the linux job's copy of this step.
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Version
        id: ver
        shell: bash
        run: |
          # The same rule as the android and linux jobs; see the android job's copy.
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            v="${GITHUB_REF_NAME#v}"
          else
            v="0.0.0-dev"
            if d=$(git describe --tags --long --dirty --match 'v*' 2>/dev/null); then
              if [[ "$d" =~ ^v?(.+)-([0-9]+)-g([0-9a-f]+)(-dirty)?$ ]]; then
                if [ "${BASH_REMATCH[2]}" = 0 ]; then v="${BASH_REMATCH[1]}"
                else v="${BASH_REMATCH[1]}-dev.${BASH_REMATCH[2]}.g${BASH_REMATCH[3]}"; fi
              fi
            fi
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "macos version: $v"

      - name: Phonon cache key (submodule sha, no checkout needed)
        id: phonon-key
        shell: bash
        run: echo "sha=$(git rev-parse HEAD:third_party/steam-audio-source)" >> "$GITHUB_OUTPUT"

      - name: Cache phonon (built Steam Audio core)
        id: phonon
        uses: actions/cache@v6
        with:
          path: third_party/steam-audio-artifacts
          key: phonon-osx-v2-${{ steps.phonon-key.outputs.sha }}-${{ hashFiles('third_party/patches/**') }}

      - name: Build phonon (cache miss only; recipe = third_party/README.md)
        if: steps.phonon.outputs.cache-hit != 'true'
        uses: ./.github/actions/build-phonon
        with:
          platform: osx
          arch: x64          # ignored for osx: the tree is universal, see the job comment
          stage-dir: osx-universal
          # No AVX flag: -fabi-version=6 is a Linux-only branch in core/CMakeLists.txt, and
          # Apple clang never sees it.

      # ---- Octave (the second half of the MATLAB binding's toolchain) -----------------------------
      # UNVERIFIED LOCALLY, like the rest of this job. `octave` is a FORMULA, not a cask, so
      # --formula only says out loud what brew would infer; it is there because a bare name is
      # ambiguous in principle and this job has nobody to debug it. There is no lighter variant:
      # the formula pulls ~27 dependencies including gcc, qt and ghostscript, which is minutes of
      # bottle pouring on a cold run. That is the price of testing the binding where a Mac user
      # would run it, and it is small against this job's phonon build.
      #
      # It puts mkoctfile and octave-cli in the brew prefix's bin, which is on PATH, so CMake's
      # plain find_program finds both with no hint - the OCTAVE_HOME dance is Windows-only.
      # mkoctfile compiles with whatever compiler Octave was built against (brew's gcc), and what
      # it links is the UNIVERSAL dylib this job just built, so an arm64 .mex loads it happily.
      # Nothing here is universal: like MATLAB's, the Octave MEX is the runner's own architecture.
      - name: Install Octave
        run: |
          brew install --formula octave
          mkoctfile --version
          octave-cli --version | head -1

      - name: Configure
        run: |
          # UNIVERSAL, because the shipped artifact is one file for both Apple architectures and an
          # Intel Mac is still a machine a collaborator has. phonon's own archives are universal
          # already (core/CMakeLists.txt sets the same pair for every macOS build), so this costs
          # compile time and nothing else. The ctest suite below is built universal too and runs
          # natively on whichever arch the runner is.
          #
          # THE ENGINE ONLY. No binding is configured in this tree any more: it builds and tests
          # the engine, the step after the library check turns it into an install SDK, and every
          # binding in this job - both MEX gateways, both Godot flavours, the wheel, and the
          # universal2 release wheel the `wheels` job builds - links THAT file.
          #
          # CMAKE_OSX_DEPLOYMENT_TARGET 10.13 is not cosmetic. It is the only deployment target
          # anything in this tree names: phonon's core/CMakeLists.txt asks for it, and the release
          # wheel DECLARES it (bindings/python/pyproject.toml's cibuildwheel environment). Left
          # unset, clang picks the runner's own macOS version, and a macosx_10_13_universal2 wheel
          # carrying a dylib built for macOS 15 installs anywhere and loads nowhere older. Clang
          # raises the arm64 slice to 11.0 by itself, because no Mac ran arm64 before it.
          cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo -DBWA_BUILD_TESTS=ON \
                -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64" \
                -DCMAKE_OSX_DEPLOYMENT_TARGET=10.13 | tee configure.log
          grep -q "null and manual sinks only" configure.log
          grep -q "Steam Audio ENABLED" configure.log

      - name: Build
        run: cmake --build build --config RelWithDebInfo

      - name: Check the library
        # The same empty-link-rule guard as the linux job. No output-name or output-directory
        # override on the target and no -G here, so the default single-config Makefiles generator
        # writes it to the build root under CMake's own Apple naming.
        run: |
          test -s build/libbw_audio.dylib
          # A universal build that silently produced ONE slice is the failure this job cannot see
          # any other way: it links, it tests, and it fails on half the Macs that download it.
          lipo -info build/libbw_audio.dylib
          lipo -info build/libbw_audio.dylib | grep -q x86_64
          lipo -info build/libbw_audio.dylib | grep -q arm64
          # phonon is STATIC: nothing to load beside the library.
          ! otool -L build/libbw_audio.dylib | grep -q phonon

      - name: Test
        # 38: the 33 a default off-Windows build registers plus the five SDK-gated ones. The
        # binding tests are not here any more - they have their own tree (build-bind) below.
        run: ctest --test-dir build -C RelWithDebInfo --output-on-failure

      # ---- the engine SDK ------------------------------------------------------------------------
      # ONE ENGINE PER PLATFORM. Both MEX gateways, both Godot flavours and both wheels used to
      # compile a copy of the engine each; now they link this one, which is the tree ctest just ran.
      # --component bwa_sdk keeps the Python binding's own install rules out of the prefix.
      - name: Install the engine SDK
        run: |
          cmake --install build --prefix "$GITHUB_WORKSPACE/engine-sdk" --component bwa_sdk
          test -s engine-sdk/lib/libbw_audio.dylib
          test -s engine-sdk/include/bw_audio.h
          test -s engine-sdk/lib/cmake/bw_audio/bw_audioConfig.cmake
          cmp build/libbw_audio.dylib engine-sdk/lib/libbw_audio.dylib
          # Both slices survived the install, and each carries the deployment target the release
          # wheel declares. Per slice, because the two slices spell it differently: for a target
          # below 10.14 ld writes LC_VERSION_MIN_MACOSX ("version 10.13") into the x86_64 slice,
          # LC_BUILD_VERSION only exists from 10.14 up, and clang floors arm64 macOS at 11.0, so
          # that slice says "minos 11.0". The first run grepped one string across both and
          # could not pass.
          lipo -info engine-sdk/lib/libbw_audio.dylib | grep -q x86_64
          lipo -info engine-sdk/lib/libbw_audio.dylib | grep -q arm64
          otool -arch x86_64 -l engine-sdk/lib/libbw_audio.dylib \
            | grep -A3 -E 'LC_VERSION_MIN_MACOSX|LC_BUILD_VERSION' \
            | grep -qE '(version|minos)[[:space:]]+10\.13'
          otool -arch arm64 -l engine-sdk/lib/libbw_audio.dylib \
            | grep -A3 LC_BUILD_VERSION | grep -qE 'minos[[:space:]]+11\.0'

      # ---- the Octave MEX, against the SDK ---------------------------------------------------------
      # Its own tree, in bindings-only mode. The MATLAB half joins it below, once matlab-actions has
      # installed a MATLAB for FindMatlab to find.
      - name: Configure and build the Octave MEX
        run: |
          cmake -S . -B build-bind -DCMAKE_BUILD_TYPE=RelWithDebInfo \
                -DBWA_ENGINE_SDK="$GITHUB_WORKSPACE/engine-sdk" \
                -DBWA_BUILD_MATLAB=ON | tee bind-configure.log
          # SDK MODE is not a fallback: if it silently did not engage, this tree would compile a
          # second engine and the one-engine claim above would be false.
          grep -q "SDK MODE" bind-configure.log
          # And BWA_BUILD_MATLAB skips SILENTLY when it finds no toolchain.
          grep -q "Octave MEX enabled" bind-configure.log
          cmake --build build-bind
          test -s bindings/matlab/bin/octave/macos-universal/bwa_mex.mex
          cmp engine-sdk/lib/libbw_audio.dylib bindings/matlab/bin/octave/macos-universal/libbw_audio.dylib

      - name: Test the Octave binding
        # --no-tests=error: an empty selection is a FAILURE, not a pass.
        run: ctest --test-dir build-bind --output-on-failure --no-tests=error -R '^octave_'

      # ---- the MATLAB MEX ------------------------------------------------------------------------
      # UNVERIFIED LOCALLY, like the rest of this job, and doubly so: written from the patterns in
      # https://github.com/mathworks/ci-configuration-examples, on a machine nobody here has.
      # Inside this job, after the engine build, so the MEX links the universal dylib this job
      # already produced rather than a second engine built elsewhere.
      #
      # macos-latest is APPLE SILICON, so MATLAB is the arm64 build and its MEX extension is
      # .mexmaca64. The engine dylib beside it is UNIVERSAL (x86_64 + arm64), which an arm64 MATLAB
      # loads happily; the MEX itself is arm64 only, because MATLAB's own mex toolchain builds for
      # the architecture it is. An Intel Mac needs a MEX built on one, which nothing here has.
      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v3
        with:
          # Pinned, so a new MathWorks release cannot change overnight what this job tested.
          release: R2024b

      - name: Find matlabroot
        # setup-matlab puts the launcher on PATH but not matlabroot, and FindMatlab wants the
        # root. Ask MATLAB itself rather than guessing the install layout - but through
        # run-command, not `matlab -batch` in a shell step: on a public repository the license
        # is granted ONLY inside matlab-actions' run-* steps, and a direct launch dies with
        # "License checkout failed" (it did, on the first run of these steps).
        uses: matlab-actions/run-command@v3
        with:
          command: |
            f = fopen(getenv("GITHUB_ENV"), "a");
            fprintf(f, "MATLAB_ROOT=%s\n", matlabroot);
            fclose(f);

      - name: Configure and build the MATLAB MEX
        shell: bash
        run: |
          root="$MATLAB_ROOT"
          echo "matlabroot: $root"
          test -d "$root"
          # The SAME bindings tree the Octave MEX used, still in SDK mode. Reconfiguring only adds
          # the MATLAB target; nothing rebuilds, and no engine is compiled here at all.
          cmake -S . -B build-bind -DMatlab_ROOT_DIR="$root" | tee matlab-configure.log
          # LOUD on the one failure these steps exist to catch: the option skips SILENTLY when it
          # finds no toolchain, so without this the job would build nothing and pass.
          grep -q "MATLAB MEX enabled" matlab-configure.log
          cmake --build build-bind --target bwa_mex_matlab
          mex=bindings/matlab/bin/matlab/macos-universal/bwa_mex.mexmaca64
          test -s "$mex"
          cmp engine-sdk/lib/libbw_audio.dylib bindings/matlab/bin/matlab/macos-universal/libbw_audio.dylib
          # It has to find the engine library BESIDE it rather than on a system path.
          otool -l "$mex" | grep -q '@loader_path'

      - name: Test the MATLAB binding
        uses: matlab-actions/run-command@v3
        with:
          # run-command fails the step on an uncaught error, so raising IS the failure signal.
          command: |
            cd("bindings/matlab/tests");
            rc = run_tests();
            cd(fullfile("..", "examples"));
            rc = rc + offline_render("--tests");
            rc = rc + live_onset("--tests");
            rc = rc + AudioTunnel3DDemo_bwa("--tests");
            if rc ~= 0
                error("bwa:ci", "the MATLAB binding reported %d failing check groups", rc);
            end

      # ---- the Godot extension, and what the package job packs -----------------------------------
      # UNVERIFIED LOCALLY, like the rest of this job. Every file name below comes from godot-cpp's
      # own CMake: it sets OUTPUT_NAME to its GODOTCPP_SUFFIX property, whose arch component is the
      # literal "universal" when CMAKE_OSX_ARCHITECTURES holds both, and it never sets the FRAMEWORK
      # property, so CMake writes a plain lib*.dylib rather than a .framework bundle. The manifest
      # key carries no arch (Godot matches feature tags, and "universal" is not one); the FILE name
      # keeps godot-cpp's spelling. The failure mode is loud: the test -s and lipo checks below.
      - name: Cache godot-cpp build (macos)
        uses: actions/cache@v6
        with:
          path: |
            build-godot-editor
            build-godot-template_release
          # -sdk1: these trees stopped compiling an engine of their own, so an entry saved before
          # that still holds the old targets and cache variables. Bump this suffix, never reuse it.
          key: godot-cpp-${{ env.GODOT_CPP_COMMIT }}-${{ runner.os }}-sdk1

      - name: Build the Godot GDExtension (macos universal, both flavours)
        shell: bash
        run: |
          # BWA_ENGINE_SDK: each flavour used to compile the whole engine again, universal, so this
          # job built three of them. Now both link the one ctest ran, and the POST_BUILD stages
          # that exact file into the addon.
          for t in editor template_release; do
            cmake -S . -B build-godot-$t -DCMAKE_BUILD_TYPE=RelWithDebInfo \
                  -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64" \
                  -DCMAKE_OSX_DEPLOYMENT_TARGET=10.13 \
                  -DBWA_ENGINE_SDK="$GITHUB_WORKSPACE/engine-sdk" \
                  -DBWA_BUILD_GODOT=ON -DGODOTCPP_TARGET=$t -DBWA_BUILD_TESTS=ON
            cmake --build build-godot-$t --target bwa_gdextension
            ext=bindings/godot/addons/bw_audio/bin/libbw_audio_gd.macos.$t.universal.dylib
            test -s "$ext"
            lipo -info "$ext" | grep -q x86_64
            lipo -info "$ext" | grep -q arm64
            # It must still LOAD the engine rather than having quietly absorbed it: the addon ships
            # one engine library, and the manifest lists it as a dependency.
            otool -L "$ext" | grep -q libbw_audio.dylib
          done
          test -s bindings/godot/addons/bw_audio/bin/libbw_audio.dylib
          cmp engine-sdk/lib/libbw_audio.dylib bindings/godot/addons/bw_audio/bin/libbw_audio.dylib

      - name: Stage dist
        shell: bash
        run: |
          mkdir -p dist-macos/lib dist-macos/include
          cp build/libbw_audio.dylib dist-macos/lib/
          # The Apple spelling of the linux job's symbol split: the DWARF goes into a .dSYM bundle
          # beside the library, then the same export-preserving strip the pack step uses (-S -x,
          # never a bare strip on a dylib). Re-prove both slices survived it.
          dsymutil dist-macos/lib/libbw_audio.dylib -o dist-macos/lib/libbw_audio.dylib.dSYM
          strip -S -x dist-macos/lib/libbw_audio.dylib
          test -s dist-macos/lib/libbw_audio.dylib
          lipo -info dist-macos/lib/libbw_audio.dylib | grep -q x86_64
          lipo -info dist-macos/lib/libbw_audio.dylib | grep -q arm64
          ls -l dist-macos/lib; du -sh dist-macos/lib/libbw_audio.dylib.dSYM
          cp include/bw_audio.h      dist-macos/include/
          cp LICENSE THIRD_PARTY-NOTICES.md dist-macos/
          cat > dist-macos/DIST.txt <<EOF
          bw_audio macos-universal - limited distribution build
          commit   ${{ github.sha }} (${{ github.ref_name }})
          built    $(date -u +%Y-%m-%dT%H:%M:%S)Z  (GitHub Actions run ${{ github.run_id }})
          arches   one UNIVERSAL library, x86_64 + arm64 ($(lipo -info dist-macos/lib/libbw_audio.dylib))
          backends none. macOS has no device backend yet (CoreAudio is docs/backends.md phase 4),
                   so this runs the null and manual sinks: offline rendering and the test suite.
                   SteamAudio=yes (STATIC), so the binaural path is the real HRTF decode.
          unsigned NOT code-signed and NOT notarized. Gatekeeper blocks a downloaded unsigned
                   library, so clear the quarantine flag after unzipping:
                     xattr -dr com.apple.quarantine <this folder>
                   Shipping outside a lab needs a Developer ID signature and notarization.
          contents lib/libbw_audio.dylib (stripped) + lib/libbw_audio.dylib.dSYM (its symbols;
                   keep the two together to symbolize a crash, ship only the dylib) +
                   include/bw_audio.h. A Unity or Godot consumer wants the package or the addon
                   instead - both carry this library already, stripped, with their import
                   settings set.
          license  GPLv3 (LICENSE) + THIRD_PARTY-NOTICES.md. No ASIO SDK here, so the complete
                   corresponding source is this repo at
                   https://github.com/aforren1/cave-audio/tree/${{ github.sha }}
                   plus Steam Audio (Apache-2.0, statically linked); on a tagged release its
                   source ships as bw_audio-steam-audio-src-<tag>.zip.
          EOF
          cat dist-macos/DIST.txt

          # What the package job packs into the two bindings, plus the whole dist tree so that job
          # can zip it as a release asset. Same split as android and linux: the packaged copies are
          # stripped, the standalone artifact's are not.
          mkdir -p pack-macos/godot pack-macos/unity pack-macos/matlab
          cp -r dist-macos pack-macos/dist
          # BOTH MEX files and ONE engine library, for the cross-platform toolbox the package job
          # assembles. arm64 MEX files, universal dylib - see the MATLAB and Octave steps above.
          cp bindings/matlab/bin/matlab/macos-universal/bwa_mex.mexmaca64 pack-macos/matlab/
          cp bindings/matlab/bin/octave/macos-universal/bwa_mex.mex       pack-macos/matlab/
          cp build/libbw_audio.dylib pack-macos/matlab/
          strip -S -x pack-macos/matlab/libbw_audio.dylib
          cp bindings/godot/addons/bw_audio/bin/libbw_audio_gd.macos.editor.universal.dylib \
             bindings/godot/addons/bw_audio/bin/libbw_audio_gd.macos.template_release.universal.dylib \
             build/libbw_audio.dylib pack-macos/godot/
          cp build/libbw_audio.dylib pack-macos/unity/
          # -S drops the debug map, -x every local symbol. Both are what Xcode itself does to a
          # shared library ("Strip Style: Non-Global Symbols"), and they leave the global symbol
          # table the dynamic linker binds against - which -fvisibility=hidden has already reduced
          # to the bwa_* ABI. A bare `strip` is the one to avoid here: on a Mach-O dylib it will
          # take the exported entries with it and the result no longer loads.
          strip -S -x pack-macos/godot/*.dylib pack-macos/unity/*.dylib
          # Prove the strip did not damage them.
          for f in pack-macos/godot/*.dylib pack-macos/unity/*.dylib; do
            test -s "$f"
            lipo -info "$f" | grep -q arm64
          done
          ls -l pack-macos/godot pack-macos/unity

      # ---- Python wheel (nanobind) --------------------------------------------------------------
      # Same argument as the other two jobs. The wheel is NOT universal even though the engine
      # library inside it is: a wheel's platform tag names one architecture, so this ships for the
      # runner's own (arm64 on the current macos-latest image). Nothing else here changes.
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true

      - name: Build the Python wheel
        shell: bash
        run: |
          uv python install 3.12
          # -C cmake.define.BWA_ENGINE_SDK: scikit-build-core forwards a config setting of that
          # shape straight to the CMake command line, which puts the root CMakeLists into
          # bindings-only mode. Without it this builds a SECOND full universal engine inside its
          # own isolated build directory.
          (cd bindings/python && uv build --wheel --python 3.12 \
              -C cmake.define.BWA_ENGINE_SDK="$GITHUB_WORKSPACE/engine-sdk" \
              --out-dir "$GITHUB_WORKSPACE/pack-macos/python")
          whl=$(ls "$GITHUB_WORKSPACE"/pack-macos/python/*.whl)
          echo "built $(basename "$whl")"
          case "$(basename "$whl")" in
            *-cp312-abi3-*) : ;;
            *) echo "expected a cp312-abi3 wheel, got $(basename "$whl")"; exit 1 ;;
          esac
          # The extension must find the engine library beside it, not on the system path.
          unzip -o -q "$whl" -d "$GITHUB_WORKSPACE/wheel-inspect"
          otool -l "$GITHUB_WORKSPACE"/wheel-inspect/bw_audio/_bwa*.so | grep -q '@loader_path'
          test -s "$GITHUB_WORKSPACE"/wheel-inspect/bw_audio/libbw_audio.dylib

      - name: Test the Python wheel (from the INSTALLED wheel, not the source tree)
        shell: bash
        run: |
          uv venv --python 3.12 .wheelenv
          uv pip install --python .wheelenv pytest numpy "$GITHUB_WORKSPACE"/pack-macos/python/*.whl
          .wheelenv/bin/python -m pytest -q --color=no bindings/python/tests
          .wheelenv/bin/python bindings/python/examples/offline_render.py --tests
          .wheelenv/bin/python bindings/python/examples/live_onset.py --tests

      - name: Upload artifact (Python wheel)
        uses: actions/upload-artifact@v7
        with:
          name: bw_audio-python-macos-${{ steps.ver.outputs.version }}-r${{ github.run_number }}
          path: pack-macos/python/
          retention-days: 30
          if-no-files-found: error

      - name: Upload artifact (macOS engine)
        uses: actions/upload-artifact@v7
        with:
          name: bw_audio-macos-universal-${{ steps.ver.outputs.version }}-r${{ github.run_number }}
          path: dist-macos/
          retention-days: 30
          if-no-files-found: error

      # The engine SDK, for the wheels job's universal2 release wheel - the same universal dylib
      # this job's ctest ran, built for the 10.13 deployment target that wheel declares.
      - name: Upload artifact (engine SDK for the wheels job)
        uses: actions/upload-artifact@v7
        with:
          name: macos-engine-sdk
          path: engine-sdk/
          retention-days: 1      # an intra-run handoff, not a download
          if-no-files-found: error

      - name: Upload artifact (packing input for the package job)
        uses: actions/upload-artifact@v7
        with:
          name: macos-pack-input
          path: pack-macos/
          retention-days: 1      # an intra-run handoff, not a download
          if-no-files-found: error

  # ---- the RELEASE Python wheels (NINE of them: three Pythons x three desktops) -----------------
  # The three per-runner `uv build --wheel` steps above are the FAST GATE: one per desktop job,
  # proving the binding still builds and tests where the engine was just built. What they cannot
  # produce is the set a release ships. `uv build` tags for the MACHINE and for ONE interpreter -
  # the runner image's glibc on Linux, the runner's own architecture on macOS, and cp312 everywhere
  # because that is what the step pins - so the Linux wheel refused an older distribution, the
  # macOS wheel served one of the two Apple architectures, and no platform served 3.10 or 3.11 at
  # all.
  #
  # This job fixes all of that: it runs cibuildwheel on each desktop, which builds the Linux wheels
  # INSIDE a manylinux container, the macOS wheels for x86_64 and arm64 at once, and every one of
  # them for each interpreter in pyproject's `build` selector.
  #
  # WHY THREE PER PLATFORM. nanobind's STABLE_ABI targets the 3.12 limited API, so the cp312 build
  # is tagged cp312-abi3 and covers 3.12 and every later Python in one file. 3.10 and 3.11 predate
  # that limited API and each needs a version-specific wheel. 3.10 is the floor: the pinned
  # nanobind declares Requires-Python >=3.10. Building cp313 or cp314 would produce the cp312-abi3
  # file again under another name, so pyproject does not.
  #
  # WINDOWS IS HERE NOW. It used to be absent on the argument that a Windows wheel already names
  # one ABI and one architecture, which was true and beside the point: the argument was about the
  # PLATFORM tag, and what the windows job's single wheel could not cover was the INTERPRETER. Its
  # `uv build` step stays exactly where it is, as that job's fast gate, and its wheel stays a
  # per-run artifact - it is no longer a release asset. Nothing containerizes on Windows;
  # cibuildwheel installs each CPython with nuget and builds in place.
  #
  # NO WHEEL BUILDS AN ENGINE. Each platform downloads the engine SDK its own job installed and
  # passes it through as -DBWA_ENGINE_SDK, so cibuildwheel compiles the nanobind extension and
  # nothing else. That is the whole point: the Linux job already builds its engine inside this same
  # manylinux image, so the release wheels, the Godot addon, both MEX gateways and the tested
  # binary are now one file. It also means no phonon is built or cached here any more - the engine
  # carries it statically, and the SDK carries the engine.
  #
  # `needs` is the cost: this job used to run beside linux and macos and now runs after all three
  # desktop jobs. What it gives back is a whole phonon build and a whole engine build per platform,
  # and the wheel step that is left is minutes per interpreter.
  #
  # macOS side: UNVERIFIED LOCALLY, like the macos job. Nobody here has a Mac, so the universal2
  # build, delocate's repair and the deployment target below came out of cibuildwheel's
  # documentation. The failure modes are all loud (the tag assertion, lipo, otool). The Windows
  # side IS verified locally: the same cibuildwheel version, the same config setting, three wheels.
  wheels:
    name: wheels (${{ matrix.platform }})
    needs: [windows, linux, macos]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: macos
          - os: windows-latest
            platform: windows
    runs-on: ${{ matrix.os }}
    # Generous, but nothing here builds phonon or the engine any more: it is three extension
    # compiles per platform plus their test runs.
    timeout-minutes: 90
    env:
      # The image the wheel is built in, and it MUST be the linux job's BWA_MANYLINUX_IMAGE: that
      # job's engine is what this wheel carries, and a wheel whose extension is compiled in one
      # image against an engine from another is exactly the mismatch the manylinux tag promises is
      # absent. Bump the two together. A digest rather than a tag for the same reason a submodule
      # is a sha; this is cibuildwheel 4.2.1's own pin for the `manylinux_2_28` alias.
      # UNUSED on macOS and Windows: cibuildwheel reads this option only for a Linux build.
      CIBW_MANYLINUX_X86_64_IMAGE: quay.io/pypa/manylinux_2_28_x86_64@sha256:53390351aeb4688114b02c36a23b3e6ce1166ee9b7afc5df1a4f776354fc764c
      # NOTHING to do before the build any more. pyproject.toml's before-all builds phonon and
      # installs the backends' headers, which is what a from-source cibuildwheel run still needs;
      # here the engine arrives prebuilt, so an empty override skips a multi-minute build of
      # something this wheel does not link. An empty string is the documented way to disable it.
      # If a future cibuildwheel ever read an empty value as "unset", the cost is the wasted
      # phonon build and not a wrong wheel: the config setting below is what decides which engine
      # the wheel carries, and nothing this step could build would be linked.
      CIBW_BEFORE_ALL: ""
      # NOT named CIBW_*: cibuildwheel rejects environment variables with that prefix that it
      # does not recognize, which is a good rule and this is not one of its options.
      CIBUILDWHEEL_VERSION: "4.2.1"
    steps:
      - uses: actions/checkout@v7
        # no submodules, and no phonon either: nothing here compiles the engine

      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true

      # INTO THE WORKSPACE, because cibuildwheel copies the working directory into the container
      # and the path inside it has to exist. That is also why the Linux config setting below names
      # /project rather than a runner path.
      - name: Download the engine SDK (built by the ${{ matrix.platform }} job)
        uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.platform }}-engine-sdk
          path: engine-sdk

      - name: Point the build at the engine SDK
        shell: bash
        run: |
          # /project is where cibuildwheel mounts the copied project inside the manylinux
          # container; macOS and Windows builds run on the runner itself, so there the path is the
          # real one. A wrong path here does not degrade quietly - the root CMakeLists fails the
          # configure naming the directory it could not find.
          #
          # FORWARD SLASHES ON WINDOWS, and this one does degrade quietly. cibuildwheel parses
          # CIBW_CONFIG_SETTINGS with shlex.split in POSIX mode, where a backslash is an escape
          # character: `D:\a\cave-audio\engine-sdk` arrives at scikit-build-core as
          # `D:acave-audioengine-sdk`, with no error anywhere. CMake takes forward slashes on
          # Windows, so translate rather than quote.
          if [ "${{ matrix.platform }}" = linux ]; then
            sdk=/project/engine-sdk
          else
            sdk="$(echo "$GITHUB_WORKSPACE/engine-sdk" | tr '\\' '/')"
          fi
          echo "CIBW_CONFIG_SETTINGS=cmake.define.BWA_ENGINE_SDK=$sdk" >> "$GITHUB_ENV"
          find engine-sdk -type f | sort

      # The package directory is bindings/python, but the working directory has to be the
      # REPOSITORY: the build needs the whole tree (cmake.source-dir is "../.."), and cibuildwheel
      # copies the working directory into the container. Same reason pyproject.toml points
      # scikit-build-core at the repo root.
      - name: Build the wheels (cibuildwheel)
        # shell: bash on every platform, so the one command line means the same thing in all three
        # jobs. PowerShell would be the windows default and parses `name@version` arguments by its
        # own rules.
        shell: bash
        run: uvx cibuildwheel@${{ env.CIBUILDWHEEL_VERSION }} --platform ${{ matrix.platform }} bindings/python

      - name: Check the manylinux wheels
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          ls -l wheelhouse
          # THREE, and only three: cp310 and cp311 version-specific, cp312 on the stable ABI and
          # covering every later Python. A fourth file means an interpreter that should have been
          # served by the abi3 wheel got its own build; a missing one means the matrix silently
          # shrank. tr: BSD wc pads its count with spaces, so the macOS copy of this line needs it.
          test "$(ls wheelhouse/*.whl | wc -l | tr -d ' ')" = 3
          # THE ONE-ENGINE ASSERTION, read once. Each wheel's copy of the engine is stripped by the
          # binding's own install rule, so it cannot be compared byte for byte; the GNU build id
          # survives --strip-debug and identifies the link that produced both.
          # The engine is linked with --build-id=sha1 on purpose (root CMakeLists): the manylinux
          # gcc emits none by default, and the first run compared two empty strings here.
          # readelf prints the id on its own line, `Build ID: <hex>`, so match that directly.
          sdk_id=$(readelf -n engine-sdk/lib/libbw_audio.so | grep -oE 'Build ID: [0-9a-f]+')
          test -n "$sdk_id"
          echo "sdk engine [$sdk_id]"
          for abi in cp310-cp310 cp311-cp311 cp312-abi3; do
            # manylinux_2_28, not the runner's glibc. The name carries TWO platform tags:
            # auditwheel found the wheel eligible for manylinux_2_27 as well and says so in the
            # filename, so match the end of the name rather than the whole of it.
            whl=$(ls wheelhouse/*-"$abi"-*manylinux_2_28_x86_64.whl)
            test "$(echo "$whl" | wc -l | tr -d ' ')" = 1
            echo "== $abi: $(basename "$whl")"
            # mkdir -p first: unzip -d creates the LAST directory only, so a nested path
            # fails with "cannot create extraction directory".
            d=wheel-inspect/$abi
            mkdir -p "$d"
            unzip -o -q "$whl" -d "$d"
            # The engine library and the extension, side by side inside the package.
            test -s "$d/bw_audio/libbw_audio.so"
            ls "$d"/bw_audio/_bwa*.so
            # auditwheel must have grafted NOTHING. The engine dlopens libasound and libjack, so
            # neither is in its NEEDED list and the --exclude flags now hold trivially; they and
            # these two assertions stay as GUARDS, because bundling either was always wrong (a
            # bundled libjack cannot match the running server, and libasound is on every Linux
            # desktop). Everything else the engine needs is in the manylinux policy. A
            # bw_audio.libs/ directory here means the repair vendored something, which would also
            # mean it rewrote the extension's runpath.
            # `test ! -d`, NOT `! test -d`: bash's `set -e` ignores the status of any command whose
            # return value is inverted with `!`, so the second spelling is an assertion that can
            # never fail. Same rule for the find below, which counts instead of negating a grep.
            test ! -d "$d/bw_audio.libs"
            test "$(find "$d" \( -name 'libasound*' -o -name 'libjack*' \) | wc -l | tr -d ' ')" = 0
            # And the $ORIGIN link survived, so the extension still finds the engine beside it.
            readelf -d "$d"/bw_audio/_bwa*.so | grep -E 'RUNPATH|RPATH' | grep -q 'ORIGIN'
            b=$(readelf -n "$d/bw_audio/libbw_audio.so" | grep -oE 'Build ID: [0-9a-f]+')
            echo "   engine [$b]"
            test "$sdk_id" = "$b"
          done

      - name: Check the universal2 wheels
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          ls -l wheelhouse
          # THREE, and only three - see the linux step for why that number.
          # tr: BSD wc pads its count with spaces.
          test "$(ls wheelhouse/*.whl | wc -l | tr -d ' ')" = 3
          # THE ONE-ENGINE ASSERTION, read once. Each wheel's copy is stripped (-S -x) by the
          # binding's own install rule, so it cannot be compared byte for byte; LC_UUID survives
          # that strip and identifies the link that produced both, per slice.
          sdk_uuid=$(dwarfdump --uuid engine-sdk/lib/libbw_audio.dylib | awk '{print $2, $3}' | sort)
          test -n "$sdk_uuid"
          echo "sdk engine [$sdk_uuid]"
          for abi in cp310-cp310 cp311-cp311 cp312-abi3; do
            whl=$(ls wheelhouse/*-"$abi"-macosx_*_universal2.whl)
            test "$(echo "$whl" | wc -l | tr -d ' ')" = 1
            echo "== $abi: $(basename "$whl")"
            # mkdir -p first: unzip -d creates the LAST directory only, so a nested path
            # fails with "cannot create extraction directory".
            d=wheel-inspect/$abi
            mkdir -p "$d"
            unzip -o -q "$whl" -d "$d"
            test -s "$d/bw_audio/libbw_audio.dylib"
            # BOTH slices in BOTH binaries. A universal2 wheel whose engine library is one
            # architecture links, installs, imports on the runner, and fails on half the Macs that
            # download it - the same failure the macos job's lipo checks exist to prevent. It is
            # worth doing per wheel: 3.10 and 3.11 come from a different python.org installer than
            # 3.12, so "universal2 on this interpreter" is not evidence about the others.
            for f in "$d"/bw_audio/libbw_audio.dylib "$d"/bw_audio/_bwa*.so; do
              lipo -info "$f"
              lipo -info "$f" | grep -q x86_64
              lipo -info "$f" | grep -q arm64
            done
            # delocate should have had nothing to do: the engine dylib links system frameworks
            # only, and the extension finds the engine through @loader_path.
            otool -L "$d"/bw_audio/_bwa*.so
            otool -l "$d"/bw_audio/_bwa*.so | grep -q '@loader_path'
            # `test ! -d`, NOT `! test -d`: bash's `set -e` ignores the status of any command whose
            # return value is inverted with `!`, which would make this assertion unable to fail.
            test ! -d "$d/bw_audio/.dylibs"
            b=$(dwarfdump --uuid "$d/bw_audio/libbw_audio.dylib" | awk '{print $2, $3}' | sort)
            echo "   engine [$b]"
            test "$sdk_uuid" = "$b"
          done

      - name: Check the windows wheels
        if: matrix.platform == 'windows'
        shell: bash
        run: |
          ls -l wheelhouse
          # THREE, and only three - see the linux step for why that number.
          test "$(ls wheelhouse/*.whl | wc -l | tr -d ' ')" = 3
          for abi in cp310-cp310 cp311-cp311 cp312-abi3; do
            whl=$(ls wheelhouse/*-"$abi"-win_amd64.whl)
            test "$(echo "$whl" | wc -l | tr -d ' ')" = 1
            echo "== $abi: $(basename "$whl")"
            # mkdir -p first: unzip -d creates the LAST directory only, so a nested path
            # fails with "cannot create extraction directory".
            d=wheel-inspect/$abi
            mkdir -p "$d"
            unzip -o -q "$whl" -d "$d"
            # THE ONE-ENGINE ASSERTION, and on Windows it is the strict one: the binding's install
            # rule strips the engine on ELF and Mach-O only (the Windows debug info was never in
            # the DLL, it is in the .pdb the wheel does not carry), so the bytes have to match.
            cmp engine-sdk/bin/bw_audio.dll "$d/bw_audio/bw_audio.dll"
            # NOTHING VENDORED. cibuildwheel's Windows default is `delvewheel repair`, which
            # would copy dependencies into bw_audio.libs/ and MANGLE the engine's filename -
            # breaking both the cmp above and the os.add_dll_directory rule __init__.py relies on.
            # pyproject sets repair-wheel-command to nothing for exactly that reason, and these
            # two assertions are what would catch it coming back.
            # `test ! -d`, NOT `! test -d`: bash's `set -e` ignores the status of any command whose
            # return value is inverted with `!`, so the second spelling is an assertion that can
            # never fail. Everything else here counts rather than negating.
            test ! -d "$d/bw_audio.libs"
            test "$(find "$d" -name '*.dll' | wc -l | tr -d ' ')" = 1
            # The extension itself, named the way this ABI names it: cp310 and cp311 carry the
            # interpreter tag, the abi3 build carries none because it loads on every Python from
            # 3.12. A tagged file under the cp312 heading would mean STABLE_ABI did not engage.
            if [ "$abi" = cp312-abi3 ]; then
              test -s "$d/bw_audio/_bwa.pyd"
              test "$(find "$d/bw_audio" -name '_bwa.cp*.pyd' | wc -l | tr -d ' ')" = 0
            else
              test -s "$d/bw_audio/_bwa.${abi%%-*}-win_amd64.pyd"
            fi
            ls "$d"/bw_audio/
          done

      # A FIXED artifact name, like the other jobs' pack inputs: the package job downloads these
      # three by name for the release. No version in the name, because a wheel's filename already
      # carries the only version a wheel has (BWA_VERSION from bw_audio.h), and 30 days
      # because these are also the wheels a human wants off a branch build.
      - name: Upload artifact (release wheels)
        uses: actions/upload-artifact@v7
        with:
          name: release-wheel-${{ matrix.platform }}
          path: wheelhouse/*.whl
          retention-days: 30
          if-no-files-found: error
