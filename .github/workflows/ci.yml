# CI: build + test the core engine ("the C part"), and package bw_audio.dll for
# limited distribution as a workflow artifact (repo access required to download).
#
# Scope (deliberate, see third_party/README.md):
#   - ASIO backend: BUILT. The SDK is fetched from Steinberg's official URL (the
#     repo's documented one-liner) and cached; it is dual-licensed GPLv3/proprietary
#     and this project uses the GPLv3 option, consistent with the repo LICENSE — so
#     the artifact is redistributable under GPLv3 (source = this repo at the commit).
#   - Steam Audio: BUILT (the patched phonon core, recipe = third_party/README.md),
#     cached on the submodule sha + patch hash — the first run pays the phonon
#     build, later runs restore it. The with-SDK tests (reflect/bake/path/
#     steam_decode) run, binaural is the real HRTF decode, and the artifact ships
#     phonon.dll next to bw_audio.dll (the dll does not load without it).
#   - Tools (playground/layout_tool/calib_view + calibrate/zylia_probe): BUILT and
#     shipped in the artifact. Their imgui-test-engine UI suites need a display +
#     OpenGL, which runners don't have — ctest excludes those three suites here
#     (they run locally / at the rig).
#   - Configs: x64 only. RelWithDebInfo is the full build (tested + tools);
#     Debug builds the engine + bwa_minimal for downstream debugging (smoke-run).
#
# No audio hardware on runners: the test descs force the null sink (bwa_desc.sink
# = BWA_SINK_NULL) and everything else auto-falls-back to it, by design.
name: ci

on:
  push:
    branches: [main]
    tags: ['v*']        # a tag additionally RELEASES the Unity package (see the release steps)
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write       # the release step attaches the .tgz; everything else is read-only

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 75   # the uncached phonon build is the long pole; cached runs are far under
    steps:
      - uses: actions/checkout@v6
        # no submodules by default: steam-audio-source is fetched only on a phonon cache miss

      - name: Cache ASIO SDK
        id: asiosdk
        uses: actions/cache@v5
        with:
          path: third_party/asiosdk
          key: asiosdk-v1   # bump manually to pick up a new Steinberg release

      - name: Fetch ASIO SDK (Steinberg, GPLv3 option)
        if: steps.asiosdk.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          curl.exe -fsSL -o asiosdk.zip https://www.steinberg.net/asiosdk
          Expand-Archive asiosdk.zip -DestinationPath asiosdk_tmp
          # the zip's top-level dir name varies by release — locate common/asio.h and take its parent
          $hit = Get-ChildItem asiosdk_tmp -Recurse -Filter asio.h |
                 Where-Object { $_.Directory.Name -eq 'common' } | Select-Object -First 1
          if (-not $hit) { throw "asio.h not found in the Steinberg zip — layout changed?" }
          Move-Item $hit.Directory.Parent.FullName third_party/asiosdk
          Remove-Item asiosdk.zip, asiosdk_tmp -Recurse -Force

      - name: Phonon cache key (submodule sha, no checkout needed)
        id: phonon-key
        shell: bash
        run: echo "sha=$(git rev-parse HEAD:third_party/steam-audio-source)" >> "$GITHUB_OUTPUT"

      - name: Cache phonon (built Steam Audio core)
        id: phonon
        uses: actions/cache@v5
        with:
          path: third_party/steam-audio-artifacts
          key: phonon-v1-${{ steps.phonon-key.outputs.sha }}-${{ hashFiles('third_party/patches/**') }}

      - name: Build phonon (cache miss only; recipe = third_party/README.md)
        if: steps.phonon.outputs.cache-hit != 'true'
        shell: bash
        env:
          # The pinned deps (flatbuffers 1.12, zlib, pffft, mysofa) declare pre-3.5
          # cmake_minimum_required, which CMake 4 refuses outright. This env var
          # (honored by CMake >= 3.31.7 / 4.0) is the official escape hatch.
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
        run: |
          git submodule update --init --depth 1 third_party/steam-audio-source \
            || git submodule update --init third_party/steam-audio-source
          # REQUIRED for directional reflections (upstream steam-audio#546):
          git -C third_party/steam-audio-source apply ../patches/phonon-multiplyaccumulate-align.patch

          # The pinned build scripts hard-code "Visual Studio 17 2022"; rewrite that to
          # CMake's default generator (= the VS this runner actually has, and the same
          # generator our own Configure step will use).
          GEN="$(cmake --help | sed -n 's/^\* \(Visual Studio [0-9]* [0-9]*\).*/\1/p' | head -1)"
          test -n "$GEN"
          echo "using generator: $GEN"
          sed -i "s/Visual Studio 17 2022/$GEN/g" \
              third_party/steam-audio-source/core/build/build.py \
              third_party/steam-audio-source/core/build/get_dependencies.py

          # Everything /MD (the CRT gotcha in third_party/README.md); --minimal drops
          # Embree/IPP/GPU/sample apps; skip phonon_test (CRT-fragile exe).
          cd third_party/steam-audio-source/core/build
          python get_dependencies.py --dependency flatbuffers -p windows -a x64 -t vs2022
          for d in zlib pffft mysofa; do
            python get_dependencies.py --dependency $d --sharedcrt -p windows -a x64 -t vs2022
          done
          python build.py -p windows -a x64 -t vs2022 -c release --minimal -o generate

          # build.py makes its tree in the CWD (os.makedirs("windows-vs2022-x64")), so from
          # core/build that is ./windows-vs2022-x64. Don't guess — locate the CMakeCache.
          TREE=$(dirname "$(find . -maxdepth 3 -name CMakeCache.txt | head -1)")
          test -n "$TREE" && test -d "$TREE" || { echo "generated tree not found:"; ls; exit 1; }
          echo "phonon build tree: $TREE"
          cmake -DSTEAMAUDIO_STATIC_RUNTIME=OFF "$TREE"
          cmake --build "$TREE" --config Release --target phonon
          cd ../../../..

          # Stage where BWA_WITH_STEAMAUDIO auto-detects it. find: the build-tree
          # layout is phonon's business; only the staged layout is ours.
          ART=third_party/steam-audio-artifacts
          mkdir -p "$ART/include" "$ART/lib/windows-x64"
          CORE=third_party/steam-audio-source/core
          cp "$CORE/src/core/phonon.h"                              "$ART/include/"
          cp "$(find $CORE/build -name phonon_version.h | head -1)" "$ART/include/"
          cp "$(find $CORE/build -name phonon.dll | head -1)"       "$ART/lib/windows-x64/"
          cp "$(find $CORE/build -name phonon.lib | head -1)"       "$ART/lib/windows-x64/"
          test -f "$ART/lib/windows-x64/phonon.dll" && test -f "$ART/include/phonon_version.h"

      - name: Configure
        shell: bash
        run: |
          # No -G pin: CMake defaults to the newest Visual Studio on the runner. Pinning
          # "Visual Studio 17 2022" broke when the windows-latest image dropped VS 2022.
          cmake -S . -B build -A x64 \
                -DBWA_BUILD_PLAYGROUND=ON \
                -DBWA_BUILD_CALIBVIEW=ON \
                -DBWA_BUILD_CALIBRATE=ON | tee configure.log
          # the artifact must contain the production device path AND the HRTF decode —
          # fail loudly if either didn't wire up
          grep -q "ASIO backend ENABLED" configure.log
          grep -q "Steam Audio ENABLED" configure.log

      - name: Build (RelWithDebInfo — everything)
        run: cmake --build build --config RelWithDebInfo

      - name: Build (Debug — engine + smoke only)
        run: cmake --build build --config Debug --target bw_audio bwa_minimal

      - name: Test
        # -E: the GUI UI suites need a display + OpenGL; everything else runs
        run: ctest --test-dir build -C RelWithDebInfo --output-on-failure -E '^(playground|layout_tool|calib_view)$'

      - name: Smoke (Debug)
        # the Debug dll ships too — prove it loads (incl. phonon.dll) and runs a lifecycle
        # (no device on the runner: the AUTO sink policy falls back to the silent null sink)
        run: build/Debug/bwa_minimal.exe

      - name: Stage dist
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist, dist/RelWithDebInfo, dist/Debug | Out-Null
          Copy-Item include/bw_audio.h,
                    LICENSE,
                    THIRD_PARTY-NOTICES.md dist/
          # the JSONs live NEXT TO the tools: playground/layout_tool resolve
          # ./cave_layout.json + ./constraints.json relative to their working dir
          Copy-Item examples/cave_layout.json,
                    examples/constraints.json dist/RelWithDebInfo/
          Copy-Item build/RelWithDebInfo/bw_audio.dll,
                    build/RelWithDebInfo/bw_audio.lib,
                    build/RelWithDebInfo/bw_audio.pdb,
                    build/RelWithDebInfo/phonon.dll,
                    build/RelWithDebInfo/bwa_minimal.exe,
                    build/RelWithDebInfo/bwa_playground.exe,
                    build/RelWithDebInfo/bwa_layout_tool.exe,
                    build/RelWithDebInfo/bwa_calib_view.exe,
                    build/RelWithDebInfo/bwa_calibrate.exe,
                    build/RelWithDebInfo/bwa_zylia_probe.exe dist/RelWithDebInfo/
          Copy-Item build/Debug/bw_audio.dll,
                    build/Debug/bw_audio.lib,
                    build/Debug/bw_audio.pdb,
                    build/Debug/phonon.dll,
                    build/Debug/bwa_minimal.exe dist/Debug/
          @"
          bw_audio win64 — limited distribution build
          commit   ${{ github.sha }} (${{ github.ref_name }})
          built    $((Get-Date).ToUniversalTime().ToString('s'))Z  (GitHub Actions run ${{ github.run_id }})
          try      RelWithDebInfo\bwa_playground.exe — needs no audio device (renders
                   silently, the 3D view + meters stay live); bwa_playground --help for keys
          needs    the Microsoft VC++ x64 runtime (vcruntime140*.dll). Any machine with
                   Visual Studio has it; otherwise https://aka.ms/vs/17/release/vc_redist.x64.exe
          backends ASIO=yes  SteamAudio=yes (patched phonon 4.8.1+10: HRTF decode,
                   occlusion, reflections, pathing — third_party/README.md)
          contents RelWithDebInfo/ — bw_audio.dll/.lib/.pdb + phonon.dll (KEEP THEM
                   TOGETHER: bw_audio.dll does not load without phonon.dll beside it),
                   bwa_minimal.exe (smoke check: runs the whole client lifecycle, no
                   hardware needed), tools: bwa_playground / bwa_layout_tool /
                   bwa_calib_view (GUI — need a display), bwa_calibrate + bwa_zylia_probe
                   (console), cave_layout.json + constraints.json (example layout +
                   room, read by the tools from their own directory). Debug/ — engine
                   dll/.lib/.pdb + phonon.dll + bwa_minimal. Root — include/bw_audio.h.
                   x64 only.
          license  GPLv3 (LICENSE) + THIRD_PARTY-NOTICES.md; complete source:
                   https://github.com/aforren1/cave-audio/tree/${{ github.sha }}
          "@ | Out-File -Encoding utf8 dist/DIST.txt
          Get-Content dist/DIST.txt

      # The Unity package. Packed on EVERY run (not just tags) so a broken package - a missing .meta,
      # a version/tag mismatch, a tarball that somehow lost its DLLs - fails the build rather than the
      # release. It goes in its OWN folder (dist/unity), because engine consumers and Unity consumers
      # want different things and the release below ships them as separate assets.
      - name: Pack UPM package
        shell: pwsh
        env:
          TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: |
          # -PluginsFrom pins RelWithDebInfo: the Debug build above ALSO POST_BUILD-stages into the
          # package folder (last config wins), so packing without it would ship the Debug engine.
          # NB: splat a HASHTABLE, not an array. Array splatting binds POSITIONALLY, so '-PluginsFrom'
          # would land in $Version and the trailing value would have no parameter left to bind to.
          $a = @{ PluginsFrom = 'build/RelWithDebInfo'; OutDir = 'dist/unity' }
          if ($env:TAG) { $a.Version = $env:TAG }           # tag must match package.json, or this fails
          ./tools/upm/pack.ps1 @a

      # Two artifacts, not one bag: the engine (native consumers - the C ABI, the tools, the CAVE
      # machine) and the Unity package (a single .tgz). Downloading one no longer drags in the other.
      - name: Upload artifact (engine + tools)
        uses: actions/upload-artifact@v6
        with:
          name: bw_audio-win64-r${{ github.run_number }}
          path: |
            dist/
            !dist/unity/**
          retention-days: 30
          if-no-files-found: error

      - name: Upload artifact (Unity package)
        uses: actions/upload-artifact@v6
        with:
          name: unity-package-r${{ github.run_number }}
          path: dist/unity/
          retention-days: 30
          if-no-files-found: error

      # ---- release (tags only) -------------------------------------------------------------------
      # The Release IS the distribution - there is no registry. TWO assets, because there are two
      # audiences and they want different bytes:
      #
      #   com.brainworks.bw_audio-<ver>.tgz   the Unity package (C# + the two DLLs, import settings set).
      #                                      Installs via Package Manager > "+" > "from tarball".
      #   bw_audio-win64-<tag>.zip            the engine itself: dll/lib/pdb + bw_audio.h + the tools.
      #                                      The durable home for the native side - workflow artifacts
      #                                      expire, a release does not.
      #
      # Keep the engine bundle a .zip, and the package the only .tgz on the release. Every UPM registry
      # speaks the npm protocol and keys on a single publishable tarball, so should this ever be listed
      # on one, that stays a config change rather than a rebuild. It costs nothing to preserve.
      - name: Release (engine zip + Unity package tarball)
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $tgz = (Get-Item dist/unity/*.tgz).FullName

          # The engine bundle: everything staged in dist/ EXCEPT the Unity package (which ships on its
          # own). GPLv3 travels with it - LICENSE, THIRD_PARTY-NOTICES.md and DIST.txt (which names the
          # commit and links the complete source) are already staged there.
          $zip = "dist/bw_audio-win64-$tag.zip"
          Compress-Archive -Path dist/RelWithDebInfo, dist/Debug, dist/bw_audio.h, dist/LICENSE,
                                 dist/THIRD_PARTY-NOTICES.md, dist/DIST.txt `
                           -DestinationPath $zip -Force
          $zip = (Get-Item $zip).FullName

          $notes = @"
          Windows x64. Two downloads: the **Unity package**, and the **engine** itself.

          ## Unity

          Download ``com.brainworks.bw_audio-*.tgz`` below, then in Unity:
          **Package Manager > ``+`` > *Install package from tarball...*** That is the whole install.

          The package ships the native engine (``bw_audio.dll`` + ``phonon.dll``) with its import settings
          already set - nothing to build. Requires **Unity 6**. Turn OFF Unity's built-in audio
          (*Project Settings > Audio > Disable Unity Audio*): the engine owns the device.

          ## Engine (C ABI, tools)

          ``bw_audio-win64-$tag.zip`` - ``bw_audio.dll`` / ``.lib`` / ``.pdb`` + ``phonon.dll`` (**keep the
          pair together**, the dll will not load without it), ``bw_audio.h``, and the tools:
          ``bwa_playground``, ``bwa_layout_tool``, ``bwa_calib_view``, ``bwa_calibrate``, ``bwa_zylia_probe``.
          Needs the MSVC x64 runtime. See ``DIST.txt`` inside for the exact commit.

          ## License

          **GPLv3.** ``bw_audio.dll`` links the ASIO SDK under its GPLv3 option. Internal use never
          triggers copyleft - it is a *distribution* condition - but SHIPPING an app that includes this
          DLL to third parties would put that app under GPLv3. See ``docs/build.md`` for the
          proprietary-ASIO alternative.
          "@
          # One .tgz (the package) + one .zip (the engine). Keep it that way - see the note above.
          gh release create $tag $tgz $zip --title "bw_audio $tag" --notes $notes
