# Build the patched Steam Audio core (phonon) STATICALLY and stage it where CMake auto-detects it.
#
# THIN WRAPPER. The recipe itself lives in tools/phonon/build-phonon.sh, and this action only maps
# its inputs onto that script's environment. The reason for the split is the Python wheel: the
# manylinux wheel's phonon has to be built INSIDE the container that links it, a composite action
# runs on the RUNNER, and two copies of a build recipe drift. So there is one script and two
# callers - this action, and tools/phonon/cibw-before-all-linux.sh.
#
# One action, every platform. The windows, linux and macos jobs all call it (docs/backends.md)
# rather than copying its steps, and the android job is the fourth caller.
# The prose version of the recipe is third_party/README.md, section "Steam Audio" - change the
# script and that section together.
#
# It does NOT cache. The caller owns the cache step (key = submodule sha + patch hash) and runs
# this action on a miss, because only the caller knows which artifacts path it restored.
#
# INPUTS
#   platform      build.py -p value: windows | linux | osx | android.        (required)
#   arch          build.py -a value: x64 | arm64 | armv7 | x86.              (default: x64)
#   toolchain     build.py -t value: vs2013 | vs2015 | vs2017 | vs2019 | vs2022. WINDOWS ONLY,
#                 and IGNORED on every other platform - both pinned scripts accept only those
#                 five spellings, and off Windows they pick the generator from -p alone (Unix
#                 Makefiles for linux and android, Xcode for osx).       (default: vs2022)
#   stage-dir     the lib/<stage-dir> directory to stage into, under
#                 third_party/steam-audio-artifacts/lib/. Must match the name CMake looks for
#                 (root CMakeLists.txt, BWA_PHONON_PLATFORMS): windows-x64, linux-x64,
#                 osx-universal, android-arm64, ...                          (required)
#   fft           which FFT dependency phonon links. pffft on every platform, Android included:
#                 phonon can link FFTS there instead, but only behind a non-default
#                 STEAMAUDIO_ENABLE_FFTS and with NEON turned off on arm64, so we do not.
#                                                                            (default: pffft)
#   cmake-flags   extra -D flags for the phonon configure, space separated. Known needs:
#                 Linux on gcc 13 or older wants -DSTEAMAUDIO_ENABLE_AVX=OFF, because the default
#                 ON adds -fabi-version=6 and that breaks <future> inside hrtf.cpp. Measured:
#                 gcc 11.5 and 13.3 fail, gcc 14.3 passes. Runner images ship gcc 13.
#                                                                            (default: empty)
#   artifacts-dir where to stage. Leave it alone unless STEAMAUDIO_DIR is overridden too.
#                 (default: third_party/steam-audio-artifacts)
#
# WHAT IT STAGES, and the Windows CRT note, are in the script's own header.

name: Build phonon (static)
description: Build the patched Steam Audio core as static archives and stage them for CMake.

inputs:
  platform:
    description: build.py -p value (windows, linux, osx, android)
    required: true
  arch:
    description: build.py -a value (x64, arm64, armv7, x86)
    required: false
    default: x64
  toolchain:
    description: build.py -t value (vs2022 and the other vs20xx spellings). Windows only; ignored elsewhere
    required: false
    default: ''
  stage-dir:
    description: lib/<stage-dir> to stage into (windows-x64, linux-x64, osx-universal, android-arm64)
    required: true
  fft:
    description: FFT dependency to build and link (pffft on every platform)
    required: false
    default: pffft
  cmake-flags:
    description: extra -D flags for the phonon configure, space separated
    required: false
    default: ''
  artifacts-dir:
    description: staging root (must match STEAMAUDIO_DIR)
    required: false
    default: third_party/steam-audio-artifacts

runs:
  using: composite
  steps:
    - name: Build and stage phonon (${{ inputs.stage-dir }}, static)
      shell: bash
      env:
        BWA_PLATFORM: ${{ inputs.platform }}
        BWA_ARCH: ${{ inputs.arch }}
        BWA_TOOLCHAIN: ${{ inputs.toolchain }}
        BWA_STAGE_DIR: ${{ inputs.stage-dir }}
        BWA_FFT: ${{ inputs.fft }}
        BWA_CMAKE_FLAGS: ${{ inputs.cmake-flags }}
        BWA_ART: ${{ inputs.artifacts-dir }}
      # $GITHUB_WORKSPACE rather than github.action_path: the two resolve to the same file for a
      # local action, and this spelling says which TREE the build operates on. The script finds
      # the repo root from its own path, so the working directory does not matter.
      run: bash "$GITHUB_WORKSPACE/tools/phonon/build-phonon.sh"
